<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="history.lich_su_tap_luyen_david_coaching">Lịch sử tập luyện — David Coaching</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">
<style>
  .app-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface); gap:12px; flex-wrap:wrap; }
  .app-header .brand-mini { font-family:var(--font-display); font-weight:700; color:var(--navy-900); }
  .app-header-actions { display:flex; align-items:center; gap:10px; }
  .app-body { max-width: 760px; margin: 0 auto; padding: 28px 20px 90px; }
  #boot-status { text-align:center; padding:60px 20px; color:var(--text-500); }
  #app-content { display:none; }

  .history-toolbar { display:grid; grid-template-columns:minmax(0,1fr) minmax(170px,.42fr); gap:10px; margin-bottom:12px; }
  .history-toolbar input,.history-toolbar select { width:100%; min-height:44px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text-900); padding:9px 12px; font:inherit; }
  .history-result-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 2px 14px; color:var(--text-500); font-size:var(--dc-fs-xs); }
  .sess-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .sess-card[open] { box-shadow:var(--shadow-sm); }
  .sess-summary { list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:64px; padding:15px 18px; cursor:pointer; }
  .sess-summary::-webkit-details-marker { display:none; }
  .sess-summary::after { content:'+'; width:28px; height:28px; flex:0 0 28px; display:grid; place-items:center; border-radius:50%; background:var(--surface-alt); color:var(--navy-900); font-weight:800; }
  .sess-card[open] .sess-summary::after { content:'−'; }
  .sess-summary-main { min-width:0; display:grid; gap:3px; }
  .sess-summary-meta { color:var(--text-500); font-size:var(--dc-fs-xs); font-weight:500; }
  .sess-body { padding:0 18px 18px; }
  .sess-head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .sess-head .sess-day { font-weight:800; font-size:var(--dc-fs-md); color:var(--navy-900); }
  .sess-head .sess-meta { font-size:var(--dc-fs-sm); color:var(--text-500); }
  .log-row { padding:10px 0; border-top:1px dashed var(--border); }
  .log-row:first-child { border-top:none; }
  .log-row-head { display:flex; align-items:center; gap:8px; margin-bottom:3px; font-weight:700; }
  .log-row-detail { font-size:var(--dc-fs-sm); color:var(--text-500); line-height:1.5; }
  .outcome-pill { font-size:var(--dc-fs-xs); font-weight:800; padding:3px 10px; border-radius:999px; }
  .outcome-pill.up { background:#e3f3ec; color:var(--dc-good-text); }
  .outcome-pill.hold { background:var(--surface-alt); color:var(--text-500); }
  .outcome-pill.down { background:#fdf1ee; color:var(--dc-warn-text); }
  .outcome-pill.sub { background:var(--accent-light); color:var(--accent-dark); }
  .outcome-pill.skipped { background:var(--surface-alt); color:var(--text-500); }
  .pr-pill { font-size:var(--dc-fs-xs); font-weight:800; padding:3px 10px; border-radius:999px; margin-left:6px; background:linear-gradient(135deg,#f6c453,#dd9a2b); color:#3a2a06; }
  .note-line { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:var(--dc-fs-sm); color:var(--text-700); font-style:italic; }
  .history-load-more { width:100%; justify-content:center; margin-top:6px; }
  @media(max-width:560px){.history-toolbar{grid-template-columns:1fr}.sess-summary{padding:14px}.sess-body{padding:0 14px 15px}.app-body{padding-left:14px;padding-right:14px}}
</style>
<link rel="stylesheet" href="client-ui.css">
<link rel="stylesheet" href="client-history.css">
<link rel="stylesheet" href="polish.css">
</head>
<body class="client-ui cu-history">
<header class="app-header">
  <span class="brand brand-page">
    <span class="brand-mark">DC</span>
    <span class="brand-mini" data-i18n="history.lich_su_tap_luyen">Lịch sử tập luyện</span>
  </span>
  <div class="app-header-actions">
    <a href="client.html" class="btn btn-outline btn-compact" data-i18n="history.buoi_tap">◀ Buổi tập</a>
    <button class="btn btn-outline btn-compact" id="logout-btn" data-i18n-init="history.dang_xuat">Đăng xuất</button>
  </div>
</header>

<div id="boot-status" class="dc-skeleton" role="status" aria-label="Đang tải" data-i18n-aria-label="history.dang_tai"><span class="dc-skel dc-skel-hero"></span><span class="dc-skel dc-skel-line"></span><span class="dc-skel dc-skel-card"></span><span class="dc-skel dc-skel-card"></span></div>

<div class="app-body" id="app-content">
  <section class="cu-hero" aria-labelledby="cu-hy-heading">
    <div class="cu-wrap">
      <div class="cu-hero-top">
        <span class="cu-logo" aria-hidden="true">DC</span>
        <span class="cu-hello"><span data-i18n="home.hello">Chào</span> <span id="student-name"></span></span>
      </div>
      <div id="training-tabs"></div>
      <h1 class="cu-eyebrow" id="cu-hy-heading" data-i18n="history.ban_da_tap_nhung_gi">Bạn đã tập những gì</h1>
      <div id="cu-hy-today"></div>
    </div>
  </section>

  <div class="cu-history-body">
  <p class="small-note" style="margin:0 4px 12px;" data-i18n="history.toan_bo_buoi_tap_da_ghi">Toàn bộ buổi tập đã ghi nhận — đúng những gì bạn nhập, không thêm bớt.</p>
  <div class="history-toolbar" aria-label="Tìm và lọc lịch sử" data-i18n-aria-label="history.tim_va_loc_lich_su">
    <input id="history-search" type="search" placeholder="Tìm theo tên bài tập…" aria-label="Tìm theo tên bài tập…" autocomplete="off" data-i18n-placeholder="history.tim_theo_ten_bai_tap" data-i18n-aria-label="history.tim_theo_ten_bai_tap">
    <select id="history-filter" aria-label="Lọc lịch sử" data-i18n-aria-label="history.loc_lich_su">
      <option value="all" data-i18n="history.tat_ca">Tất cả</option>
      <option value="feedback" data-i18n="history.co_phan_hoi">Có phản hồi</option>
      <option value="pr" data-i18n="history.co_ky_luc">Có kỷ lục</option>
      <option value="adjusted" data-i18n="history.co_dieu_chinh_bo_bai">Có điều chỉnh / bỏ bài</option>
    </select>
  </div>
  <div class="history-result-row"><span id="history-count"></span><span data-i18n="history.mo_mot_buoi_de_xem_chi">Mở một buổi để xem chi tiết</span></div>
  <div id="history-list"></div>
  <button type="button" class="btn btn-outline history-load-more" id="history-load-more" data-i18n-init="history.xem_them_5_buoi">Xem thêm 5 buổi</button>
  </div>
</div>

<script type="module">
import { auth } from './firebase-init.js';
import { mountAppShell } from './app-shell.js';
import { mountTrainingTabs } from './training-tabs.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import { getMyRole, getStudent, listSessionHistory, getStudentAssignments } from './training-data.js';
import { SCHEME } from './progression-engine.js';
import { getExerciseById } from './exercise-seed-data.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { createExerciseNotesController } from './exercise-notes-ui.js';
import { completionReasonText as completionReasonLabel } from './coaching-decision-utils.js';
import { orderNoteText } from './exercise-order.js';
import { sessionsThisWeek } from './home-utils.js';
import { todayIso } from './nutrition-log-utils.js';
import { loadPerSuffix, weekdayDate } from './client-ui.js';
import { sessionChipsMarkup, sessionTotals, setTableMarkup } from './history-view.js';
import { fmtDate, t } from './i18n.js';

const $ = (id) => document.getElementById(id);

const OUTCOME_LABEL = { up: t('history.outcome.up'), hold: t('workout.outcome.hold'), down: t('workout.outcome.down'), sub: t('history.outcome.sub'), skipped: t('history.outcome.skipped') };

let assignments = [];
let exerciseNotes = null;
let allSessions = [];
let visibleSessionCount = 5;
const HISTORY_MAX = 100;

const sessionDay = (session) => (session.performedAt?.toDate ? session.performedAt.toDate() : null);
const isoOf = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

/** The navy band: sessions recorded, the latest, this week, records and the usual length. */
function renderBand() {
  const box = $('cu-hy-today');
  if (!allSessions.length) {
    box.innerHTML = `<h2 class="cu-hy-title">${t('history.none')}</h2><p class="cu-hy-last">${t('workout.firstSessionHere')}</p>`;
    return;
  }
  // The list is read newest first and stops at HISTORY_MAX, so a full list means "at least".
  const total = allSessions.length >= HISTORY_MAX ? `${HISTORY_MAX}+` : `${allSessions.length}`;
  const latest = allSessions[0];
  const latestDay = sessionDay(latest);
  const records = allSessions.reduce((sum, session) => sum + (session.exerciseLogs || []).filter((log) => log.isPR).length, 0);
  const minutes = allSessions.map((session) => Number(session.durationSeconds)).filter((value) => value > 0);
  const average = minutes.length ? Math.round(minutes.reduce((a, b) => a + b, 0) / minutes.length / 60) : null;
  const stats = [
    ['', t('home.week'), `${sessionsThisWeek(allSessions, todayIso())}<small>${t('home.sessions', { n: sessionsThisWeek(allSessions, todayIso()) })}</small>`],
    ['pr', t('history.records'), `${records}`],
    ['', t('history.perSession'), average ? `${average}<small>${t('workout.result.min')}</small>` : '–'],
  ];
  box.innerHTML = `<div class="cu-hy-count">${total} <small>${t('history.saved', { n: allSessions.length })}</small></div>
    <p class="cu-hy-last">${t('history.latest', { date: latestDay ? escapeHtml(weekdayDate(isoOf(latestDay))) : '—', day: escapeHtml(latest.dayLabel || '') })}</p>
    <dl class="cu-hy-stats">${stats.map(([cls, label, value]) => `<div${cls ? ` class="${cls}"` : ''}><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['student']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'student') { $('boot-status').textContent = t('home.notStudent'); return; }
    mountAppShell({ role: 'student', active: 'training' });
    mountTrainingTabs('history');
    const profile = await getStudent(user.uid);
    $('student-name').textContent = profile ? profile.displayName : '';
    exerciseNotes = createExerciseNotesController({
      role: 'student', authorUid: user.uid, authorName: profile?.displayName || t('workout.clientFallback'),
      getStudentUid: () => user.uid,
    });
    assignments = await getStudentAssignments(user.uid, { activeOnly: false });
    const sessions = await listSessionHistory(user.uid, { max: HISTORY_MAX });
    renderHistory(sessions);
    renderBand();
    $('boot-status').style.display = 'none';
    $('app-content').style.display = 'block';
  } catch (error) {
    console.error(error);
    $('boot-status').textContent = t('history.loadFailed');
  }
});

$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });
$('history-search').addEventListener('input', () => { visibleSessionCount = 5; renderHistoryList(); });
$('history-filter').addEventListener('change', () => { visibleSessionCount = 5; renderHistoryList(); });
$('history-load-more').addEventListener('click', () => { visibleSessionCount += 5; renderHistoryList(); });

function exerciseNameForLog(log) {
  const a = assignments.find((x) => x.id === log.assignmentId);
  const baseName = a ? a.exerciseNameSnapshot.vi : (log.exerciseNameSnapshot?.vi || getExerciseById(log.exerciseId)?.nameVi || log.exerciseId);
  if (log.substitutedExerciseId) {
    const subEx = getExerciseById(log.substitutedExerciseId);
    if (subEx) return `${baseName}${t('workout.sub.did', { name: subEx.nameVi })}`;
  }
  if (log.source === 'extra') return `${baseName}${t('history.extra')}`;
  return baseName;
}

function formatActualSets(log) {
  const sets = log.actualSets || [];
  if (!sets.length) return '—';
  const weightsVary = sets.some((s) => s.weight !== sets[0].weight);
  const per = loadPerSuffix(log.substitutedExerciseId || log.exerciseId);
  let text;
  if (!weightsVary) {
    text = t('history.sameLoad', { kg: sets[0].weight, per, n: sets.length, reps: sets.map((s) => s.reps).join(', ') });
  } else {
    text = sets.map((s, i) => t('workout.next.pyramidSet', { i: i + 1, kg: s.weight, per, reps: s.reps })).join(' · ');
  }
  const lastRir = sets[sets.length - 1].rir;
  if (log.scheme === SCHEME.LAST_SET_RIR && lastRir != null) text += t('history.lastRir', { n: lastRir });
  return text;
}

function renderHistory(sessions) {
  allSessions = Array.isArray(sessions) ? sessions : [];
  visibleSessionCount = 5;
  renderHistoryList();
}

function sessionMatchesFilter(session, filter) {
  const logs = session.exerciseLogs || [];
  if (filter === 'feedback') return Boolean(session.clientNote || session.coachNote);
  if (filter === 'pr') return logs.some((log) => log.isPR);
  if (filter === 'adjusted') {
    return Boolean(session.completionContext?.endedEarly) || logs.some((log) =>
      log.source === 'extra' || log.outcome === 'sub' || log.outcome === 'skipped' || log.status === 'skipped' ||
      (log.adjustedSetCount && log.plannedSetCount && log.adjustedSetCount !== log.plannedSetCount)
    );
  }
  return true;
}

function filteredSessions() {
  const query = $('history-search').value.trim().toLocaleLowerCase('vi');
  const filter = $('history-filter').value;
  return allSessions.filter((session) => {
    if (!sessionMatchesFilter(session, filter)) return false;
    if (!query) return true;
    return (session.exerciseLogs || []).some((log) => exerciseNameForLog(log).toLocaleLowerCase('vi').includes(query));
  });
}

function renderHistoryList() {
  const wrap = $('history-list');
  const sessions = filteredSessions();
  $('history-count').textContent = sessions.length ? t('history.matching', { n: sessions.length }) : '';
  $('history-load-more').style.display = sessions.length > visibleSessionCount ? 'inline-flex' : 'none';
  if (!sessions.length) {
    wrap.innerHTML = allSessions.length
      ? `<div class="dc-empty"><strong>${t('history.noMatch')}</strong>${t('history.noMatchCopy')}<div class="dc-empty-actions"><button type="button" class="dc-btn dc-btn-secondary" id="history-clear-filters">${t('history.clear')}</button></div></div>`
      : `<div class="dc-empty"><strong>${t('history.noSessions')}</strong>${t('workout.firstSessionHere')}<div class="dc-empty-actions"><a class="dc-btn dc-btn-primary" href="client.html">${t('history.goTrain')}</a></div></div>`;
    // Xoá tìm kiếm và bộ lọc để thấy lại toàn bộ lịch sử.
    $('history-clear-filters')?.addEventListener('click', () => {
      $('history-search').value = '';
      $('history-filter').value = $('history-filter').options[0].value;
      visibleSessionCount = 5;
      renderHistoryList();
    });
    return;
  }
  wrap.innerHTML = '';
  sessions.slice(0, visibleSessionCount).forEach((s, index) => {
    const card = document.createElement('details');
    card.className = 'sess-card';
    card.open = index === 0;
    const when = s.performedAt && s.performedAt.toDate ? fmtDate(s.performedAt.toDate(), { year: true, pad: false }) : '—';
    const duration = s.durationSeconds != null ? ` · ${Math.round(s.durationSeconds / 60)}${t('workout.result.min')}` : '';
    const summary = document.createElement('summary');
    summary.className = 'sess-summary';
    summary.innerHTML = `<span class="sess-summary-main"><span class="sess-day">${t('workout.dayName', { day: escapeHtml(s.dayLabel) })}</span><span class="sess-summary-meta">${when}${duration} · ${t('workout.exerciseCount', { n: (s.exerciseLogs || []).length })}</span>${sessionChipsMarkup(sessionTotals(s))}</span>`;
    const body = document.createElement('div');
    body.className = 'sess-body';
    if (s.completionContext?.endedEarly) body.innerHTML = `<div class="note-line">${t('history.endedEarly')} · ${escapeHtml(completionReasonLabel(s.completionContext.earlyEndReason))}${s.completionContext.earlyEndReasonNote ? ` · ${escapeHtml(s.completionContext.earlyEndReasonNote)}` : ''}</div>`;
    const orderNote = orderNoteText(s.completionContext, { mine: true });
    if (orderNote) body.insertAdjacentHTML('beforeend', `<div class="note-line">${escapeHtml(orderNote)}</div>`);
    card.append(summary, body);
    (s.exerciseLogs || []).forEach((log) => {
      const outcome = log.outcome || 'hold';
      const name = exerciseNameForLog(log);
      const plannedText = log.planned ? t('workout.extra.levelKg', { kg: log.planned.weight, per: loadPerSuffix(log.substitutedExerciseId || log.exerciseId), sets: log.planned.sets, reps: log.planned.reps }) : '—';
      const isSkipped = outcome === 'skipped' || log.status === 'skipped';
      const actualText = isSkipped ? t('history.skippedOnly') : formatActualSets(log);
      const restText = log.source === 'extra' && log.restSeconds ? t('history.rest', { n: log.restSeconds }) : '';
      const completionReason = log.completionReason || log.skipReason;
      const completionReasonText = completionReason ? `${t('history.reason', { reason: completionReasonLabel(completionReason) })}${log.completionReasonNote || log.skipReasonNote ? ` — ${log.completionReasonNote || log.skipReasonNote}` : ''}` : '';
      const adjustedText = log.adjustedSetCount && log.plannedSetCount && log.adjustedSetCount !== log.plannedSetCount
        ? t('history.adjusted', { n: log.adjustedSetCount }) : '';
      const row = document.createElement('div');
      row.className = 'log-row';
      const prBadge = log.isPR ? `<span class="pr-pill">🏆 ${t('history.record')}</span>` : '';
      row.innerHTML = `
        <div class="log-row-head">${escapeHtml(name)}<span class="outcome-pill ${outcome}">${OUTCOME_LABEL[outcome] || outcome}</span>${prBadge}</div>
        ${isSkipped
          ? `<div class="log-row-detail">${t('history.plan', { plan: escapeHtml(plannedText) })}${escapeHtml(completionReasonText)}</div>
        <div class="log-row-detail">${t('history.did', { what: escapeHtml(actualText) })}</div>`
          : `${setTableMarkup(log) || `<div class="log-row-detail">${t('history.did', { what: escapeHtml(actualText) })}</div>`}
        ${adjustedText || completionReasonText || restText ? `<div class="log-row-detail">${escapeHtml(`${adjustedText}${completionReasonText}${restText}`.replace(/^ · /, ''))}</div>` : ''}`}
        <button type="button" class="exercise-note-btn" style="margin-top:8px;"><span class="exercise-note-dot"></span>${t('workout.block.notes')}</button>
      `;
      row.querySelector('.exercise-note-btn').addEventListener('click', async () => {
        const performedId = log.substitutedExerciseId || log.exerciseId;
        const performedExercise = getExerciseById(performedId);
        await exerciseNotes?.open({
          sessionId: s.id,
          sessionLabel: s.dayLabel || '',
          sessionExerciseId: log.sessionExerciseId || '',
          assignmentId: log.assignmentId || '',
          exerciseId: performedId,
          exerciseName: performedExercise?.nameVi || name,
        });
      });
      body.appendChild(row);
    });
    if (s.clientNote) {
      body.insertAdjacentHTML('beforeend', `<div class="note-line">${t('history.yourNote', { note: escapeHtml(s.clientNote) })}</div>`);
    }
    if (s.coachNote) {
      body.insertAdjacentHTML('beforeend', `<div class="note-line">${t('history.coachNote', { note: escapeHtml(s.coachNote) })}</div>`);
    }
    wrap.appendChild(card);
  });
}

function escapeHtml(str) { return String(str ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
