<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="dp.bo_dung_giao_an_david_coaching">Bộ dựng giáo án — David Coaching</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="coach-ui.css">
<style>
  .app-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface); gap:12px; flex-wrap:wrap; }
  .app-header .brand-mini { font-family:var(--font-display); font-weight:700; color:var(--navy-900); }
  .app-body { max-width: 880px; margin: 0 auto; padding: 28px 20px 90px; }
  #boot-status { text-align:center; padding:60px 20px; color:var(--text-500); }
  #app-content { display:none; }

  .planner-form { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; align-items:end; }
  .planner-form .field { margin-bottom:0; }
  .planner-status { margin:12px 0 0; font-size:var(--dc-fs-sm); color:var(--text-500); }
  .planner-reason { margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--caution-bg); color:var(--caution-text); font-size:var(--dc-fs-sm); }
  .planner-david-note { margin-top:16px; padding:14px 16px; border-left:4px solid var(--accent); border-radius:0 10px 10px 0; background:var(--surface); white-space:pre-line; font-size:var(--dc-fs-sm); }
  .planner-warn { margin:12px 0 0; padding-left:18px; font-size:var(--dc-fs-sm); color:var(--caution-text); }

  .day-card { margin-top:18px; padding:18px 20px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
  .day-card > h3 { margin:0 0 4px; font-size:var(--dc-fs-lg); }
  .day-card > .small-note { margin:0 0 6px; }
  .slot { padding:14px 0; border-top:1px dashed var(--border); }
  .slot:first-of-type { border-top:0; }
  .slot-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .slot-head strong { font-size:var(--dc-fs-md); }
  .slot-muscles { font-size:var(--dc-fs-xs); color:var(--text-500); }
  .slot-note { margin:4px 0 0; font-size:var(--dc-fs-sm); font-style:italic; color:var(--text-500); white-space:pre-line; }
  .slot-missing { display:inline-block; margin:8px 0 0; padding:3px 10px; border-radius:999px; background:var(--caution-bg); color:var(--caution-text); font-size:var(--dc-fs-xs); font-weight:700; }
  .slot-missing[hidden] { display:none; }
  .slot .field { margin:10px 0 0; }
  .slot-nums { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px; margin-top:10px; }
  .slot-nums label { display:block; font-size:var(--dc-fs-xs); font-weight:700; color:var(--text-500); margin-bottom:3px; }
  .slot-nums input { width:100%; box-sizing:border-box; padding:9px 8px; min-height:44px; border-radius:8px; border:1.5px solid var(--border); font:inherit; }
  .slot-scheme { margin:8px 0 0; font-size:var(--dc-fs-xs); color:var(--text-500); }
  .slot-nopick { margin:6px 0 0; font-size:var(--dc-fs-xs); color:var(--caution-text); }

  .vol-card { margin-top:22px; padding:18px 20px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
  .vol-card h3 { margin:0 0 4px; font-size:var(--dc-fs-lg); }
  .vol-table { width:100%; min-width:0; border-collapse:collapse; margin-top:10px; font-size:var(--dc-fs-sm); background:transparent; }
  .vol-table tr, .vol-table th, .vol-table td { background:transparent !important; }
  .vol-table th { text-align:left; font-size:var(--dc-fs-xs); letter-spacing:.06em; text-transform:uppercase; color:var(--text-500); padding:6px 4px; border-bottom:1px solid var(--border); }
  /* Bảng này không có nền navy cho tiêu đề (nền trong suốt), nên chữ tiêu đề phải tối:
     lớp style coach tô chữ tiêu đề màu sáng cho nền navy và làm chữ ở đây gần như mất (2026-11-16). */
  body.coach-ui .vol-table thead th { color:var(--dc-text-500); font-family:var(--dc-font); font-weight:700; }
  .vol-table td { padding:9px 4px; border-bottom:1px solid var(--border); }
  .vol-table td.num { font-variant-numeric:tabular-nums; font-weight:700; }
  .vol-table small { font-size:var(--dc-fs-xs); }
  .vol-ok { color:var(--note-text); font-weight:700; }
  .vol-low, .vol-high { color:var(--caution-text); font-weight:700; }
  .draft-card { margin-top:22px; padding:18px 20px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
  .draft-card h3 { margin:0 0 4px; font-size:var(--dc-fs-lg); }
  .draft-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin-top:12px; }
  .draft-grid .field { margin:0; }
  .draft-grid .wide { grid-column:1 / -1; }
  .draft-card textarea { width:100%; box-sizing:border-box; padding:11px 14px; border-radius:8px; border:1.5px solid var(--border); font:inherit; resize:vertical; }
  .draft-actions { margin-top:14px; }
  .draft-status { margin:12px 0 0; padding:12px 14px; border-radius:10px; font-size:var(--dc-fs-sm); }
  .draft-status:empty { display:none; }
  .draft-status.error { background:var(--caution-bg); color:var(--caution-text); }
  .draft-status.ok { background:var(--note-bg); color:var(--note-text); }
  .draft-status ul { margin:6px 0 0; padding-left:18px; }
  .planner-foot { margin-top:16px; font-size:var(--dc-fs-sm); color:var(--text-500); }

  @media (max-width:640px) {
    .app-body { padding-left:14px; padding-right:14px; }
    .planner-form { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .planner-form button { grid-column:1 / -1; }
    .slot-nums { grid-template-columns:repeat(3, minmax(0, 1fr)); }
    .day-card, .vol-card, .draft-card { padding:16px; }
    .draft-grid { grid-template-columns:minmax(0, 1fr); }
  }
</style>
<link rel="stylesheet" href="polish.css">
</head>
<body class="coach-ui">
<header class="app-header">
  <span class="brand brand-page">
    <span class="brand-mark">DC</span>
    <span class="brand-mini" data-i18n="dp.bo_dung_giao_an">Bộ dựng giáo án</span>
  </span>
  <div class="header-group">
    <a href="program-library.html" class="btn btn-outline btn-compact" data-app-shell-hidden="true" data-i18n="dp.thu_vien_giao_an">◀ Thư viện giáo án</a>
    <button class="btn btn-outline btn-compact" id="logout-btn" data-i18n-init="exrev.dang_xuat">Đăng xuất</button>
  </div>
</header>

<div id="boot-status" class="dc-skeleton" role="status" aria-label="Đang tải" data-i18n-aria-label="exrev.dang_tai"><span class="dc-skel dc-skel-hero"></span><span class="dc-skel dc-skel-line"></span><span class="dc-skel dc-skel-card"></span><span class="dc-skel dc-skel-card"></span></div>

<div class="app-body" id="app-content">
  <span class="eyebrow" data-i18n="exrev.danh_cho_coach">Dành cho coach</span>
  <h1 style="font-size:var(--dc-fs-xl);" data-i18n="dp.bo_dung_giao_an">Bộ dựng giáo án</h1>
  <p class="small-note" style="margin:-6px 0 18px;" data-i18n="dp.chon_muc_tieu_cap_do_kieu">Chọn mục tiêu, cấp độ, kiểu tập và số buổi mỗi tuần để dựng sẵn bộ khung từ quy tắc của David. Mọi ô đều sửa được. Khi ổn, lưu thành bản nháp cho một học viên: bản nháp chưa kích hoạt và học viên chưa thấy.</p>

  <div class="card">
    <div class="planner-form">
      <div class="field"><label for="goal" data-i18n="coach.goal_label">Mục tiêu</label><select id="goal"></select></div>
      <div class="field"><label for="level" data-i18n="dp.cap_do">Cấp độ</label><select id="level"></select></div>
      <div class="field"><label for="style" data-i18n="dp.kieu_tap">Kiểu tập</label><select id="style"></select></div>
      <div class="field"><label for="days" data-i18n="dp.so_buoi_moi_tuan">Số buổi mỗi tuần</label><select id="days"></select></div>
      <button type="button" class="btn btn-primary" id="build-btn" data-i18n-init="dp.dung_khung">Dựng khung</button>
    </div>
    <p class="planner-status" id="rules-status"></p>
  </div>

  <div id="planner-result"></div>
</div>

<script type="module">
import { auth } from './firebase-init.js';
import { t } from './i18n.js';
import { muscleLabel } from './muscle-labels.js';
import { mountAppShell } from './app-shell.js';
import { confirmDialog } from './app-dialog.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import { createPhaseDraft, getMyRole, listMyStudents, listPhases } from './training-data.js';
import { buildDraftAssignmentsFromSelections, draftActivationIssues } from './phase-draft-utils.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { EXERCISES, getExerciseById, groupExercisesByMuscleGroup } from './exercise-seed-data.js';
import { MUSCLE_GROUPS } from './volume-engine.js';
import { DOSE_RULES, GOALS, LEVELS, SPLITS, STYLES } from './dose-rules.js';
import { compareToTargets, draftOptionsFromPlan, normalizeRange, planProgram, planVolume, prescriptionFor } from './dose-planner.js';

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
const SCHEME_LABEL = { 1: 'SBS Original Progression', 2: t('coach.rir_set_cuoi'), 3: 'SBS Reps to Failure', 4: 'SBS Classic Overload', 5: 'SBS Fixed Total Reps', 6: 'SBS Reverse Pyramid', 7: t('ladder.reps.label'), 8: t('dp.tang_set_roi_tang_rep'), 9: t('coach.tang_rep_roi_tang_ta') };
const STATUS_TEXT = { low: t('dp.thap_hon_khoang_cua_david'), ok: t('dp.trong_khoang'), high: t('dp.cao_hon_khoang_cua_david') };

let plan = null;
let students = [];
let coachUid = null;
let saving = false;
const presetStudent = new URLSearchParams(location.search).get('student') || '';

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['coach']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'coach') { $('boot-status').textContent = t('exrev.tai_khoan_chua_duoc_thiet_lap'); return; }
    mountAppShell({ role: 'coach', active: 'programs' });
    coachUid = user.uid;
    students = await listMyStudents(coachUid).catch((error) => { console.error('listMyStudents failed', error); return []; });
    fillForm();
    $('boot-status').style.display = 'none';
    $('app-content').style.display = 'block';
  } catch (error) {
    console.error(error);
    $('boot-status').textContent = t('exrev.chua_the_tai_trang_luc_nay');
  }
});

$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });

// Tên buổi do quy tắc đặt sẵn được lưu vào giáo án bằng tiếng Việt; ở đây chỉ đổi chữ hiện ra.
const DAY_NAME = [[/^Buổi (\w+)$/, 'dp.day_letter'], [/^Thân dưới (\w+)$/, 'dp.day_lower_a'], [/^Thân trên (\w+)$/, 'dp.day_upper_a'], [/^Toàn thân · (\w+)$/, 'dp.day_full']]; // i18n-data
function dayName(label) {
  for (const [pattern, key] of DAY_NAME) { const m = String(label).match(pattern); if (m) return t(key, { x: m[1] }); }
  return label;
}
function options(list) { return list.map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.label)}</option>`).join(''); }

function fillForm() {
  $('goal').innerHTML = options(GOALS);
  $('level').innerHTML = options(LEVELS);
  refreshChoices();
  const entered = Object.values(DOSE_RULES).filter((rule) => Array.isArray(rule?.slots) && rule.slots.length).length;
  $('rules-status').textContent = entered
    ? `${t('dp.quy_tac_david_da_nhap_to', { p0: entered })}`
    : t('dp.quy_tac_david_da_nhap_chua');
}

// Only the styles that have rules for this goal and level, and the day counts they cover
// (others stay pickable but say "chưa có", or the rule's own hint, and Dựng khung explains why).
function refreshChoices() {
  const goal = $('goal').value;
  const level = $('level').value;
  const keep = $('style').value;
  const styles = STYLES.filter((style) => DOSE_RULES[`${goal}.${level}.${style.id}`]);
  $('style').innerHTML = options(styles.length ? styles : STYLES);
  if (styles.some((style) => style.id === keep)) $('style').value = keep;
  const rule = DOSE_RULES[`${goal}.${level}.${$('style').value}`];
  const covered = new Set(Object.keys({ ...SPLITS, ...(rule?.splits || {}) }).map(Number));
  const day = Number($('days').value) || 3;
  $('days').innerHTML = [1, 2, 3, 4, 5, 6, 7].map((n) => `<option value="${n}">${t('dp.buoi', { p0: n, p1: covered.has(n) ? '' : ` (${escapeHtml(rule?.uncoveredLabel || t('cj.chua_co'))})` })}</option>`).join('');
  $('days').value = String(covered.has(day) || !covered.size ? day : [...covered].sort((a, b) => Math.abs(a - day) - Math.abs(b - day))[0]);
}
['goal', 'level', 'style'].forEach((id) => $(id).addEventListener('change', refreshChoices));

$('build-btn').addEventListener('click', () => {
  const result = planProgram({
    rules: DOSE_RULES, splits: SPLITS, exercises: EXERCISES,
    goal: $('goal').value, level: $('level').value, style: $('style').value, days: $('days').value,
  });
  if (!result.ok) {
    plan = null;
    $('planner-result').innerHTML = `<div class="planner-reason" role="status">${escapeHtml(result.reason)}</div>`;
    return;
  }
  plan = result;
  render();
});

// ---- the skeleton ----

function exerciseSelect(slot) {
  const pick = (exercise) => `<option value="${escapeHtml(exercise.exerciseId)}">${escapeHtml(exercise.nameVi)}</option>`;
  if (slot.candidates.length) {
    return `<option value="">${t('dp.chon_bai')}</option>${slot.candidates.map((id) => pick(getExerciseById(id))).join('')}`;
  }
  const groups = [...groupExercisesByMuscleGroup()].map(([group, list]) => `<optgroup label="${escapeHtml(group)}">${list.map(pick).join('')}</optgroup>`).join('');
  return `<option value="">${t('dp.chon_bai')}</option>${groups}`;
}

function slotMarkup(slot, dayIndex, slotIndex) {
  const at = `data-d="${dayIndex}" data-s="${slotIndex}"`;
  const val = (value) => (value === null || value === undefined ? '' : value);
  return `<article class="slot" ${at}>
    <div class="slot-head"><strong>${escapeHtml(slot.label)}</strong><span class="slot-muscles">${escapeHtml(slot.muscleGroups.map(muscleLabel).join(' · '))}</span></div>
    ${slot.note ? `<p class="slot-note">${escapeHtml(slot.note)}</p>` : ''}
    <span class="slot-missing" data-missing ${slot.missing.length ? '' : 'hidden'}>${t('dp.thieu_nhap_tay_ben_duoi', { p0: escapeHtml(slot.missing.join(', ')) })}</span>
    <div class="field"><label for="ex-${dayIndex}-${slotIndex}">${t('workout.exerciseFallback')}</label><select id="ex-${dayIndex}-${slotIndex}" data-f="exercise">${exerciseSelect(slot)}</select></div>
    ${slot.candidates.length ? '' : t('dp.p_class_slot_nopick_thu_vien')}
    <div class="slot-nums">
      <div><label for="sets-${dayIndex}-${slotIndex}">Set</label><input id="sets-${dayIndex}-${slotIndex}" type="number" inputmode="numeric" min="1" max="12" data-f="sets" value="${val(slot.sets)}"></div>
      <div><label for="rmin-${dayIndex}-${slotIndex}">${t('dp.rep_tu')}</label><input id="rmin-${dayIndex}-${slotIndex}" type="number" inputmode="numeric" min="1" max="100" data-f="repMin" value="${val(slot.reps?.min)}"></div>
      <div><label for="rmax-${dayIndex}-${slotIndex}">${t('dp.rep_den')}</label><input id="rmax-${dayIndex}-${slotIndex}" type="number" inputmode="numeric" min="1" max="100" data-f="repMax" value="${val(slot.reps?.max)}"></div>
      <div><label for="rir-${dayIndex}-${slotIndex}">RIR</label><input id="rir-${dayIndex}-${slotIndex}" type="number" inputmode="numeric" min="0" max="10" data-f="rir" value="${val(slot.rir?.max)}"></div>
      <div><label for="rest-${dayIndex}-${slotIndex}">${t('dp.nghi_giay')}</label><input id="rest-${dayIndex}-${slotIndex}" type="number" inputmode="numeric" min="0" max="600" data-f="rest" value="${val(slot.restSeconds)}"></div>
    </div>
    <p class="slot-scheme" data-scheme></p>
  </article>`;
}

function render() {
  const days = plan.days.map((day, dayIndex) => `<section class="day-card" aria-label="${escapeHtml(dayName(day.label))}">
    <h3>${escapeHtml(dayName(day.label))}</h3>
    <p class="small-note">${day.slots.length} slot</p>
    ${day.slots.map((slot, slotIndex) => slotMarkup(slot, dayIndex, slotIndex)).join('') || t('dp.p_class_small_note_buoi_nay')}
  </section>`).join('');
  $('planner-result').innerHTML = `
    ${plan.note ? `<div class="planner-david-note">${escapeHtml(plan.note)}</div>` : ''}
    ${plan.warnings.length ? `<ul class="planner-warn">${plan.warnings.map((text) => `<li>${escapeHtml(text)}</li>`).join('')}</ul>` : ''}
    ${days}
    <section class="vol-card" aria-live="polite"><h3>${t('dp.volume_ke_hoach_moi_tuan')}</h3>
      <p class="small-note" style="margin:0;">${t('dp.so_set_moi_nhom_co_bai')}</p>
      <div id="vol-body"></div></section>
    <section class="draft-card" aria-labelledby="draft-title"><h3 id="draft-title">${t('dp.luu_thanh_ban_nhap')}</h3>
      <p class="small-note" style="margin:0;">${t('dp.tao_ban_nhap_chua_kich_hoat')}</p>
      ${students.length ? `<div class="draft-grid">
        <div class="field"><label for="draft-student">${t('workout.clientFallback')}</label><select id="draft-student"><option value="">${t('dp.chon_hoc_vien')}</option>${students.map((student) => `<option value="${escapeHtml(student.id)}"${student.id === presetStudent ? ' selected' : ''}>${escapeHtml(student.displayName || student.email || student.id)}</option>`).join('')}</select></div>
        <div class="field"><label for="draft-name">${t('coach.ten_chu_ky')}</label><input id="draft-name" type="text" maxlength="80" value="${escapeHtml(defaultDraftName())}"></div>
        <div class="field wide"><label for="draft-notes">${t('coach.ghi_chu_tuy_chon')}</label><textarea id="draft-notes" rows="2" maxlength="500"></textarea></div>
      </div>
      <div class="draft-actions"><button type="button" class="btn btn-primary" id="draft-btn">${t('coach.tao_ban_nhap')}</button></div>` : t('dp.p_class_small_note_style_margin')}
      <div class="draft-status" id="draft-status" role="status"></div></section>
    <p class="planner-foot">${t('dp.moi_buoi_duoc_tinh_mot_lan')}</p>`;
  plan.days.forEach((day, d) => day.slots.forEach((slot, s) => refreshSlot(d, s)));
  refreshVolume();
}

function slotAt(element) {
  const card = element.closest('[data-d]');
  return { card, slot: plan.days[Number(card.dataset.d)].slots[Number(card.dataset.s)] };
}

function refreshSlot(d, s) {
  const slot = plan.days[d].slots[s];
  const card = $('planner-result').querySelector(`[data-d="${d}"][data-s="${s}"]`);
  slot.missing = [...(slot.sets === null ? [t('dp.so_set')] : []), ...(slot.reps === null ? [t('dp.khoang_rep')] : [])];
  const badge = card.querySelector('[data-missing]');
  badge.hidden = !slot.missing.length;
  badge.textContent = `${t('dp.thieu_nhap_tay_ben_duoi', { p0: slot.missing.join(', ') })}`;
  const line = card.querySelector('[data-scheme]');
  const exercise = slot.exerciseId ? getExerciseById(slot.exerciseId) : null;
  if (!exercise) { line.textContent = ''; return; }
  const result = prescriptionFor(slot, exercise);
  line.textContent = [`${t('dp.kieu_tien_trien', { p0: SCHEME_LABEL[result.scheme] || result.scheme })}`, ...result.notes].join(' · ');
}

function refreshVolume() {
  const volume = planVolume(plan, getExerciseById);
  const compared = new Map(compareToTargets(volume, plan.weeklyTargets).map((row) => [row.muscle, row]));
  const rows = MUSCLE_GROUPS.filter((muscle) => (volume[muscle] || 0) > 0 || compared.has(muscle)).map((muscle) => {
    const planned = Math.round((volume[muscle] || 0) * 10) / 10;
    const row = compared.get(muscle);
    return `<tr><td>${escapeHtml(muscleLabel(muscle))}${row ? `<br><small class="vol-${row.status}">${STATUS_TEXT[row.status]}</small>` : ''}</td><td class="num">${planned}</td>
      <td>${row ? `${row.min}–${row.max}` : '–'}</td></tr>`;
  });
  $('vol-body').innerHTML = rows.length
    ? `<table class="vol-table"><thead><tr><th>${t('dp.nhom_co')}</th><th>${t('dp.set_tuan')}</th><th>${t('dp.khoang_cua_david')}</th></tr></thead><tbody>${rows.join('')}</tbody></table>`
    : t('dp.p_class_small_note_style_margin_2');
}

function labelOf(list, id) { return list.find((item) => item.id === id)?.label || id; }
function defaultDraftName() {
  return `${labelOf(GOALS, $('goal').value)} · ${labelOf(LEVELS, $('level').value)} · ${labelOf(STYLES, $('style').value)}`;
}

function showDraftStatus(kind, html) {
  const box = $('draft-status');
  box.className = `draft-status ${kind}`;
  box.innerHTML = html;
}
const list = (items) => `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;

// The only write on this page: a DRAFT cycle for one student, through the same function the
// dashboard uses. It is never activated here and starting loads are left empty.
async function createDraft() {
  if (saving || !plan) return;
  const studentId = $('draft-student').value;
  const student = students.find((item) => item.id === studentId);
  const name = $('draft-name').value.trim();
  if (!student) { showDraftStatus('error', t('dp.chon_hoc_vien_truoc')); return; }
  if (!name) { showDraftStatus('error', t('coach.nhap_ten_chu_ky')); return; }
  const built = draftOptionsFromPlan(plan, getExerciseById);
  if (built.problems.length) { showDraftStatus('error', `${t('dp.chua_tao_duoc_ban_nhap_sua', { p0: list(built.problems) })}`); return; }
  if (!built.options.length) { showDraftStatus('error', t('dp.chon_bai_cho_it_nhat_mot')); return; }

  const button = $('draft-btn');
  saving = true; button.disabled = true;
  try {
    const phases = await listPhases(studentId);
    if (phases.some((phase) => phase.status === 'draft')) {
      showDraftStatus('error', `${t('dp.da_co_mot_chu_ky_ban', { p0: escapeHtml(student.displayName || t('coach.hoc_vien')) })}`);
      return;
    }
    // No remembered loads: every starting weight stays empty for the coach to enter.
    const assignments = buildDraftAssignmentsFromSelections(built.options, [], []);
    const needLoad = draftActivationIssues(assignments).length;
    const summary = [
      `${t('dp.tao_ban_nhap_cho', { p0: name, p1: student.displayName || t('notes.clientLower') })}`,
      `${t('dp.buoi_bai', { p0: built.options.length, p1: built.exerciseCount })}`,
      built.skipped.length ? `${t('dp.slot_chua_chon_bai_se_bi', { p0: built.skipped.length })}` : '',
      needLoad ? `${t('dp.bai_chua_co_ta_khoi_diem', { p0: needLoad })}` : '',
      t('dp.ban_nhap_chua_kich_hoat_va'),
    ].filter(Boolean).join('\n');
    if (!await confirmDialog({ message: summary, confirmLabel: t('coach.tao_ban_nhap'), cancelLabel: t('coach.chua') })) return;
    button.textContent = t('coach.dang_tao_ban_nhap');
    await createPhaseDraft(studentId, { name, notes: $('draft-notes').value.trim(), assignments, goal: $('goal').value });
    showDraftStatus('ok', `${t('dp.da_tao_ban_nhap_cho_buoi', { p0: escapeHtml(name), p1: escapeHtml(student.displayName || t('notes.clientLower')), p2: built.options.length, p3: built.exerciseCount })} <a href="coach.html">${t('coach.bang_dieu_khien')}</a>${t('dp.chon_hoc_vien_nay_roi_chinh')}`);
    button.textContent = t('dp.da_tao_ban_nhap');   // one draft per student: stays off until the next build
    return;
  } catch (error) {
    console.error('createPhaseDraft failed', error);
    showDraftStatus('error', `${t('dp.chua_tao_duoc_ban_nhap', { p0: escapeHtml(error.message || t('dp.loi_khong_ro')) })}`);
  } finally {
    saving = false;
    if (button.textContent !== t('dp.da_tao_ban_nhap')) { button.disabled = false; button.textContent = t('coach.tao_ban_nhap'); }
  }
}

$('planner-result').addEventListener('click', (event) => {
  if (event.target.id === 'draft-btn') createDraft();
});

const intOrNull = (value) => (value === '' || !Number.isFinite(Number(value)) ? null : Math.round(Number(value)));

// Everything typed here changes the in-memory skeleton only; nothing is saved.
$('planner-result').addEventListener('input', (event) => {
  const field = event.target.dataset?.f;
  if (!field || field === 'exercise') return;
  const { card, slot } = slotAt(event.target);
  const value = intOrNull(event.target.value);
  const num = (name) => intOrNull(card.querySelector(`[data-f="${name}"]`).value);
  if (field === 'sets') {
    slot.sets = value;
    slot.setsRange = value === null ? null : { min: value, max: Math.max(value, slot.setsRange?.max ?? value) };
  } else if (field === 'repMin' || field === 'repMax') {
    slot.reps = normalizeRange({ min: num('repMin'), max: num('repMax') });
  } else if (field === 'rir') {
    slot.rir = value === null ? null : { min: value, max: value };
  } else if (field === 'rest') {
    slot.restSeconds = value;
  }
  refreshSlot(Number(card.dataset.d), Number(card.dataset.s));
  refreshVolume();
});

$('planner-result').addEventListener('change', (event) => {
  if (event.target.dataset?.f !== 'exercise') return;
  const { card, slot } = slotAt(event.target);
  slot.exerciseId = event.target.value || null;
  refreshSlot(Number(card.dataset.d), Number(card.dataset.s));
  refreshVolume();
});
</script>
</body>
</html>
