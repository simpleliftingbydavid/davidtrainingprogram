<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — David Training Program</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: radial-gradient(120% 140% at 15% -10%, var(--navy-700) 0%, var(--navy-900) 55%, #0f1a30 100%);
  }

  .login-wrap { width: 100%; max-width: 400px; }

  .login-hero { text-align: center; margin-bottom: 26px; }
  .login-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; margin-bottom: 18px;
    border-radius: 11px;
    background: linear-gradient(145deg, var(--navy-800), var(--navy-700));
    box-shadow: inset 0 0 0 1px rgba(243, 221, 201, .18);
    font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
    color: var(--accent-light);
  }
  .login-hero .eyebrow { display: block; }
  .login-hero h1 {
    margin: 14px 0 10px;
    font-size: clamp(1.7rem, 5vw, 2.15rem);
    color: #fff;
  }
  .login-hero .lede {
    margin: 0 auto; max-width: 34ch;
    font-size: .96rem; line-height: 1.55;
    color: #aab3c9;
  }

  .login-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 30px 28px 28px;
    box-shadow: var(--shadow-lg);
  }

  /* Signature: a row of "plates" — quiet by default, reads as a loading bar
     while signing in. Ties the one moment of motion on this page to the
     product's own mechanic (loading a little more each session) instead of
     a generic spinner. */
  .load-bar { display: flex; gap: 5px; margin: 4px 0 22px; }
  .load-bar i {
    flex: 1; height: 4px; border-radius: 3px;
    background: var(--surface-alt);
    transition: background-color .35s ease;
  }
  .load-bar.loading i { background: var(--accent); animation: load-fill 1.1s ease-in-out infinite; }
  .load-bar.loading i:nth-child(1) { animation-delay: 0s; }
  .load-bar.loading i:nth-child(2) { animation-delay: .08s; }
  .load-bar.loading i:nth-child(3) { animation-delay: .16s; }
  .load-bar.loading i:nth-child(4) { animation-delay: .24s; }
  .load-bar.loading i:nth-child(5) { animation-delay: .32s; }
  .load-bar.loading i:nth-child(6) { animation-delay: .4s; }
  @keyframes load-fill { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .field + .field { margin-top: 14px; }
  #login-error { display: none; margin-top: 16px; margin-bottom: 0; padding: 14px 16px; }
  #login-status { margin: 16px 0 0; text-align: center; color: #aab3c9; font-size: .87rem; }

  @media (prefers-reduced-motion: reduce) {
    .load-bar.loading i { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-hero">
    <span class="login-mark" aria-hidden="true">DC</span>
    <span class="eyebrow on-dark">David Training Program</span>
    <h1>Quay lại tập tiếp.</h1>
    <p class="lede">Theo dõi buổi tập, dinh dưỡng và những điều chỉnh David dành riêng cho bạn.</p>
  </div>

  <div class="login-card">
    <form id="login-form">
      <div class="load-bar" id="load-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="submit-btn">Đăng nhập</button>
      <div class="box box-caution" id="login-error"></div>
    </form>
    <p id="login-status"></p>
  </div>
  <p style="margin:18px 0 0;font-size:.76rem;color:#8f98ae;text-align:center">Mỗi kế hoạch đều được David xem lại trước khi gửi.</p>
</div>

<script type="module">
  import { auth, authPersistenceReady } from './firebase-init.js';
  import {
    signInWithEmailAndPassword, onAuthStateChanged,
  } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
  import { getMyRole } from './training-data.js';
  import { roleDestination, signInAfterPersistence } from './auth-session-utils.js';

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('login-error');
  const submitBtn = document.getElementById('submit-btn');
  const statusEl = document.getElementById('login-status');
  const loadBar = document.getElementById('load-bar');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  let routingUid = null;
  let routingPromise = null;

  function routeByRole(user) {
    if (routingUid === user.uid && routingPromise) return routingPromise;
    routingUid = user.uid;
    routingPromise = (async () => {
      statusEl.textContent = 'Đang kiểm tra tài khoản…';
      loadBar.classList.add('loading');
      try {
        const role = await getMyRole(user.uid);
        const destination = roleDestination(role);
        if (destination) { location.replace(destination); return; }
        statusEl.textContent = '';
        loadBar.classList.remove('loading');
        showError('Tài khoản chưa được thiết lập trong hệ thống. Liên hệ David để được thêm vào.');
      } catch (error) {
        console.error(error);
        statusEl.textContent = '';
        loadBar.classList.remove('loading');
        showError('Chưa thể kiểm tra tài khoản lúc này. Hãy kiểm tra mạng rồi thử lại.');
      } finally {
        routingUid = null;
        routingPromise = null;
      }
    })();
    return routingPromise;
  }

  // If already signed in (e.g. page refresh), route immediately.
  onAuthStateChanged(auth, (user) => {
    if (user) void routeByRole(user);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang đăng nhập…';
    loadBar.classList.add('loading');
    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      await signInAfterPersistence({
        persistenceReady: authPersistenceReady,
        signIn: () => signInWithEmailAndPassword(auth, email, password),
      });
    } catch (err) {
      console.error(err);
      loadBar.classList.remove('loading');
      showError('Đăng nhập thất bại — kiểm tra lại email/mật khẩu.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Đăng nhập';
    }
  });
</script>
</body>
</html>
