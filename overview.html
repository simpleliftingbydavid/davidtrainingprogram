<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="ov.tong_quan_hoc_vien_david_coaching">Tổng quan học viên — David Coaching</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="client-ui.css">
<link rel="stylesheet" href="nutrition-intake.css">
<link rel="stylesheet" href="overview.css">
<link rel="stylesheet" href="polish.css">
</head>
<body class="client-ui cu-overview">
<header class="app-header">
  <span class="brand brand-page">
    <span class="brand-mark">DC</span>
    <span class="brand-mini" data-i18n="ov.tong_quan_hoc_vien">Tổng quan học viên</span>
  </span>
  <div class="header-group">
    <a href="coach.html" class="btn btn-outline btn-compact" data-app-shell-hidden="true" data-i18n="exrev.bang_dieu_khien">◀ Bảng điều khiển</a>
    <button class="btn btn-outline btn-compact" id="logout-btn" data-i18n-init="exrev.dang_xuat">Đăng xuất</button>
  </div>
</header>

<div id="boot-status" class="dc-skeleton" role="status" aria-label="Đang tải" data-i18n-aria-label="exrev.dang_tai"><span class="dc-skel dc-skel-hero"></span><span class="dc-skel dc-skel-line"></span><span class="dc-skel dc-skel-card"></span><span class="dc-skel dc-skel-card"></span></div>

<main id="app-content" hidden>
  <section class="cu-hero">
    <div class="cu-wrap">
      <p class="cu-eyebrow" data-i18n="exrev.danh_cho_coach">Dành cho coach</p>
      <h1 class="ov-title" id="ov-title" data-i18n-init="ov.tong_quan_hoc_vien">Tổng quan học viên</h1>
      <p class="ov-sub" id="ov-sub"></p>
      <div class="ov-periods" role="group" aria-label="Khoảng thời gian" id="ov-periods" data-i18n-aria-label="ov.khoang_thoi_gian"></div>
      <nav class="ov-tabs" id="ov-tabs" aria-label="Chế độ xem" data-i18n-aria-label="ov.che_do_xem"></nav>
    </div>
  </section>
  <div class="cu-wrap ov-body" id="ov-body"></div>
</main>

<script type="module">
import { auth } from './firebase-init.js';
import { t, fmtNumber, fmtDate } from './i18n.js';
import { mountAppShell } from './app-shell.js';
import { confirmDialog } from './app-dialog.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import {
  getMyRole, getNutritionPlan, listBodyWeightLogs, listMyStudents, listNutritionCheckins, listProgressPhotos, setStudentNutritionSettings, setStudentPhotoConsent,
} from './training-data.js';
import { MAX_MEALS_PER_DAY, MAX_PROTEIN_NOTE, MAX_STEP_TARGET, mealCountFor, normalizeNutritionSettings, nutritionMode, settingsErrors } from './nutrition-simple.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { foodLogAveragesMarkup, foodLogDayMarkup } from './nutrition-food-log-ui.js';
import { ANGLES } from './progress-utils.js';
const angleText = (id) => t(`ov.angle.${id}`);
import {
  ATTENTION, DEFAULT_PERIOD, PERIODS, anglePhotos, attentionReasons, compareInfo, defaultPair, hasPhotoConsent,
  periodDays, photoSummary, sortRows, studentNutrition, weightSummary,
} from './overview-utils.js';
import { JOURNEY_MAX, weightJourney } from './weight-journey.js';

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
const params = new URLSearchParams(location.search);
const studentParam = params.get('student') || '';
const view = studentParam ? 'student' : params.get('view') === 'portfolio' ? 'portfolio' : 'all';
const PERIOD_KEY = 'dc_overview_period';
const BUCKET = 'david-training-program.firebasestorage.app';

let period = readPeriod();
let students = [];
const data = new Map(); // uid -> { plan, checkins, weights, photos } | { error }

function readPeriod() {
  try {
    const saved = Number(localStorage.getItem(PERIOD_KEY));
    return PERIODS.includes(saved) ? saved : DEFAULT_PERIOD;
  } catch { return DEFAULT_PERIOD; }
}
function savePeriod(value) {
  try { localStorage.setItem(PERIOD_KEY, String(value)); } catch { /* chỉ là tiện ích */ }
}

const nameOf = (student) => student.displayName || student.email || t('workout.clientFallback');
const dmy = (iso) => (iso ? fmtDate(iso, { year: true }) || iso.split('-').reverse().join('/') : '—');
const dm = (iso) => (iso ? fmtDate(iso) || `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '—');
const num = (value, digits = 1) => (value === null || value === undefined ? '—' : fmtNumber(value, { maxFrac: digits, grouping: true }));
const signed = (value, unit = ' kg', digits = 2) => (value === null || value === undefined ? '—'
  : `${value > 0 ? '+' : value < 0 ? '−' : '±'}${fmtNumber(Math.abs(value), { maxFrac: digits, grouping: true })}${unit}`);
const pct = (rate) => (rate === null || rate === undefined ? '—' : `${Math.round(rate * 100)}%`);

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['coach']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'coach') { $('boot-status').textContent = t('exrev.tai_khoan_chua_duoc_thiet_lap'); return; }
    mountAppShell({ role: 'coach', active: 'students' });
    students = await listMyStudents(user.uid);
    $('boot-status').style.display = 'none';
    $('app-content').hidden = false;
    renderChrome();
    await load(view === 'student' ? students.filter((student) => student.id === studentParam) : students);
    render();
  } catch (error) {
    console.error(error);
    $('boot-status').textContent = t('exrev.chua_the_tai_trang_luc_nay');
  }
});
$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });

/** Tải song song; một học viên lỗi không làm hỏng cả trang. */
async function load(list) {
  $('ov-body').innerHTML = `<p class="ov-loading">${t('ov.dang_tai_du_lieu_hoc_vien', { p0: list.length })}</p>`;
  await Promise.all(list.map(async (student) => {
    try {
      const [plan, checkins, weights, photos] = await Promise.all([
        getNutritionPlan(student.id),
        listNutritionCheckins(student.id, { max: view === 'student' ? JOURNEY_MAX : 45 }),
        listBodyWeightLogs(student.id, { max: view === 'student' ? JOURNEY_MAX : 120 }),
        listProgressPhotos(student.id),
      ]);
      data.set(student.id, { plan, checkins: checkins || [], weights: weights || [], photos: photos || [] });
    } catch (error) {
      console.error('overview load failed', student.id, error);
      data.set(student.id, { error: true });
    }
  }));
}

function summarize(student) {
  const raw = data.get(student.id);
  if (!raw || raw.error) return { student, name: nameOf(student), error: true, reasons: [] };
  const nutrition = studentNutrition(student, raw.plan, raw.checkins, period);
  const weight = weightSummary(raw.weights, period);
  const photos = photoSummary(raw.photos);
  return { student, name: nameOf(student), raw, nutrition, weight, photos, reasons: attentionReasons({ nutrition, weight, photos }) };
}

// ---------------- khung chung ----------------

function renderChrome() {
  // Portfolio không phụ thuộc khoảng thời gian.
  $('ov-periods').hidden = view === 'portfolio';
  $('ov-periods').innerHTML = PERIODS.map((days) => `<button type="button" class="ov-period${days === period ? ' active' : ''}" data-period="${days}" aria-pressed="${days === period}">${t('ov.ngay', { p0: days })}</button>`).join('');
  $('ov-periods').onclick = (event) => {
    const button = event.target.closest('[data-period]');
    if (!button) return;
    period = Number(button.dataset.period);
    savePeriod(period);
    renderChrome();
    render();
  };
  const id = encodeURIComponent(studentParam);
  $('ov-tabs').innerHTML = view === 'student'
    ? `<a class="ov-tab" href="overview.html">${t('ov.tat_ca_hoc_vien')}</a><a class="ov-tab ov-tab-out" href="coach.html?student=${id}">${t('tabs.program')}</a><a class="ov-tab ov-tab-out" href="nutrition.html?student=${id}">${t('home.dinh_duong')}</a>`
    : `<a class="ov-tab${view === 'all' ? ' active' : ''}" href="overview.html">${t('ov.tat_ca_hoc_vien_2')}</a><a class="ov-tab${view === 'portfolio' ? ' active' : ''}" href="overview.html?view=portfolio">Portfolio</a>`;
}

function render() {
  // The list is a wide table; a student's page keeps the narrow column.
  document.body.classList.toggle('ov-wide', view === 'all');
  if (view === 'student') renderStudent();
  else if (view === 'portfolio') renderPortfolio();
  else renderAll();
}

// ---------------- bảng tổng hợp ----------------

function renderAll() {
  const rows = sortRows(students.map(summarize));
  const flagged = rows.filter((row) => row.reasons.length).length;
  $('ov-title').textContent = t('ov.tong_quan_hoc_vien');
  $('ov-sub').innerHTML = `<strong>${rows.length}</strong> ${t('ov.hoc_vien')} <strong>${flagged}</strong> ${t('ov.can_chu_y_ngay_gan_nhat', { p0: period })}`;
  if (!rows.length) { $('ov-body').innerHTML = t('ov.div_class_cu_card_ov_empty'); return; }
  $('ov-body').innerHTML = `
    <p class="ov-legend">${t('ov.can_chu_y_khi_khong_ghi', { p0: ATTENTION.weightGapDays, p1: Math.round(ATTENTION.mealRate * 100), p2: ATTENTION.photoDays })}</p>
    <div class="ov-table" role="table" aria-label="${t('workout.clientFallback')}">
      <div class="ov-trow ov-thead" role="row"><span role="columnheader">${t('workout.clientFallback')}</span><span role="columnheader">${t('home.dinh_duong')}</span><span role="columnheader">${t('home.weight')}</span><span role="columnheader">${t('progress.anh')}</span><span role="columnheader">${t('ov.can_chu_y')}</span></div>
      ${rows.map(rowMarkup).join('')}
    </div>`;
}

const modeChip = (student) => (nutritionMode(student) === 'simple'
  ? t('ov.span_class_ov_chip_ov_chip')
  : t('ov.span_class_ov_chip_ov_chip_2'));

// The list is a table (2026-11-03): one line per student, so the whole roster fits on a screen.
// Each cell is a big number and one line under it; the student's page has the rest.
const cell = (big, small = '') => `<b>${big}</b>${small ? `<small>${small}</small>` : ''}`;
const none = (text) => `<small class="ov-none">${text}</small>`;

function simpleCell(n) {
  if (!n.planned) return none(t('ov.chua_dat_so_bua'));
  return cell(pct(n.rate), `${t('ov.bua_du_dam_rau', { p0: n.done, p1: n.planned, p2: n.stepTarget ? ` ${t('ov.x.steps', { a: n.steps.met, b: n.countedDays })}` : '' })}`);
}

function foodLogCell(n) {
  return cell(pct(n.rate), `${t('ov.ghi_mon_ngay', { p0: n.loggedDays, p1: n.countedDays, p2: n.proteinDays !== null ? ` ${t('ov.x.protein', { n: n.proteinDays })}` : '' })}`);
}

function rowMarkup(row) {
  const link = `overview.html?student=${encodeURIComponent(row.student.id)}`;
  const name = `<span class="ov-tname" role="cell"><strong>${escapeHtml(row.name)}</strong><span class="ov-chips">${modeChip(row.student)}${hasPhotoConsent(row.student) ? '<span class="ov-chip ov-chip-ok">Portfolio</span>' : ''}</span></span>`;
  if (row.error) {
    return `<a class="ov-trow" role="row" href="${link}">${name}<span class="ov-tfull ov-error" role="cell">${t('ov.khong_tai_duoc_du_lieu_hoc')}</span></a>`;
  }
  const { nutrition: n, weight: w, photos: p } = row;
  const nutritionCell = n?.mode === 'simple' ? simpleCell(n) : n?.mode === 'foodlog' ? foodLogCell(n) : none(t('ov.chua_co_so_lieu'));
  const weightCell = !w ? none(t('ov.chua_ghi_can'))
    : cell(`${num(w.latest.weight)}<i> kg</i>`, `${t('ov.tb_tuan', { p0: dm(w.latest.day), p1: signed(w.weeklyChange) })}`);
  const photoCell = !p ? none(t('cj.chua_co_anh'))
    : cell(`${p.sinceDays}<i> ${t('ov.ngay_2')}</i>`, `${t('ov.bo', { p0: p.count, p1: p.missingAngles.length ? ` ${t('ov.x.missing', { list: p.missingAngles.map((id) => angleText(id).toLowerCase()).join(', ') })}` : '' })}`);
  return `<a class="ov-trow${row.reasons.length ? ' is-flagged' : ''}" role="row" href="${link}">
      ${name}
      <span class="ov-tcell" role="cell" data-label="${t('home.dinh_duong')}">${nutritionCell}</span>
      <span class="ov-tcell" role="cell" data-label="${t('home.weight')}">${weightCell}</span>
      <span class="ov-tcell" role="cell" data-label="${t('progress.anh')}">${photoCell}</span>
      <span class="ov-treason" role="cell">${row.reasons.length ? escapeHtml(row.reasons.join(' · ')) : t('ov.span_class_ov_ok_on_span')}</span>
    </a>`;
}

// ---------------- chi tiết một học viên ----------------

let selectedDay = null;
// The settings stay open after a save, so the "Đã lưu" line is seen.
let settingsOpen = false;
let compare = { angle: 'front', before: null, after: null };

function renderStudent() {
  const student = students.find((item) => item.id === studentParam);
  if (!student) {
    $('ov-title').textContent = t('ov.khong_tim_thay_hoc_vien');
    $('ov-sub').textContent = '';
    $('ov-body').innerHTML = t('ov.div_class_cu_card_ov_empty_2');
    return;
  }
  const row = summarize(student);
  $('ov-title').textContent = row.name;
  $('ov-sub').innerHTML = row.reasons.length ? `${t('ov.can_chu_y_2', { p0: escapeHtml(row.reasons.join(' · ')) })}` : `${t('ov.ngay_gan_nhat', { p0: period })}`;
  if (row.error) { $('ov-body').innerHTML = t('ov.div_class_cu_card_ov_error'); return; }
  // Results first; the settings are folded under the nutrition they change (2026-11-03).
  $('ov-body').innerHTML = `
    ${nutritionDetail(row)}
    ${settingsDetail(row)}
    ${weightDetail(row)}
    ${journeyDetail(row)}
    ${photoDetail(row)}
    ${portfolioDetail(row)}`;
  bindStudent(row);
}

function nutritionDetail(row) {
  const n = row.nutrition;
  if (n?.mode === 'simple') return simpleDetail(row);
  if (n?.mode === 'foodlog') return foodLogDetail(row);
  return t('ov.section_class_cu_card_ov_section');
}

function simpleDetail(row) {
  const n = row.nutrition;
  const byDate = new Map(n.days.map((day) => [day.date, day]));
  const cells = periodDays(period).map((iso) => {
    const day = byDate.get(iso);
    if (!day) return `<span class="ov-day is-before" title="${t('ov.chua_bat_dau')}"><b>${iso.slice(8)}</b></span>`;
    const steps = day.stepsMet === true ? t('ov.dat_buoc') : day.stepsMet === false ? t('ov.chua_dat_buoc') : '';
    const label = `${t('ov.bua_du_dam_va_rau', { p0: dmy(iso), p1: day.done, p2: day.planned, p3: steps })}`;
    return `<button type="button" class="ov-day is-${day.status}${selectedDay === iso ? ' is-selected' : ''}" data-day="${iso}" aria-label="${escapeHtml(label)}">
      <b>${iso.slice(8)}</b><small>${day.planned ? `${day.done}/${day.planned}` : '–'}</small>${day.stepsMet === true ? '<i class="is-steps" aria-hidden="true"></i>' : ''}
    </button>`;
  }).join('');
  return `<section class="cu-card ov-section">
    <div class="cu-card-head"><h3>${t('ov.dinh_duong_don_gian')}</h3><span class="ov-head-num">${pct(n.rate)}</span></div>
    ${n.planned ? '' : t('ov.p_class_ov_error_chua_co')}
    <dl class="ov-stats ov-stats-3">
      <div><dt>${t('cj.bua_du_dam_rau')}</dt><dd>${n.done}/${n.planned}</dd></div>
      <div><dt>${t('ov.ngay_du_ca_ngay')}</dt><dd>${n.fullDays}/${n.countedDays}</dd></div>
      <div><dt>${t('ov.dat_buoc_2')}</dt><dd>${n.stepTarget ? `${n.steps.met}/${n.countedDays}` : '—'}</dd></div>
    </dl>
    <div class="ov-cal">${cells}</div>
    <p class="ov-cal-legend"><span class="k is-full"></span>${t('ov.du_moi_bua')} <span class="k is-partial"></span>${t('ov.du_mot_so_bua')} <span class="k is-missed"></span>${t('ov.khong_ghi', { p0: n.stepTarget ? `<span class="k-dot dot-steps"></span>${t('ov.x.stepsMet')}` : '' })}</p>
    <div id="ov-day-detail">${dayDetail(row)}</div>
  </section>`;
}

function foodLogDetail(row) {
  const n = row.nutrition;
  const byDate = new Map(n.days.map((day) => [day.date, day]));
  const cells = periodDays(period).map((iso) => {
    const day = byDate.get(iso);
    if (!day) return `<span class="ov-day is-before" title="${t('ov.chua_bat_dau')}"><b>${iso.slice(8)}</b></span>`;
    const label = `${dmy(iso)}: ${day.entries.length ? `${t('ov.ghi_bua_kcal', { p0: day.mealsLogged, p1: num(day.totals.values.kcal, 0) })}` : t('nu.cv.none')}`;
    return `<button type="button" class="ov-day is-${day.status}${selectedDay === iso ? ' is-selected' : ''}" data-day="${iso}" aria-label="${escapeHtml(label)}">
      <b>${iso.slice(8)}</b><small>${day.entries.length ? `${t('ov.bua', { p0: day.mealsLogged })}` : '–'}</small>
    </button>`;
  }).join('');
  return `<section class="cu-card ov-section">
    <div class="cu-card-head"><h3>${t('ov.dinh_duong_tu_ghi_mon')}</h3><span class="ov-head-num">${pct(n.rate)}</span></div>
    <dl class="ov-stats ov-stats-3">
      <div><dt>${t('ov.ngay_co_ghi')}</dt><dd>${n.loggedDays}/${n.countedDays}</dd></div>
      <div><dt>${t('ov.dam_dat_10')}</dt><dd>${n.proteinDays !== null ? `${n.proteinDays}/${n.loggedDays}` : '—'}</dd></div>
      <div><dt>${t('ov.calo_tb_ngay')}</dt><dd>${n.averages.kcal !== null ? num(n.averages.kcal, 0) : '—'}</dd></div>
    </dl>
    <div class="ov-cal">${cells}</div>
    <p class="ov-cal-legend"><span class="k is-full"></span>${t('ov.du_sang_trua_toi')} <span class="k is-partial"></span>${t('ov.ghi_mot_phan')} <span class="k is-missed"></span>${t('ov.khong_ghi_2')}</p>
    <div id="ov-day-detail">${dayDetail(row)}</div>
    <h4 class="ov-sub-head">${t('ov.trung_binh_trong_ky')}</h4>
    ${foodLogAveragesMarkup(n, n.targets)}
  </section>`;
}

function simpleDayDetail(row) {
  const day = row.nutrition.days.find((item) => item.date === selectedDay);
  if (!day) return '';
  const done = new Set((day.checkin?.simpleMeals || []).map(Number));
  const meals = Array.from({ length: day.planned }, (_, index) => `<li class="${done.has(index) ? 'is-done' : 'is-missed'}"><span>${t('ov.bua_2', { p0: index + 1 })}</span><em>${done.has(index) ? t('ov.du_dam_va_rau') : t('ov.chua')}</em></li>`).join('');
  const steps = row.nutrition.stepTarget
    ? `<p>${t('ov.buoc_chan', { p0: day.stepsMet === true ? t('ov.x.met') : day.stepsMet === false ? t('ov.x.notMet') : t('ov.x.notLogged'), p1: day.checkin?.steps ? ` ${t('ov.x.stepsCount', { n: fmtNumber(Number(day.checkin.steps), { grouping: true }) })}` : '' })}</p>`
    : '';
  return `<div class="ov-day-detail"><strong>${dmy(selectedDay)}</strong>${meals ? `<ul class="ov-meals">${meals}</ul>` : ''}${steps}${day.checkin ? '' : t('ov.p_hoc_vien_khong_ghi_gi')}</div>`;
}

function settingsDetail(row) {
  const settings = normalizeNutritionSettings(row.student.nutritionSettings);
  const fromPlan = row.raw.plan ? mealCountFor({}, row.raw.plan, periodDays(1)[0]) : null;
  const current = [
    settings.stepTarget ? `${t('ov.buoc_3', { p0: fmtNumber(settings.stepTarget, { grouping: true }) })}` : '',
    settings.mealsPerDay ? `${t('ov.bua_ngay', { p0: settings.mealsPerDay })}` : fromPlan ? `${t('ov.bua_theo_ke_hoach', { p0: fromPlan })}` : '',
  ].filter(Boolean).join(' · ');
  return `<details class="cu-card ov-section ov-settings-card" id="ov-settings-card"${settingsOpen ? ' open' : ''}>
    <summary class="cu-card-head"><h3>${t('ov.cai_dat_dinh_duong')}</h3>${modeChip(row.student)}<span class="ov-settings-now">${escapeHtml(current)}</span></summary>
    <form id="ov-settings" class="ov-settings" novalidate>
      <fieldset class="ov-mode">
        <legend>${t('ov.che_do')}</legend>
        <label><input type="radio" name="mode" value="simple"${settings.mode === 'simple' ? ' checked' : ''}> <span><strong>${t('ov.don_gian')}</strong> ${t('ov.moi_ngay_3_viec_du_dam')}</span></label>
        <label><input type="radio" name="mode" value="detailed"${settings.mode === 'detailed' ? ' checked' : ''}> <span><strong>${t('workout.block.details')}</strong> ${t('ov.hoc_vien_tu_ghi_tung_mon')}</span></label>
      </fieldset>
      <div class="ov-settings-grid">
        <label>${t('ov.so_buoc_muc_tieu')}<input name="stepTarget" type="number" inputmode="numeric" min="1" max="${MAX_STEP_TARGET}" step="1" value="${settings.stepTarget ?? ''}" placeholder="${t('ov.de_trong_khong_hoi')}"></label>
        <label>${t('ov.so_bua_moi_ngay')}<input name="mealsPerDay" type="number" inputmode="numeric" min="1" max="${MAX_MEALS_PER_DAY}" step="1" value="${settings.mealsPerDay ?? ''}" placeholder="${fromPlan ? `${t('ov.theo_ke_hoach', { p0: fromPlan })}` : t('ov.chua_dat_2')}"></label>
      </div>

function weightChart(w) {
  const days = periodDays(period);
  const points = w.rows;
  if (!points.length) return t('ov.p_class_ov_none_khong_co');
  const values = [...points.map((p) => p.weight), ...points.map((p) => p.avg7).filter((v) => v !== null)];
  let lo = Math.min(...values);
  let hi = Math.max(...values);
  if (hi - lo < 1) { const mid = (hi + lo) / 2; lo = mid - 0.5; hi = mid + 0.5; }
  const W = 600; const H = 200; const L = 40; const R = 10; const T = 12; const B = 26;
  const x = (iso) => L + (days.indexOf(iso) / Math.max(1, days.length - 1)) * (W - L - R);
  const y = (value) => T + (1 - (value - lo) / (hi - lo)) * (H - T - B);
  const avg = points.filter((p) => p.avg7 !== null).map((p) => `${x(p.day).toFixed(1)},${y(p.avg7).toFixed(1)}`).join(' ');
  const ticks = [lo, (lo + hi) / 2, hi];
  const labelDays = [days[0], days[Math.floor(days.length / 2)], days[days.length - 1]];
  return `<svg class="ov-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('ov.can_nang_tung_ngay_trong_ngay', { p0: period })}">
    ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="grid"/><text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" class="axis" text-anchor="end">${num(t)}</text>`).join('')}
    ${labelDays.map((d, i) => `<text x="${x(d).toFixed(1)}" y="${H - 6}" class="axis" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${dm(d)}</text>`).join('')}
    ${avg ? `<polyline points="${avg}" class="avg"/>` : ''}
    ${points.map((p) => `<circle cx="${x(p.day).toFixed(1)}" cy="${y(p.weight).toFixed(1)}" r="4" class="dot"><title>${dmy(p.day)}: ${num(p.weight)} kg</title></circle>`).join('')}
  </svg>
  <p class="ov-cal-legend"><span class="k-dot dot-weight"></span>${t('ov.can_tung_ngay')} <span class="k-line"></span>${t('ov.trung_binh_7_ngay')}</p>`;
}

function bindCompare(row) {
  const host = $('ov-compare');

  }));
  const list = anglePhotos(row.raw.photos, compare.angle);
  const pick = (id) => list.find((photo) => photo.id === id);
  $('ov-before')?.addEventListener('change', (event) => { compare.before = pick(event.target.value); host.innerHTML = compareMarkup(row); bindCompare(row); });
  $('ov-after')?.addEventListener('change', (event) => { compare.after = pick(event.target.value); host.innerHTML = compareMarkup(row); bindCompare(row); });
  $('ov-export')?.addEventListener('click', () => exportCollage(row));
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.crossOrigin = 'anonymous';
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error('cors'));
    image.src = url;
  });
}

function drawCover(ctx, image, x, y, w, h) {
  const scale = Math.max(w / image.width, h / image.height);
  const sw = w / scale; const sh = h / scale;
  ctx.drawImage(image, (image.width - sw) / 2, (image.height - sh) / 2, sw, sh, x, y, w, h);
}

const CORS_HELP = `<div class="ov-cors">
  <strong>${t('ov.kho_anh_chua_cho_phep_xuat')}</strong>
  <p>${t('ov.trinh_duyet_chi_cho_ghep_anh')}</p>
  <ol>
    <li>${t('ov.tao_file')} <code>cors.json</code>: <code>[{"origin":["https://david-coaching.vercel.app"],"method":["GET"],"maxAgeSeconds":3600}]</code></li>
    <li>${t('ov.chay_trong_google_cloud_shell')} <code>gsutil cors set cors.json gs://${BUCKET}</code></li>
  </ol>
  <p>${t('ov.trong_luc_cho_khung_ghep_o')}</p>
</div>`;

async function exportCollage(row) {
  const status = $('ov-export-status');
  const button = $('ov-export');
  const showName = $('ov-show-name').checked;
  const info = compareInfo(compare.before, compare.after, row.raw.weights);
  const showWeight = $('ov-show-weight').checked && info.weightChange !== null;
  button.disabled = true;
  status.textContent = t('ov.dang_ghep_anh');
  $('ov-export-preview').innerHTML = '';
  try {
    const [before, after] = await Promise.all([loadImage(compare.before.downloadURL), loadImage(compare.after.downloadURL)]);
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1350;
    const ctx = canvas.getContext('2d');
    const band = 200;
    ctx.fillStyle = '#14213d';
    ctx.fillRect(0, 0, 1080, 1350);
    drawCover(ctx, before, 0, 0, 538, 1350 - band);
    drawCover(ctx, after, 542, 0, 538, 1350 - band);
    ctx.fillStyle = '#dd7a3b';
    ctx.fillRect(538, 0, 4, 1350 - band);
    const label = (text, x) => {
      ctx.font = '700 34px "Barlow Condensed", sans-serif';
      const width = ctx.measureText(text).width + 32;
      ctx.fillStyle = 'rgba(20,33,61,.82)';
      ctx.fillRect(x, 24, width, 52);
      ctx.fillStyle = '#f5f1ea';
      ctx.fillText(text, x + 16, 62);
    };
    label(`${t('ov.truoc_2', { p0: dmy(info.beforeDay) })}`, 24);
    label(t('ov.x.after', { p0: dmy(info.afterDay) }), 566);
    ctx.fillStyle = '#f5f1ea';
    ctx.font = '800 64px "Barlow Condensed", sans-serif';
    const headline = [`${t('ov.tuan_4', { p0: num(info.weeks) })}`, showWeight ? signed(info.weightChange, ' KG', 1) : ''].filter(Boolean).join(' · ');
    ctx.fillText(headline, 40, 1350 - band + 92);
    ctx.font = '600 32px "Be Vietnam Pro", sans-serif';
    ctx.fillStyle = '#a3b0c8';
    ctx.fillText([showName ? row.name : '', 'David Coaching'].filter(Boolean).join(' · '), 40, 1350 - band + 148);
    ctx.fillStyle = '#dd7a3b';
    ctx.fillRect(1080 - 40 - 70, 1350 - band + 50, 70, 70);
    ctx.fillStyle = '#14213d';
    ctx.font = '800 40px "Barlow Condensed", sans-serif';
    ctx.fillText('DC', 1080 - 40 - 70 + 14, 1350 - band + 100);
    const blob = await new Promise((resolve, reject) => {
      try { canvas.toBlob((value) => (value ? resolve(value) : reject(new Error('cors'))), 'image/png'); } catch (error) { reject(error); }
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `truoc-sau-${compare.angle}-${info.afterDay}.png`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    $('ov-export-preview').innerHTML = `<img class="ov-export-img" src="${url}" alt="${t('ov.anh_ghep_truoc_va_sau')}">`;
    status.textContent = t('ov.da_tao_anh_ghep_neu_may');
  } catch (error) {
    console.error('collage export failed', error);
    status.textContent = '';
    $('ov-export-preview').innerHTML = CORS_HELP;
  } finally {
    button.disabled = false;
  }
}

    const angle = ANGLES.find((item) => defaultPair(row.raw.photos, item.id));
    const pair = angle ? defaultPair(row.raw.photos, angle.id) : null;
    const info = pair ? compareInfo(pair.before, pair.after, row.raw.weights) : null;
    return `<a class="cu-card ov-pf" href="overview.html?student=${encodeURIComponent(row.student.id)}">
      <strong>${escapeHtml(row.name)}</strong>
      ${pair ? `<div class="ov-pf-pair"><img src="${escapeHtml(pair.before.downloadURL)}" alt="${t('ov.truoc')}" loading="lazy"><img src="${escapeHtml(pair.after.downloadURL)}" alt="Sau" loading="lazy"></div>
        <p>${t('ov.tuan_5', { p0: angleText(angle.id), p1: num(info.weeks), p2: info.weightChange !== null ? ` · ${signed(info.weightChange, ' kg', 1)}` : '' })}</p>`
        : t('ov.p_class_ov_none_chua_du')}
    </a>`;
  }).join('')}</div>`;
}
</script>
</body>
</html>
