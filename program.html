<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="program.giao_an_david_coaching">Giáo án — David Coaching</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">
<style>
  .app-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface); gap:12px; flex-wrap:wrap; }
  .app-header .brand-mini { font-family:var(--font-display); font-weight:700; color:var(--navy-900); }
  .app-body { max-width:760px; margin:0 auto; padding:28px 20px 90px; }
  #app-content { display:none; }
  .muted { color:var(--text-500); font-size:var(--dc-fs-sm); }

  .program-meta { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 20px; }
  .program-pill { background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:var(--dc-fs-sm); font-weight:700; color:var(--text-700); }
  .program-pill strong { color:var(--navy-900); }

  .day-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:14px; }
  .day-card.is-paused { background:var(--surface-alt); }
  .day-card.is-paused .day-exercises { opacity:.6; }
  .day-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .day-head h2 { font-size:var(--dc-fs-lg); margin:0; }
  .day-tags { display:flex; gap:8px; align-items:center; }
  .day-freq { font-size:var(--dc-fs-xs); font-weight:700; color:var(--text-500); }
  .day-paused-tag { font-size:var(--dc-fs-xs); font-weight:800; color:var(--caution-text); background:var(--caution-bg); border-radius:999px; padding:3px 10px; }
  .day-exercises { list-style:none; margin:10px 0 0; padding:0; }
  .day-exercises li { padding:11px 0; border-top:1px solid var(--border); }
  .day-exercises li:first-child { border-top:0; }
  .ex-name { font-weight:700; color:var(--navy-900); }
  .ex-summary { font-size:var(--dc-fs-sm); color:var(--text-700); margin-top:2px; }
  .ex-note { font-size:var(--dc-fs-sm); color:var(--text-500); font-style:italic; margin-top:4px; }
  .program-foot { font-size:var(--dc-fs-xs); color:var(--text-500); line-height:1.6; margin:18px 0; }
  .state-message { text-align:center; padding:50px 20px; color:var(--text-500); }
  @media(max-width:560px){ .app-header { padding:14px 16px; } .brand-mini { display:none; } .app-body { padding-left:14px; padding-right:14px; } .day-card { padding:16px; } }
</style>
<link rel="stylesheet" href="client-ui.css">
<link rel="stylesheet" href="client-program.css">
<link rel="stylesheet" href="polish.css">
</head>
<body class="client-ui cu-program">
<header class="app-header">
  <span class="brand brand-page"><span class="brand-mark">DC</span><span class="brand-mini" data-i18n="program.giao_an">Giáo án</span></span>
  <div class="header-group">
    <a href="home.html" id="back-link" class="btn btn-outline btn-compact" data-i18n-init="program.quay_lai">◀ Quay lại</a>
    <button class="btn btn-outline btn-compact" id="logout-btn" data-i18n-init="program.dang_xuat">Đăng xuất</button>
  </div>
</header>

<div id="boot-status" class="dc-skeleton" role="status" aria-label="Đang tải" data-i18n-aria-label="program.dang_tai"><span class="dc-skel dc-skel-hero"></span><span class="dc-skel dc-skel-line"></span><span class="dc-skel dc-skel-card"></span><span class="dc-skel dc-skel-card"></span></div>

<main id="app-content" class="app-body">
  <section class="cu-hero" aria-labelledby="cu-pg-heading">
    <div class="cu-wrap">
      <div class="cu-hero-top">
        <span class="cu-logo" aria-hidden="true">DC</span>
        <span class="cu-hello"><span data-i18n="home.hello">Chào</span> <span id="student-name"></span></span>
      </div>
      <div id="training-tabs"></div>
      <h1 class="cu-eyebrow" id="cu-pg-heading" data-i18n="program.giao_an_cua_ban">Giáo án của bạn</h1>
      <div id="cu-pg-today"></div>
      <p class="cu-hero-copy" id="cu-pg-intro" data-i18n-init="program.toan_bo_cac_buoi_va_bai">Toàn bộ các buổi và bài tập David đã chuẩn bị cho chu kỳ này.</p>
    </div>
  </section>

  <div class="cu-program-body">
    <div id="program-days"></div>
    <p class="program-foot" id="program-foot" style="display:none;" data-i18n-init="program.muc_tap_o_day_la_muc">Mức tập ở đây là mức dự kiến cho buổi kế tiếp. Hệ thống tự điều chỉnh sau mỗi buổi bạn ghi nhận, nên con số có thể thay đổi theo kết quả của bạn.</p>
    <a class="cu-cta" id="go-train" href="client.html" style="display:none;"><span data-i18n="home.go">Vào tập</span></a>
  </div>
</main>

<script type="module">
import { auth } from './firebase-init.js';
import { mountAppShell } from './app-shell.js';
import { mountTrainingTabs } from './training-tabs.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import { getMyRole, getStudent, getActivePhase, getActivePhaseAssignments, listSessionHistory } from './training-data.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { buildProgramOverview, cycleWeek } from './program-overview-utils.js';
import { getInitialPrescription } from './progression-engine.js';
import { getExerciseById } from './exercise-seed-data.js';
import { liftSummary, nextTrainingDay } from './home-utils.js';
import { todayIso } from './nutrition-log-utils.js';
import { kg, liftLoadText, liftSetsReps, loadPerLabel } from './client-ui.js';
import { fmtDate, t } from './i18n.js';
import { exerciseTechnique } from './exercise-text.js';

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);

function frequencyLabel(perWeek) {
  const value = Number.isInteger(perWeek) ? String(perWeek) : String(Math.round(perWeek * 10) / 10);
  return t('program.perWeek', { n: value });
}

/** A lift as the workout page will prescribe it next, read the same way as on the home page; null if it cannot be read. */
function liftOf(assignment) {
  if (!assignment) return null;
  try {
    const planned = getInitialPrescription({ scheme: assignment.scheme, schemeParams: assignment.schemeParams || {}, state: assignment.state || {} });
    return liftSummary(assignment, planned, getExerciseById(assignment.exerciseId));
  } catch (error) {
    console.error('program: prescription failed', error);
    return null;
  }
}

function liftRow(item, index, byId) {
  const lift = liftOf(byId.get(item.id));
  // A lift the engine cannot read keeps the overview's own line, so nothing goes missing.
  const fallback = !lift && item.summary ? `<small>${escapeHtml(item.summary)}</small>` : '';
  const load = !lift ? '' : lift.weight
    ? `${lift.pyramid ? `<small>${t('program.from')}</small>` : ''}${kg(lift.weight)}<small> kg${lift.loadPer ? ` ${loadPerLabel(lift.loadPer)}` : ''}</small>`
    : `<small class="word">${escapeHtml(liftLoadText(lift))}</small>`;
  const row = `<span class="idx">${index + 1}</span>
    <span class="name">${escapeHtml(item.name)}${fallback}${item.note ? `<small>${escapeHtml(item.note)}</small>` : ''}</span>
    <span class="sr">${lift ? escapeHtml(liftSetsReps(lift)) : ''}</span><span class="kg">${load}</span>`;
  // Tap a lift to read how it is done before the session (David, 2026-11-02).
  const how = howToMarkup(byId.get(item.id));
  return how ? `<li class="has-how"><details><summary>${row}</summary>${how}</details></li>` : `<li>${row}</li>`;
}

/** The technique lines and the video of an exercise from the library; '' when it has neither. */
function howToMarkup(assignment) {
  const exercise = assignment ? getExerciseById(assignment.exerciseId) : null;
  const lines = exerciseTechnique(exercise).filter(Boolean);
  const video = /^https:\/\//.test(String(exercise?.videoUrl || '')) ? exercise.videoUrl : '';
  if (!lines.length && !video) return '';
  return `<div class="cu-how">
    ${lines.length ? `<p class="cu-how-title">${t('program.howTo')}</p><ol>${lines.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}</ol>` : ''}
    ${video ? `<a class="cu-how-video" href="${escapeHtml(video)}" target="_blank" rel="noopener">▶ ${t('program.video')}</a>` : ''}
  </div>`;
}

/** The cycle in the navy band: its name, week n of m with a bar, and its dates. */
function cycleMarkup(phase, overview, target) {
  const at = cycleWeek(phase, todayIso());
  const perWeek = target ? t('program.sessionsPerWeek', { n: kg(target) }) : '';
  const name = overview.phaseName ? `<p class="cu-pg-cycle">${escapeHtml(overview.phaseName)}</p>` : '';
  if (!at) {
    return `${name}${target ? `<div class="cu-pg-count">${kg(target)} <small>${t('program.sessionsPerWeekUnit', { n: kg(target) })}</small></div>` : ''}`;
  }
  const day = (iso) => fmtDate(iso);
  let big;
  let bar = '';
  if (at.beforeStart) big = `<div class="cu-pg-count cu-pg-soon">${t('program.starts')} <small>${day(at.start)}</small></div>`;
  else {
    // Past the planned end the cycle simply keeps counting; "8 / 6" would read as a mistake.
    const of = at.totalWeeks && !at.afterEnd ? `<small> / ${at.totalWeeks}</small>` : '';
    big = `<div class="cu-pg-count"><small>${t('program.week')}</small> ${at.week}${of}</div>`;
    if (at.totalWeeks) {
      const pct = Math.min(100, Math.round((Math.min(at.week, at.totalWeeks) / at.totalWeeks) * 100));
      bar = `<div class="cu-pg-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${at.totalWeeks}" aria-valuenow="${Math.min(at.week, at.totalWeeks)}" aria-label="${t('program.weekOf', { n: at.week, total: at.totalWeeks })}"><span style="width:${pct}%"></span></div>`;
    }
  }
  const dates = [
    at.beforeStart ? '' : t('program.startedOn', { date: day(at.start) }),
    at.end ? (at.afterEnd ? t('program.pastEnd', { date: day(at.end), n: at.totalWeeks }) : t('program.endsOn', { date: day(at.end) })) : '',
    perWeek,
  ].filter(Boolean).join(' · ');
  return `${name}${big}${bar}<p class="cu-pg-dates">${dates}</p>`;
}

function dayMarkup(day, { next, byId }) {
  const isNext = !day.paused && day.label === next;
  return `
  <article class="cu-day${day.paused ? ' is-paused' : ''}${isNext ? ' is-next' : ''}" aria-label="${t('workout.dayName', { day: escapeHtml(day.label) })}">
    ${isNext ? `<p class="cu-day-flag">${t('program.nextSession')}</p>` : ''}
    <div class="cu-day-head">
      <h2>${t('workout.dayName', { day: escapeHtml(day.label) })}</h2>
      ${day.paused ? `<span class="cu-day-paused">${t('workout.chipPaused')}</span>` : `<span class="cu-day-freq">${frequencyLabel(day.perWeek)} · ${t('workout.exerciseCount', { n: day.exercises.length })}</span>`}
    </div>
    ${day.paused ? `<p class="cu-day-note">${t('program.pausedNote')}</p>` : ''}
    <ol class="cu-day-lifts">${day.exercises.map((item, index) => liftRow(item, index, byId)).join('')}</ol>
  </article>`;
}

function render(overview, { assignments, next, phase }) {
  const byId = new Map(assignments.map((item) => [item.id, item]));
  if (!overview.days.length) {
    $('cu-pg-today').innerHTML = `<h2 class="cu-pg-title">${t('workout.noProgram')}</h2>`;
    $('cu-pg-intro').hidden = true;
    // C5: tiêu đề "Chưa có giáo án" đã ở dải navy, thẻ chỉ giữ lời giải thích và hai nút.
    $('program-days').innerHTML = `<div class="dc-empty">${t('workout.noProgramCopy')}<div class="dc-empty-actions"><a class="dc-btn dc-btn-secondary" href="habits.html">${t('workout.openHabits')}</a><a class="dc-btn dc-btn-secondary" href="nutrition.html">${t('workout.openNutrition')}</a></div></div>`;
    return;
  }
  const target = Math.round(overview.weeklyTarget * 10) / 10;
  // The next session is marked on its own card, so the band carries only the cycle.
  $('cu-pg-today').innerHTML = cycleMarkup(phase, overview, target);
  $('cu-pg-intro').textContent = t('program.tapHint');
  $('program-days').innerHTML = overview.days.map((day) => dayMarkup(day, { next, byId })).join('');
  $('program-foot').style.display = 'block';
  $('go-train').style.display = 'flex';
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['student']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'student') { $('boot-status').textContent = t('home.notStudent'); return; }
    mountAppShell({ role: 'student', active: 'training' });
    mountTrainingTabs('program');
    $('back-link').dataset.appShellHidden = 'true';
    const [profile, phase, assignments] = await Promise.all([getStudent(user.uid), getActivePhase(user.uid), getActivePhaseAssignments(user.uid)]);
    $('student-name').textContent = profile?.displayName || '';
    const overview = buildProgramOverview({ assignments, phase, hiddenDays: profile?.hiddenDays || [] });
    // The next session the same way the home page works it out; left out if the history cannot be read.
    const sessions = await listSessionHistory(user.uid, { max: 20 }).catch((error) => { console.error('program: history failed', error); return null; });
    const next = sessions ? nextTrainingDay(sessions, overview.days.map((day) => day.label), profile?.hiddenDays || [], todayIso(), profile?.dayRenames || {}).day : null;
    render(overview, { assignments, next, phase });
    $('boot-status').style.display = 'none';
    $('app-content').style.display = 'block';
  } catch (error) {
    console.error('program load failed:', error);
    $('boot-status').textContent = t('program.loadFailed');
  }
});

$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });
</script>
</body>
</html>
