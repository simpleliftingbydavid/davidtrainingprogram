<script type="module">
import { auth } from './firebase-init.js';
import { mountAppShell } from './app-shell.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import {
  getMyRole, getStudent, getActivePhase, getActivePhaseAssignments, listSessionHistory,
  getHabitPlan, listHabitLogs, saveHabitStatus, getNutritionPlan, getNutritionCheckin, listNutritionCheckins,
  listBodyWeightLogs, listProgressPhotos,
} from './training-data.js';
import { weightSinceStart } from './progress-utils.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { getExerciseById } from './exercise-seed-data.js';
import { getInitialPrescription } from './progression-engine.js';
import { todayIso } from './nutrition-log-utils.js';
import { mealCountFor, normalizeSimpleDay, nutritionMode } from './nutrition-simple.js';
import { dayTotals, normalizeFoodEntries } from './nutrition-food-log.js';
import { STREAK_READ_DAYS, hasNutritionLog, loggingStreak, streakMarkup } from './nutrition-streak.js';
import { buildProgramOverview } from './program-overview-utils.js';
import {
  daysSinceLastSession, latestRecord, liftSummary, nextTrainingDay, photoReminder, sessionsThisWeek,
  weekPunch, weeksActive, weightSeries, weightTrend,
} from './home-utils.js';
import { kg, liftLoadText as loadText, liftSetsReps as setsReps, loadPerLabel, loadPerSuffix, plateFigure, weekdayDate } from './client-ui.js';
import { fmtDate, fmtNumber, registerLangRerender, t } from './i18n.js';
import { HABIT_STATUS, MISSED_TWICE, currentStreak, habitDayStatus, habitToday, missedInARow } from './habit-utils.js';

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
const shortDay = (iso) => fmtDate(iso);
const dayName = (iso) => weekdayDate(iso);
const num = (value) => fmtNumber(value, { grouping: true });
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';
const CAMERA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>';

const KEYS = ['profile', 'phase', 'assignments', 'sessions', 'habitPlan', 'habitLogs', 'nutritionPlan', 'nutritionCheckin', 'nutritionDays', 'weights', 'firstWeights', 'photos'];
const data = {};   // each key is { ok: true, value } or { ok: false }
let uid = null;
let today = habitToday();
const pending = new Set();
let toastTimer = null;

function showToast(message, type = 'success') {
  const toast = $('quiet-toast');
  toast.textContent = message;
  toast.className = `quiet-toast ${type === 'error' ? 'error' : ''} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3600);
}

const ok = (...keys) => keys.every((key) => data[key]?.ok);
const val = (key, fallback) => (data[key]?.ok ? data[key].value : fallback);
const hiddenDays = () => (val('profile', null) || {}).hiddenDays || [];
const failed = (title) => `<div class="cu-card-head"><h3>${title}</h3></div><p class="cu-error">${t('home.cardFailed')}</p>`;

// ---------- the navy band: today's session ----------

/** A lift as the workout page will prescribe it today, or null when it cannot be read. */
function prescription(assignment) {
  try {
    const planned = getInitialPrescription({ scheme: assignment.scheme, schemeParams: assignment.schemeParams, state: assignment.state });
    return liftSummary(assignment, planned, getExerciseById(assignment.exerciseId));
  } catch (error) {
    console.error('home: prescription failed', error);
    return null;
  }
}

function renderTraining() {
  const box = $('card-training');
  if (!ok('assignments', 'sessions', 'profile')) {
    box.innerHTML = `<p class="cu-eyebrow">${t('home.training')}</p><p class="cu-hero-copy">${t('home.trainingFailed')}</p>`;
    return;
  }
  const assignments = val('assignments', []);
  const days = [...new Set(assignments.map((item) => String(item.dayLabel || '').trim()).filter(Boolean))];
  if (!days.length) {
    box.innerHTML = `<p class="cu-eyebrow">${t('home.training')}</p><h2 class="cu-lift-name">${t('home.noProgram')}</h2><p class="cu-hero-copy">${t('home.noProgramCopy')}</p>`;
    return;
  }
  const next = nextTrainingDay(val('sessions', []), days, hiddenDays(), todayIso(), (val('profile', null) || {}).dayRenames || {});
  if (!next.day) {
    box.innerHTML = `<p class="cu-eyebrow">${t('home.training')}</p><h2 class="cu-lift-name">${t('home.paused')}</h2><p class="cu-hero-copy">${t('home.pausedCopy')}</p>`;
    return;
  }
  const list = assignments.filter((item) => String(item.dayLabel || '').trim() === next.day)
    .sort((a, b) => (a.orderInDay || 0) - (b.orderInDay || 0));
  const nameOf = (item) => item.exerciseNameSnapshot?.vi || getExerciseById(item.exerciseId)?.nameVi || t('home.exercise');
  if (next.trainedToday) {
    box.innerHTML = `<p class="cu-eyebrow">${t('home.todayDay', { day: escapeHtml(next.lastDay) })}</p>
      <h2 class="cu-lift-name">${t('home.doneToday')}</h2>
      <p class="cu-hero-copy">${t('home.nextSession', { day: escapeHtml(next.day), n: list.length })}</p>
      <a class="cu-cta cu-cta-quiet" href="program.html">${t('home.seeProgram')}</a>`;
    return;
  }
  const [first, ...rest] = list;
  const lift = prescription(first);
  const shown = rest.slice(0, 3);
  const others = rest.slice(3);
  const rows = shown.map((item) => {
    const each = prescription(item);
    const load = each?.weight ? `${kg(each.weight)}${each.loadPer ? `<small> ${loadPerLabel(each.loadPer)}</small>` : ''}` : `<small>${escapeHtml(loadText(each))}</small>`;
    return `<li><span class="name">${escapeHtml(nameOf(item))}</span><span class="sr">${escapeHtml(setsReps(each))}</span><span class="kg">${load}</span></li>`;
  }).join('');
  const more = others.length ? `<li class="more">${t('home.more', { n: others.length, names: others.map((item) => escapeHtml(nameOf(item))).join(', ') })}</li>` : '';
  // After 4+ days off: one friendly line above the session, never a scolding one.
  const gap = daysSinceLastSession(val('sessions', []), todayIso());
  const nudge = gap != null && gap >= 4
    ? `<p class="cu-nudge">${t('home.gapNudge', { n: gap })}</p>`
    : '';
  box.innerHTML = `${nudge}<p class="cu-eyebrow">${t('home.todayDayCount', { day: escapeHtml(next.day), n: list.length })}</p>
    <h2 class="cu-lift-name">${escapeHtml(nameOf(first))}</h2>
    ${lift ? `<div class="cu-lift-load">${escapeHtml(setsReps(lift, { full: true }).replace('×', ' × '))} <span class="cu-accent">· ${escapeHtml(loadText(lift))}</span></div>` : ''}
    ${lift?.pyramid ? `<p class="cu-lift-note">${t('home.pyramidNote')}</p>` : ''}
    ${plateFigure(lift, getExerciseById(first.exerciseId))}
    ${rows ? `<div class="cu-next-label">${t('home.then')}</div><ol class="cu-next">${rows}${more}</ol>` : ''}
    <a class="cu-cta" href="client.html">${t('home.go')}</a>`;
}

// ---------- thẻ: thói quen ----------
function renderHabits() {
  const card = $('card-habits');
  if (!ok('habitPlan', 'habitLogs')) { card.innerHTML = failed(t('home.habits')); return; }
  const plan = val('habitPlan', { habits: [] });
  const logs = val('habitLogs', {});
  if (!plan.habits.length) {
    card.innerHTML = `<div class="cu-card-head"><h3>${t('home.habits')}</h3></div>
      <p>${t('home.habitsEmpty')}</p>
      <a class="cu-link" href="habits.html">${t('home.habitsPick')}</a>`;
    return;
  }
  const done = plan.habits.filter((habit) => habitDayStatus(logs, today, habit)).length;
  const rows = plan.habits.map((habit) => {
    const status = habitDayStatus(logs, today, habit);
    const busy = pending.has(habit.id) ? 'disabled' : '';
    const streak = currentStreak(logs, habit, today);
    const missed = missedInARow(logs, habit, today);
    const nudge = !status && missed >= MISSED_TWICE;
    return `<div class="cu-habit"><div class="name">${escapeHtml(habit.name)}<small class="${nudge ? 'nudge' : ''}">${streak ? t('home.streakDays', { n: streak }) : t('home.noStreak')}${nudge ? t('home.habitNudge') : ''}</small></div>
      <div class="cu-habit-btns">
        <button type="button" data-habit="${habit.id}" data-status="${HABIT_STATUS.FULL}" class="${status === HABIT_STATUS.FULL ? 'on' : ''}" aria-pressed="${status === HABIT_STATUS.FULL}" ${busy}>${t('home.habitDone')}</button>
        <button type="button" data-habit="${habit.id}" data-status="${HABIT_STATUS.MINIMUM}" class="${status === HABIT_STATUS.MINIMUM ? 'on' : ''}" aria-pressed="${status === HABIT_STATUS.MINIMUM}" ${busy} title="${escapeHtml(habit.twoMinute)}">${t('home.habit2min')}</button>
      </div></div>`;
  }).join('');
  card.innerHTML = `<div class="cu-card-head"><h3>${t('home.habits')}</h3><span class="cu-count">${done}/${plan.habits.length}<small>${t('home.logged')}</small></span></div>
    <div class="cu-habits">${rows}</div>
    <a class="cu-link" href="habits.html">${t('home.openHabits')}</a>`;
}

async function tickHabit(habitId, status) {
  if (pending.has(habitId)) return;
  const current = val('habitLogs', {})[today]?.[habitId] || null;
  const next = current === status ? null : status;
  const logs = val('habitLogs', {});
  const before = logs[today] ? { ...logs[today] } : undefined;
  const optimistic = { ...(logs[today] || {}) };
  if (next) optimistic[habitId] = next; else delete optimistic[habitId];
  logs[today] = optimistic;
  pending.add(habitId);
  renderHabits();
  try {
    await saveHabitStatus(uid, today, habitId, next);
  } catch (error) {
    console.error('saveHabitStatus failed:', error);
    if (before) logs[today] = before; else delete logs[today];
    showToast(t('home.saveFailed'), 'error');
  } finally {
    pending.delete(habitId);
    renderHabits();
  }
}
$('card-habits').addEventListener('click', (event) => {
  const button = event.target.closest('[data-habit]');
  if (button) tickHabit(button.dataset.habit, button.dataset.status);
});

// ---------- thẻ: dinh dưỡng ----------
// 2026-11-03: no menus any more. Simple mode: meals with protein and vegetables today. Detailed
// mode: calories logged today against the target.
function renderNutrition() {
  const card = $('card-nutrition');
  if (!ok('nutritionPlan', 'nutritionCheckin')) { card.innerHTML = failed(t('home.nutrition')); return; }
  const plan = val('nutritionPlan', null);
  const student = ok('profile') ? val('profile', null) : null;
  const settings = student?.nutritionSettings || {};
  const checkin = val('nutritionCheckin', null);
  const kcal = Number(plan?.kcal) || 0;
  const protein = Number(plan?.protein) || 0;
  const target = [kcal ? `${num(kcal)} kcal` : '', protein ? t('home.protein', { g: protein }) : ''].filter(Boolean).join(' · ');
  let body;
  if (nutritionMode(student) === 'detailed') {
    const totals = dayTotals(normalizeFoodEntries(checkin?.foodEntries));
    const eaten = Math.round(totals.values.kcal);
    body = `<div class="cu-big"><strong>${num(eaten)}</strong><span>${kcal ? t('home.kcalOfToday', { kcal: num(kcal) }) : t('home.kcalToday')}</span></div>
      <p>${totals.count ? `${t('home.foodsLogged', { n: totals.count })}${kcal ? t('home.kcalLeft', { kcal: num(Math.max(0, kcal - eaten)) }) : ''}.` : t('home.noFoods')}</p>`;
  } else {
    const count = mealCountFor(settings, plan, today);
    const done = count ? normalizeSimpleDay({ ...(checkin || {}), simpleMealCount: count }).simpleMeals.length : 0;
    body = count
      ? `<div class="cu-big"><strong>${done}/${count}</strong><span>${t('home.mealsOk')}</span></div>`
      : `<p>${t('home.noMealCount')}</p>`;
  }
  // Chuỗi ghi bữa (2026-11-10). Đọc lịch sử lỗi thì chỉ bỏ dòng chuỗi, thẻ vẫn hiện.
  const streak = ok('nutritionDays')
    ? streakMarkup(loggingStreak(val('nutritionDays', []), todayIso(), { loggedToday: hasNutritionLog(checkin || {}), limit: STREAK_READ_DAYS }))
    : '';
  card.innerHTML = `<div class="cu-card-head"><h3>${t('home.nutrition')}</h3><span class="cu-meta">${escapeHtml(target)}</span></div>
    ${body}
    ${streak}
    <a class="cu-link" href="nutrition.html">${t('home.openNutrition')}</a>`;
}

// ---------- thẻ: tuần này ----------
function renderWeek() {
  const card = $('card-week');
  if (!ok('sessions', 'assignments', 'profile')) { card.innerHTML = failed(t('home.week')); return; }
  const sessions = val('sessions', []);
  const overview = buildProgramOverview({ assignments: val('assignments', []), phase: val('phase', null), hiddenDays: hiddenDays() });
  const count = sessionsThisWeek(sessions, todayIso());
  const target = Math.round(overview.weeklyTarget * 10) / 10;
  const active = weeksActive(sessions);
  const dots = weekPunch(sessions, todayIso()).map((day) => `<li class="${[day.trained ? 'trained' : '', day.today ? 'today' : ''].join(' ').trim()}">
      <div class="d">${t(`date.short.${new Date(`${day.iso}T00:00:00Z`).getUTCDay()}`)}</div><div class="dot">${day.trained ? CHECK : ''}</div>${day.today ? `<small>${t('home.today')}</small>` : ''}
      <span class="cu-visually-hidden">${day.trained ? t('home.trained') : day.future ? '' : t('home.notTrained')}</span></li>`).join('');
  const left = target ? Math.max(0, Math.ceil(target - count)) : null;
  const message = !sessions.length
    ? t('home.firstSession')
    : `${left === null ? '' : left === 0 ? t('home.weekDone', { n: kg(target) }) : t('home.weekLeft', { n: left })}${t('home.weeksActive', { n: active })}`;
  card.innerHTML = `<div class="cu-card-head"><h3>${t('home.week')}</h3><span class="cu-count">${count}<small>${target ? t('home.ofSessions', { n: kg(target) }) : t('home.sessions', { n: count })}</small></span></div>
    <ol class="cu-punch" aria-label="${t('home.weekDays')}">${dots}</ol>
    <p>${message}</p>`;
}

// ---------- thẻ: cân nặng và kỷ lục ----------
function sparkline(series) {
  const W = 300; const H = 60; const pad = 6;
  const weights = series.map((point) => point.weight);
  const min = Math.min(...weights); const max = Math.max(...weights);
  const span = Math.max(max - min, 0.4);
  const x = (index) => pad + index * (W - pad * 2) / (series.length - 1);
  const y = (weight) => Math.round(((H - 8) - ((weight - min) / span) * (H - 18)) * 10) / 10;
  const points = series.map((point, index) => `${Math.round(x(index) * 10) / 10},${y(point.weight)}`).join(' ');
  const last = series[series.length - 1];
  return `<svg class="cu-spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(t('home.sparkAria', { n: series.length, from: kg(series[0].weight), to: kg(last.weight) }))}">
    <line x1="0" y1="${H - 4}" x2="${W}" y2="${H - 4}" stroke="#d3d9e3" stroke-width="1"></line>
    <polyline points="${points}" fill="none" stroke="#14213d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <circle cx="${W - pad}" cy="${y(last.weight)}" r="5" fill="#dd7a3b"></circle>
  </svg>`;
}

function renderProgress() {
  const card = $('card-progress');
  const parts = [];
  let chartNote = '';
  if (ok('weights')) {
    const recent = val('weights', []);
    const trend = weightTrend(recent, todayIso());
    const series = weightSeries(recent, todayIso());
    if (!trend.latest) parts.push(`<p>${t('home.noWeight')}</p>`);
    else {
      const when = trend.latest.day === todayIso() ? t('home.thisMorning') : shortDay(trend.latest.day);
      parts.push(`<div class="cu-big"><strong>${kg(trend.latest.weight)}</strong><span>kg · ${when}</span></div>`);
      if (series.length >= 2) { parts.push(sparkline(series)); chartNote = `<span class="cu-meta">${t('home.days14')}</span>`; }
      parts.push(weightStatsMarkup(recent, trend));
    }
    // Cân hằng ngày chỉ ghi ở Dinh dưỡng (David chốt 2026-11-10); ở đây chỉ báo đã cân chưa.
    parts.push(weighInLinkMarkup(trend.latest?.day === todayIso() ? trend.latest.weight : null));
  }
  if (ok('sessions')) {
    const record = latestRecord(val('sessions', []), (id) => getExerciseById(id)?.nameVi || id, todayIso());
    if (record) {
      parts.push(`<div class="cu-pr"><div><div class="label">${t('home.newRecord', { date: shortDay(record.day) })}</div><div class="lift">${escapeHtml(record.name)}</div></div>
        <div class="jump"><span>${kg(record.from)} →</span> ${kg(record.to)} kg${loadPerSuffix(record.id)}</div></div>`);
    }
  }
  if (!ok('weights') && !ok('sessions')) { card.innerHTML = failed(t('home.weight')); return; }
  card.innerHTML = `<div class="cu-card-head"><h3>${t('home.weight')}</h3>${chartNote}</div>${parts.join('')}
    <a class="cu-link" href="progress-photos.html">${t('home.openProgress')}</a>`;
}

/** The week in two numbers, the same way Tiến trình reads them: the 7-day average against the
 *  7 days before, and the change since the first week with 4 weigh-ins. */
function weightStatsMarkup(recent, trend) {
  const signed = (value) => `${value > 0 ? '+' : value < 0 ? '−' : '±'}${kg(Math.abs(Math.round(value * 10) / 10))}`;
  const week = trend.enough
    ? `<strong>${kg(Math.round(trend.thisWeek.avg * 10) / 10)}<small> kg</small></strong><span>${t('home.vsLastWeek', { d: signed(trend.delta) })}</span>`
    : `<strong>–</strong><span>${t('home.weighedOf', { n: trend.thisWeek?.count || 0 })}</span>`;
  // The oldest weigh-ins and the latest 30, each counted once.
  const all = [...new Map([...(ok('firstWeights') ? val('firstWeights', []) : []), ...recent].map((log) => [log.id || `${log.weight}-${dayOfLog(log)}`, log])).values()];
  const since = weightSinceStart(all, todayIso());
  const start = since
    ? `<strong>${signed(since.delta)}<small> kg</small></strong><span>${t('home.sinceWeek', { date: shortDay(since.first.start) })}</span>`
    : `<strong>–</strong><span>${t('home.need2Weeks')}</span>`;
  return `<dl class="cu-wstats"><div><dt>${t('home.avg7')}</dt><dd>${week}</dd></div><div><dt>${t('home.sinceStart')}</dt><dd>${start}</dd></div></dl>`;
}

const dayOfLog = (log) => (log.loggedAt?.toDate ? log.loggedAt.toDate().toISOString().slice(0, 10) : '');

function weighInLinkMarkup(todayWeight) {
  const state = todayWeight === null ? t('home.notWeighed') : t('home.todayWeight', { kg: kg(todayWeight) });
  return `<a class="cu-weighin-link" href="nutrition.html"><span>${state}</span><b>${t('home.logWeight')}</b></a>`;
}

function renderPhoto() {
  const host = $('card-photo');
  if (!ok('photos')) { host.innerHTML = ''; return; }
  const reminder = photoReminder(val('photos', []), todayIso());
  const text = reminder.first ? t('home.firstPhoto')
    : reminder.due ? t('home.photoDue', { n: reminder.daysSince }) : '';
  host.innerHTML = text ? `<a class="cu-row-link" href="progress-photos.html#anh">${CAMERA}<span>${text}</span><b>${t('home.shoot')}</b></a>` : '';
}

// ---------- lưu ý của David ----------
function renderNote() {
  const notes = ok('nutritionPlan') ? String(val('nutritionPlan', null)?.notes || '').trim() : '';
  $('card-note-host').innerHTML = notes
    ? `<section class="cu-card cu-note" aria-labelledby="coach-note-title"><div class="cu-card-head"><h3 id="coach-note-title">${t('home.coachNote')}</h3></div><p>${escapeHtml(notes)}</p></section>` : '';
}

function renderIdentity() {
  const identity = ok('habitPlan') ? val('habitPlan', { identity: '' }).identity : '';
  $('home-identity').innerHTML = identity
    ? `<p class="cu-identity">${t('home.identity', { identity: escapeHtml(identity) })}</p>` : '';
}

function renderAll() {
  $('student-name').textContent = val('profile', null)?.displayName || '';
  $('today-label').textContent = dayName(todayIso());
  renderIdentity(); renderTraining(); renderHabits(); renderNutrition(); renderWeek(); renderProgress(); renderPhoto(); renderNote();
}

async function load() {
  today = habitToday();
  const iso = todayIso();
  const reads = {
    profile: () => getStudent(uid),
    phase: () => getActivePhase(uid),
    assignments: () => getActivePhaseAssignments(uid),
    sessions: () => listSessionHistory(uid, { max: 60 }),
    habitPlan: () => getHabitPlan(uid),
    habitLogs: () => listHabitLogs(uid, { days: 14 }),
    nutritionPlan: () => getNutritionPlan(uid),
    nutritionCheckin: () => getNutritionCheckin(uid, iso),
    nutritionDays: () => listNutritionCheckins(uid, { max: STREAK_READ_DAYS }),
    weights: () => listBodyWeightLogs(uid, { max: 30 }),
    // The first weigh-ins on file, for "từ tuần đầu" without reading the whole history.
    firstWeights: () => listBodyWeightLogs(uid, { max: 14, oldestFirst: true }),
    photos: () => listProgressPhotos(uid),
  };
  // One failing read must not blank the page: each card reports for itself.
  const settled = await Promise.allSettled(KEYS.map((key) => reads[key]()));
  settled.forEach((result, index) => {
    const key = KEYS[index];
    if (result.status === 'fulfilled') data[key] = { ok: true, value: result.value };
    else { console.error(`home: ${key} failed`, result.reason); data[key] = { ok: false }; }
  });
  renderAll();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['student']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'student') { $('boot-status').textContent = t('home.notStudent'); return; }
    uid = user.uid;
    mountAppShell({ role: 'student', active: 'home' });
    await load();
    registerLangRerender(renderAll);
    $('boot-status').style.display = 'none';
    $('app-content').style.display = 'block';
  } catch (error) {
    console.error('home load failed:', error);
    $('boot-status').textContent = t('home.loadFailed');
  }
});

// A tab left open overnight would otherwise keep ticking yesterday's habits as today's.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && uid && habitToday() !== today) void load();
});

$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });
</script>
</body>
</html>
