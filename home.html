<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang chủ — David Training Program</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="client-ui">
<!-- Kept for the account menu's "Đăng xuất", which clicks it. -->
<div hidden><button type="button" id="logout-btn">Đăng xuất</button></div>

<div id="boot-status" class="app-loading" aria-label="Đang tải"><div class="app-loading-line short"></div><div class="app-loading-line"></div><div class="app-loading-line"></div></div>
<main id="app-content">
  <h1 class="cu-visually-hidden">Hôm nay của bạn</h1>
  <section class="cu-hero" aria-label="Buổi tập hôm nay">
    <div class="cu-wrap">
      <div class="cu-hero-top">
        <span class="cu-logo" aria-hidden="true">DC</span>
        <span class="cu-hello">Chào <span id="student-name"></span> · <span id="today-label"></span></span>
      </div>
      <div id="card-training"></div>
    </div>
  </section>

  <div class="cu-wrap cu-body">
    <div id="home-identity"></div>

    <h2 class="cu-section">Việc hôm nay</h2>

      <section class="cu-card" id="card-nutrition" aria-label="Dinh dưỡng"></section>
    </div>

    <h2 class="cu-section">Tuần này và tiến trình</h2>

      <section class="cu-card" id="card-progress" aria-label="Cân nặng và kỷ lục"></section>

  </div>
</main>
<div id="quiet-toast" class="quiet-toast" role="status" aria-live="polite"></div>

<script type="module">
import { auth } from './firebase-init.js';
import { mountAppShell } from './app-shell.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import {
  getMyRole, getStudent, getActivePhase, getActivePhaseAssignments, listSessionHistory,
  getHabitPlan, listHabitLogs, saveHabitStatus, getNutritionPlan, getNutritionCheckin,
  listBodyWeightLogs, listProgressPhotos,
} from './training-data.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { getExerciseById } from './exercise-seed-data.js';
import { getInitialPrescription } from './progression-engine.js';
import { scopeNutritionData, todayIso } from './nutrition-log-utils.js';
import { mealsForDate } from './nutrition-week-utils.js';
import { buildProgramOverview } from './program-overview-utils.js';
import {
  daysSinceLastSession, latestRecord, liftSummary, nextTrainingDay, photoReminder, sessionsThisWeek,
  weekPunch, weeksActive, weightSeries, weightTrend,
} from './home-utils.js';
import { kg, liftLoadText as loadText, liftSetsReps as setsReps, plateFigure } from './client-ui.js';
import { HABIT_STATUS, MISSED_TWICE, currentStreak, habitDayStatus, habitToday, missedInARow } from './habit-utils.js';

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
const shortDay = (iso) => { const [, month, day] = iso.split('-'); return `${day}/${month}`; };
const WEEKDAY_NAMES = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const dayName = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${WEEKDAY_NAMES[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]} ${shortDay(iso)}`; };
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>';
const CAMERA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>';

const KEYS = ['profile', 'phase', 'assignments', 'sessions', 'habitPlan', 'habitLogs', 'nutritionPlan', 'nutritionCheckin', 'weights', 'photos'];
const data = {};   // each key is { ok: true, value } or { ok: false }
let uid = null;
let today = habitToday();
const pending = new Set();
let toastTimer = null;

function showToast(message, type = 'success') {
  const toast = $('quiet-toast');
  toast.textContent = message;
  toast.className = `quiet-toast ${type === 'error' ? 'error' : ''} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3600);
}

const ok = (...keys) => keys.every((key) => data[key]?.ok);
const val = (key, fallback) => (data[key]?.ok ? data[key].value : fallback);
const hiddenDays = () => (val('profile', null) || {}).hiddenDays || [];
const failed = (title) => `<div class="cu-card-head"><h3>${title}</h3></div><p class="cu-error">Chưa tải được mục này lúc này. Các mục khác vẫn dùng được.</p>`;

// ---------- the navy band: today's session ----------

/** A lift as the workout page will prescribe it today, or null when it cannot be read. */
function prescription(assignment) {
  try {
    const planned = getInitialPrescription({ scheme: assignment.scheme, schemeParams: assignment.schemeParams, state: assignment.state });
    return liftSummary(assignment, planned, getExerciseById(assignment.exerciseId));
  } catch (error) {
    console.error('home: prescription failed', error);
    return null;
  }
}

function renderTraining() {
  const box = $('card-training');
  if (!ok('assignments', 'sessions', 'profile')) {
    box.innerHTML = '<p class="cu-eyebrow">Tập luyện</p><p class="cu-hero-copy">Chưa tải được buổi tập lúc này. Các mục khác vẫn dùng được.</p>';
    return;
  }
  const assignments = val('assignments', []);
  const days = [...new Set(assignments.map((item) => String(item.dayLabel || '').trim()).filter(Boolean))];
  if (!days.length) {
    box.innerHTML = '<p class="cu-eyebrow">Tập luyện</p><h2 class="cu-lift-name">Chưa có giáo án</h2><p class="cu-hero-copy">David chưa thiết lập giáo án cho bạn. Hãy nhắn David nhé.</p>';
    return;
  }
  const next = nextTrainingDay(val('sessions', []), days, hiddenDays(), todayIso(), (val('profile', null) || {}).dayRenames || {});
  if (!next.day) {
    box.innerHTML = '<p class="cu-eyebrow">Tập luyện</p><h2 class="cu-lift-name">Đang tạm nghỉ</h2><p class="cu-hero-copy">Mọi buổi trong chu kỳ này đang tạm tắt. David sẽ mở lại khi phù hợp.</p>';
    return;
  }
  const list = assignments.filter((item) => String(item.dayLabel || '').trim() === next.day)
    .sort((a, b) => (a.orderInDay || 0) - (b.orderInDay || 0));
  const nameOf = (item) => item.exerciseNameSnapshot?.vi || getExerciseById(item.exerciseId)?.nameVi || 'Bài tập';
  if (next.trainedToday) {
    box.innerHTML = `<p class="cu-eyebrow">Hôm nay · Buổi ${escapeHtml(next.lastDay)}</p>
      <h2 class="cu-lift-name">Đã tập xong</h2>
      <p class="cu-hero-copy">Buổi kế tiếp: <strong>Buổi ${escapeHtml(next.day)}</strong> · ${list.length} bài.</p>
      <a class="cu-cta cu-cta-quiet" href="program.html">Xem giáo án</a>`;
    return;
  }
  const [first, ...rest] = list;
  const lift = prescription(first);
  const shown = rest.slice(0, 3);
  const others = rest.slice(3);
  const rows = shown.map((item) => {
    const each = prescription(item);
    const load = each?.weight ? `${kg(each.weight)}` : `<small>${escapeHtml(loadText(each))}</small>`;
    return `<li><span class="name">${escapeHtml(nameOf(item))}</span><span class="sr">${escapeHtml(setsReps(each))}</span><span class="kg">${load}</span></li>`;
  }).join('');
  const more = others.length ? `<li class="more">và ${others.length} bài nữa · ${others.map((item) => escapeHtml(nameOf(item))).join(', ')}</li>` : '';
  // After 4+ days off: one friendly line above the session, never a scolding one.
  const gap = daysSinceLastSession(val('sessions', []), todayIso());
  const nudge = gap != null && gap >= 4
    ? `<p class="cu-nudge">Đã ${gap} ngày bạn chưa tập. Một buổi hôm nay, dù nhẹ hơn mọi khi, là đủ để giữ nhịp.</p>`
    : '';
  box.innerHTML = `${nudge}<p class="cu-eyebrow">Hôm nay · Buổi ${escapeHtml(next.day)} · ${list.length} bài</p>
    <h2 class="cu-lift-name">${escapeHtml(nameOf(first))}</h2>
    ${lift ? `<div class="cu-lift-load">${escapeHtml(setsReps(lift, { full: true }).replace('×', ' × '))} <span class="cu-accent">· ${escapeHtml(loadText(lift))}</span></div>` : ''}
    ${lift?.pyramid ? '<p class="cu-lift-note">Mỗi set một mức tạ riêng; xem đủ trong buổi tập.</p>' : ''}
    ${plateFigure(lift, getExerciseById(first.exerciseId))}
    ${rows ? `<div class="cu-next-label">Sau đó</div><ol class="cu-next">${rows}${more}</ol>` : ''}
    <a class="cu-cta" href="client.html">Vào tập ${ARROW}</a>`;
}

// ---------- thẻ: thói quen ----------
function renderHabits() {
  const card = $('card-habits');
  if (!ok('habitPlan', 'habitLogs')) { card.innerHTML = failed('Thói quen'); return; }
  const plan = val('habitPlan', { habits: [] });
  const logs = val('habitLogs', {});
  if (!plan.habits.length) {
    card.innerHTML = `<div class="cu-card-head"><h3>Thói quen</h3></div>
      <p>Làm đều một việc đơn giản mỗi ngày quan trọng hơn làm nhiều.</p>
      <a class="cu-link" href="habits.html">Chọn 1 thói quen nhỏ →</a>`;
    return;
  }
  const done = plan.habits.filter((habit) => habitDayStatus(logs, today, habit)).length;
  const rows = plan.habits.map((habit) => {
    const status = habitDayStatus(logs, today, habit);
    const busy = pending.has(habit.id) ? 'disabled' : '';
    const streak = currentStreak(logs, habit, today);
    const missed = missedInARow(logs, habit, today);
    const nudge = !status && missed >= MISSED_TWICE;
    return `<div class="cu-habit"><div class="name">${escapeHtml(habit.name)}<small class="${nudge ? 'nudge' : ''}">${streak ? `Chuỗi ${streak} ngày` : 'Chưa có chuỗi'}${nudge ? ' · hôm nay quay lại bằng bản 2 phút' : ''}</small></div>
      <div class="cu-habit-btns">
        <button type="button" data-habit="${habit.id}" data-status="${HABIT_STATUS.FULL}" class="${status === HABIT_STATUS.FULL ? 'on' : ''}" aria-pressed="${status === HABIT_STATUS.FULL}" ${busy}>Xong</button>
        <button type="button" data-habit="${habit.id}" data-status="${HABIT_STATUS.MINIMUM}" class="${status === HABIT_STATUS.MINIMUM ? 'on' : ''}" aria-pressed="${status === HABIT_STATUS.MINIMUM}" ${busy} title="${escapeHtml(habit.twoMinute)}">2 phút</button>
      </div></div>`;
  }).join('');
  card.innerHTML = `<div class="cu-card-head"><h3>Thói quen</h3><span class="cu-count">${done}/${plan.habits.length}<small> đã ghi</small></span></div>
    <div class="cu-habits">${rows}</div>
    <a class="cu-link" href="habits.html">Mở thói quen →</a>`;
}

async function tickHabit(habitId, status) {
  if (pending.has(habitId)) return;
  const current = val('habitLogs', {})[today]?.[habitId] || null;
  const next = current === status ? null : status;
  const logs = val('habitLogs', {});
  const before = logs[today] ? { ...logs[today] } : undefined;
  const optimistic = { ...(logs[today] || {}) };
  if (next) optimistic[habitId] = next; else delete optimistic[habitId];
  logs[today] = optimistic;
  pending.add(habitId);
  renderHabits();
  try {
    await saveHabitStatus(uid, today, habitId, next);
  } catch (error) {
    console.error('saveHabitStatus failed:', error);
    if (before) logs[today] = before; else delete logs[today];
    showToast('Chưa lưu được. Kiểm tra kết nối rồi thử lại.', 'error');
  } finally {
    pending.delete(habitId);
    renderHabits();
  }
}
$('card-habits').addEventListener('click', (event) => {
  const button = event.target.closest('[data-habit]');
  if (button) tickHabit(button.dataset.habit, button.dataset.status);
});

// ---------- thẻ: dinh dưỡng ----------
/** "Bữa sáng" → "Sáng", "Bữa phụ chiều" → "Phụ chiều". */
function mealShortName(name) {
  const rest = String(name || '').replace(/^Bữa\s+/i, '').trim() || String(name || '');
  return rest.charAt(0).toUpperCase() + rest.slice(1);
}

function renderNutrition() {
  const card = $('card-nutrition');
  if (!ok('nutritionPlan', 'nutritionCheckin')) { card.innerHTML = failed('Dinh dưỡng'); return; }
  const plan = val('nutritionPlan', null);
  if (!plan) {
    card.innerHTML = '<div class="cu-card-head"><h3>Dinh dưỡng</h3></div><p>David chưa giao kế hoạch dinh dưỡng cho bạn.</p>';
    return;
  }
  // Today's meals: the weekday's own when the plan is a week, the single day otherwise.
  const meals = mealsForDate(plan, today);
  const checkin = val('nutritionCheckin', null);
  const scoped = scopeNutritionData({ checkIns: checkin ? [{ id: today, ...checkin }] : [], plan }).checkIns[0] || null;
  // A meal logged with its real amounts was eaten too, even before the day's ticks are sent.
  const completed = new Set([
    ...(scoped?.completedMealIds || []),
    ...(Array.isArray(scoped?.mealLogs) ? scoped.mealLogs.map((log) => log?.mealId).filter(Boolean) : []),
  ]);
  const done = meals.filter((meal) => completed.has(meal.id)).length;
  const upcoming = meals.find((meal) => !completed.has(meal.id));
  const kcal = Number(plan.kcal) || 0;
  const protein = Number(plan.protein) || 0;
  const target = [kcal ? `${kcal.toLocaleString('vi-VN')} kcal` : '', protein ? `đạm ${protein} g` : ''].filter(Boolean).join(' · ');
  const status = !meals.length ? '' : upcoming
    ? ` · kế tiếp ${escapeHtml(mealShortName(upcoming.name).toLowerCase())}${upcoming.time ? ` ${escapeHtml(upcoming.time)}` : ''}`
    : ' · đủ bữa hôm nay';
  const boxes = meals.map((meal) => {
    const eaten = completed.has(meal.id);
    return `<li class="cu-meal${eaten ? ' done' : ''}"><span class="cu-tick" aria-hidden="true">${eaten ? CHECK : ''}</span>
      <span><b>${escapeHtml(mealShortName(meal.name))}</b><small>${escapeHtml(meal.time || '')}</small><span class="cu-visually-hidden">${eaten ? ', đã theo' : ', chưa ghi'}</span></span></li>`;
  }).join('');
  card.innerHTML = `<div class="cu-card-head"><h3>Dinh dưỡng</h3><span class="cu-meta">${escapeHtml(target)}</span></div>
    <div class="cu-big"><strong>${done}/${meals.length}</strong><span>bữa đã theo${status}</span></div>
    ${boxes ? `<ul class="cu-meals" aria-label="Các bữa hôm nay">${boxes}</ul>` : ''}
    <a class="cu-link" href="nutrition.html">Mở dinh dưỡng →</a>`;
}

// ---------- thẻ: tuần này ----------
function renderWeek() {
  const card = $('card-week');
  if (!ok('sessions', 'assignments', 'profile')) { card.innerHTML = failed('Tuần này'); return; }
  const sessions = val('sessions', []);
  const overview = buildProgramOverview({ assignments: val('assignments', []), phase: val('phase', null), hiddenDays: hiddenDays() });
  const count = sessionsThisWeek(sessions, todayIso());
  const target = Math.round(overview.weeklyTarget * 10) / 10;
  const active = weeksActive(sessions);
  const dots = weekPunch(sessions, todayIso()).map((day) => `<li class="${[day.trained ? 'trained' : '', day.today ? 'today' : ''].join(' ').trim()}">
      <div class="d">${day.label}</div><div class="dot">${day.trained ? CHECK : ''}</div>${day.today ? '<small>Hôm nay</small>' : ''}
      <span class="cu-visually-hidden">${day.trained ? 'đã tập' : day.future ? '' : 'chưa tập'}</span></li>`).join('');
  const left = target ? Math.max(0, Math.ceil(target - count)) : null;
  const message = !sessions.length
    ? 'Buổi tập đầu tiên của bạn sẽ hiện ở đây.'
    : `${left === null ? '' : left === 0 ? `Đã đủ ${kg(target)} buổi tuần này. ` : `Còn ${left} buổi để đủ tuần. `}Bạn tập đều <strong>${active}/4</strong> tuần gần đây.`;
  card.innerHTML = `<div class="cu-card-head"><h3>Tuần này</h3><span class="cu-count">${count}<small>${target ? ` / ${kg(target)} buổi` : ' buổi'}</small></span></div>
    <ol class="cu-punch" aria-label="Các ngày trong tuần">${dots}</ol>
    <p>${message}</p>`;
}

// ---------- thẻ: cân nặng và kỷ lục ----------
function sparkline(series) {
  const W = 300; const H = 60; const pad = 6;
  const weights = series.map((point) => point.weight);
  const min = Math.min(...weights); const max = Math.max(...weights);
  const span = Math.max(max - min, 0.4);
  const x = (index) => pad + index * (W - pad * 2) / (series.length - 1);
  const y = (weight) => Math.round(((H - 8) - ((weight - min) / span) * (H - 18)) * 10) / 10;
  const points = series.map((point, index) => `${Math.round(x(index) * 10) / 10},${y(point.weight)}`).join(' ');
  const last = series[series.length - 1];
  return `<svg class="cu-spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(`Cân nặng ${series.length} lần gần nhất, từ ${kg(series[0].weight)} đến ${kg(last.weight)} kg`)}">
    <line x1="0" y1="${H - 4}" x2="${W}" y2="${H - 4}" stroke="#d3d9e3" stroke-width="1"></line>
    <polyline points="${points}" fill="none" stroke="#14213d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <circle cx="${W - pad}" cy="${y(last.weight)}" r="5" fill="#dd7a3b"></circle>
  </svg>`;
}

function renderProgress() {
  const card = $('card-progress');
  const parts = [];
  let chartNote = '';
  if (ok('weights')) {
    const trend = weightTrend(val('weights', []), todayIso());
    const series = weightSeries(val('weights', []), todayIso());
    if (!trend.latest) parts.push('<p>Chưa có số cân. Cân đều từ 4 lần mỗi tuần để thấy xu hướng.</p>');
    else {
      const when = trend.latest.day === todayIso() ? 'sáng nay' : shortDay(trend.latest.day);
      let trendText = 'Cân đều từ 4 lần mỗi tuần để thấy xu hướng.';
      if (trend.enough) {
        const sign = trend.delta > 0 ? '+' : trend.delta < 0 ? '−' : '';
        trendText = `Trung bình tuần <strong>${kg(Math.round(trend.thisWeek.avg * 10) / 10)} kg</strong> (${sign}${kg(Math.abs(trend.delta))} so với tuần trước).`;
      }
      parts.push(`<div class="cu-big"><strong>${kg(trend.latest.weight)}</strong><span>kg · ${when}</span></div>`);
      if (series.length >= 2) { parts.push(sparkline(series)); chartNote = '<span class="cu-meta">14 ngày</span>'; }
      parts.push(`<p>${trendText}</p>`);
    }
  }
  if (ok('sessions')) {
    const record = latestRecord(val('sessions', []), (id) => getExerciseById(id)?.nameVi || id, todayIso());
    if (record) {
      parts.push(`<div class="cu-pr"><div><div class="label">Kỷ lục mới · ${shortDay(record.day)}</div><div class="lift">${escapeHtml(record.name)}</div></div>
        <div class="jump"><span>${kg(record.from)} →</span> ${kg(record.to)} kg</div></div>`);
    }
  }
  if (!ok('weights') && !ok('sessions')) { card.innerHTML = failed('Cân nặng'); return; }
  card.innerHTML = `<div class="cu-card-head"><h3>Cân nặng</h3>${chartNote}</div>${parts.join('')}
    <a class="cu-link" href="progress-photos.html">Mở tiến trình →</a>`;
}

function renderPhoto() {
  const host = $('card-photo');
  if (!ok('photos')) { host.innerHTML = ''; return; }
  const reminder = photoReminder(val('photos', []), todayIso());
  const text = reminder.first ? 'Chưa có ảnh tiến trình. Chụp ảnh đầu tiên để so sánh về sau.'
    : reminder.due ? `<strong>${reminder.daysSince} ngày</strong> chưa chụp ảnh tiến trình` : '';
  host.innerHTML = text ? `<a class="cu-row-link" href="progress-photos.html">${CAMERA}<span>${text}</span><b>Chụp</b></a>` : '';
}

// ---------- lưu ý của David ----------
function renderNote() {
  const notes = ok('nutritionPlan') ? String(val('nutritionPlan', null)?.notes || '').trim() : '';
  $('card-note-host').innerHTML = notes
    ? `<section class="cu-card cu-note" aria-labelledby="coach-note-title"><div class="cu-card-head"><h3 id="coach-note-title">Lưu ý của David</h3></div><p>${escapeHtml(notes)}</p></section>` : '';
}

function renderIdentity() {
  const identity = ok('habitPlan') ? val('habitPlan', { identity: '' }).identity : '';
  $('home-identity').innerHTML = identity
    ? `<p class="cu-identity">Tôi là kiểu người <strong>${escapeHtml(identity)}</strong></p>` : '';
}

function renderAll() {
  $('student-name').textContent = val('profile', null)?.displayName || '';
  $('today-label').textContent = dayName(todayIso());
  renderIdentity(); renderTraining(); renderHabits(); renderNutrition(); renderWeek(); renderProgress(); renderPhoto(); renderNote();
}

async function load() {
  today = habitToday();
  const iso = todayIso();
  const reads = {
    profile: () => getStudent(uid),
    phase: () => getActivePhase(uid),
    assignments: () => getActivePhaseAssignments(uid),
    sessions: () => listSessionHistory(uid, { max: 60 }),
    habitPlan: () => getHabitPlan(uid),
    habitLogs: () => listHabitLogs(uid, { days: 14 }),
    nutritionPlan: () => getNutritionPlan(uid),
    nutritionCheckin: () => getNutritionCheckin(uid, iso),
    weights: () => listBodyWeightLogs(uid, { max: 30 }),
    photos: () => listProgressPhotos(uid),
  };
  // One failing read must not blank the page: each card reports for itself.
  const settled = await Promise.allSettled(KEYS.map((key) => reads[key]()));
  settled.forEach((result, index) => {
    const key = KEYS[index];
    if (result.status === 'fulfilled') data[key] = { ok: true, value: result.value };
    else { console.error(`home: ${key} failed`, result.reason); data[key] = { ok: false }; }
  });
  renderAll();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['student']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'student') { $('boot-status').textContent = 'Tài khoản chưa được thiết lập cho học viên.'; return; }
    uid = user.uid;
    mountAppShell({ role: 'student', active: 'home' });
    await load();
    $('boot-status').style.display = 'none';
    $('app-content').style.display = 'block';
  } catch (error) {
    console.error('home load failed:', error);
    $('boot-status').textContent = 'Chưa tải được trang chủ lúc này. Kiểm tra kết nối rồi thử lại.';
  }
});

// A tab left open overnight would otherwise keep ticking yesterday's habits as today's.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && uid && habitToday() !== today) void load();
});

$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });
</script>
</body>
</html>
