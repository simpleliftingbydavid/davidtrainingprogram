name: David Coaching quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Test-only packages. @firebase/rules-unit-testing@4 needs firebase@11 as a
      # peer, so firebase@10 here fails with ERESOLVE. The app itself still loads
      # firebase 10.13.2 from the CDN; these packages only drive the emulator tests.
      - name: Install test-only Firebase tools
        run: npm install --no-save firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.16.0

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/review-alert-builder.js
          node --check functions/technical-issue-utils.js
          node --experimental-vm-modules tests/html-module-syntax.test.mjs
          node --experimental-vm-modules tests/engine-harness.test.mjs

      - name: Run deterministic application tests
        run: >-
          node --test
          tests/app-shell.test.mjs
          tests/coaching-decision.test.mjs
          tests/deload-review-engine.test.mjs
          tests/performance-optimization.test.mjs
          tests/programme-edit.test.mjs
          tests/progression-stage5.test.mjs
          tests/review-alert-builder.test.mjs
          tests/review-dashboard-utils.test.mjs
          tests/rir-calibration-engine.test.mjs
          tests/rir-calibration-integration.test.mjs
          tests/stage4-integration.test.mjs
          tests/stage5-autoregulation.test.mjs
          tests/stage5-integration.test.mjs
          tests/technique-progress.test.mjs
          tests/technical-inbox.test.mjs
          tests/technical-inbox-integration.test.mjs
          tests/technical-review-alert.test.mjs

      - name: Run Firestore Emulator tests
        run: >-
          npx firebase emulators:exec --only firestore --project demo-david-training-program
          "node tests/firestore-rules.test.mjs && node --test --test-force-exit --experimental-vm-modules tests/phase-template.test.mjs && node --experimental-vm-modules tests/session-save-emulator.test.mjs"

      - name: Confirm production is never deployed by CI
        run: test ! -f .github/workflows/deploy-production.yml
