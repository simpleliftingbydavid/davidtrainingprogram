function assertEqual(actual, expected, path = '') {
  if (typeof expected === 'object' && expected !== null) {
    for (const key of Object.keys(expected)) {
      const err = assertEqual(actual?.[key], expected[key], path ? `${path}.${key}` : key);
      if (err) return err;
    }
    return null;
  }
  if (actual !== expected) {
    return `mismatch at "${path}": expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`;
  }
  return null;
}

testCase('scheme8: complete cycle is technique -> set -> rep -> weight -> technique', () => {
  const done = (sets, reps) => Array.from({ length: sets }, (_, index) => ({ setIndex: index + 1, reps }));
  const step1 = { workingWeight: 50, currentSets: 3, currentReps: 8, progressionStep: 1, progressionCycle: 0, consecutiveMisses: 0 };
  const afterTechnique = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state: step1, lastLog: { actualSets: done(3, 8), techniqueConfirmed: true } });
  const afterSets = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state: afterTechnique.nextState, lastLog: { actualSets: done(4, 8) } });
  const afterReps = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state: afterSets.nextState, lastLog: { actualSets: done(4, 10) } });
  const afterWeight = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state: afterReps.nextState, lastLog: { actualSets: done(3, 8) } });
  return {
    input: ['Kỹ thuật', 'Tăng set', 'Tăng rep', 'Tăng tạ'],
    expected: {
      steps: [2, 3, 4, 1],
      prescriptions: ['50kg 4x8', '50kg 4x10', '55kg 3x8', '55kg 3x8'],
      cycle: 1,
    },
    actual: {
      steps: [afterTechnique.nextState.progressionStep, afterSets.nextState.progressionStep, afterReps.nextState.progressionStep, afterWeight.nextState.progressionStep],
      prescriptions: [afterTechnique, afterSets, afterReps, afterWeight].map((item) => `${item.nextPrescription.weight}kg ${item.nextPrescription.sets}x${item.nextPrescription.reps}`),
      cycle: afterWeight.nextState.progressionCycle,
    },
  };
});

testCase('auth sign-in: persistence resolves before credentials are submitted', async () => {

  const signingIn = signInAfterPersistence({

// ---------- Run ----------

const rowsEl = document.getElementById('rows');
let passCount = 0;

for (const [i, c] of cases.entries()) {
  let result, error, status;
  try {
    result = await c.fn();
    error = assertEqual(result.actual, result.expected);
    status = error ? 'fail' : 'pass';
  } catch (e) {
    status = 'fail';
    error = 'threw: ' + (e && e.message ? e.message : String(e));
    result = { input: {}, expected: {}, actual: null };
  }
  if (status === 'pass') passCount++;

  const tr = document.createElement('tr');
  tr.className = status;
  tr.innerHTML = `
    <td>${i + 1}</td>
    <td>${c.name}</td>
    <td><pre>${JSON.stringify(result.input, null, 0)}</pre></td>
    <td><pre>${JSON.stringify(result.expected, null, 0)}</pre></td>
    <td><pre>${JSON.stringify(result.actual, null, 0)}${error ? '\n\n' + error : ''}</pre></td>
    <td class="status">${status.toUpperCase()}</td>
  `;
  rowsEl.appendChild(tr);
}

const summary = `${passCount} / ${cases.length} passed`;
document.getElementById('summary').textContent = summary;
if (passCount === cases.length) {
  console.log('ENGINE_TESTS_OK ' + summary);
} else {
  console.error('ENGINE_TESTS_FAIL ' + summary);
}
