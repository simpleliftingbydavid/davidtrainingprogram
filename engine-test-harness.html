function assertEqual(actual, expected, path = '') {
  // Arrays are length-checked before their elements.
  //
  // Without this, the walk below only visits keys present in `expected`, so
  // `expected: []` visits nothing and the case passes no matter what `actual`
  // holds. Every "this list must come back empty" test — the shape most of the
  // integrity checks use — was therefore incapable of failing.
  if (Array.isArray(expected)) {
    if (!Array.isArray(actual)) {
      return `mismatch at "${path}": expected an array, got ${JSON.stringify(actual)}`;
    }
    if (actual.length !== expected.length) {
      return `mismatch at "${path}": expected ${expected.length} item(s), got ${actual.length} — ${JSON.stringify(actual)}`;
    }
  }
  if (typeof expected === 'object' && expected !== null) {
    for (const key of Object.keys(expected)) {
      const err = assertEqual(actual?.[key], expected[key], path ? `${path}.${key}` : key);
      if (err) return err;
    }
    return null;
  }
  if (actual !== expected) {
    return `mismatch at "${path}": expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`;
  }
  return null;
}

// ---------- Nutrition: gram-level plan generation ----------

// Deterministic RNG so a failure here is reproducible rather than a one-off
// unlucky draw from Math.random.
function seededRandom(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

const gramPlanScenarios = [
  { label: 'fat loss 60 kg', weightKg: 60, goalType: 'fat_loss', targets: { kcal: 1600, protein: 132, fat: 53, carbs: 141 } },
  { label: 'fat loss 70 kg', weightKg: 70, goalType: 'fat_loss', targets: { kcal: 1925, protein: 154, fat: 53, carbs: 207 } },
  { label: 'maintain 75 kg', weightKg: 75, goalType: 'maintain', targets: { kcal: 2600, protein: 150, fat: 72, carbs: 350 } },
  { label: 'gain 80 kg', weightKg: 80, goalType: 'gain', targets: { kcal: 3200, protein: 160, fat: 89, carbs: 480 } },
];

for (const scenario of gramPlanScenarios) {
  testCase(`nutrition plan: ${scenario.label} lands inside the accuracy and safety bounds`, () => {
    const result = buildGramMealPlan({ ...scenario, mealCount: 4, random: seededRandom(42) });
    if (!result.ok) {
      return { input: scenario.targets, expected: 'ok', actual: result.reason };
    }
    const t = result.totals;
    return {
      input: scenario.targets,
      expected: { kcalWithin7: true, proteinWithin5: true, fatAboveFloor: true, carbsAboveFloor: true },
      actual: {
        kcalWithin7: Math.abs(t.kcal - scenario.targets.kcal) / scenario.targets.kcal <= 0.07,
        proteinWithin5: Math.abs(t.protein - scenario.targets.protein) / scenario.targets.protein <= 0.05,
        fatAboveFloor: t.fat >= scenario.weightKg * 0.5,
        carbsAboveFloor: t.carbs >= scenario.weightKg * 1.0,
      },
    };
  });
}

  });

    ? result.meals.flatMap((m) => m.items.filter((i) => !(i.grams > 0)).map((i) => i.name))
    : ['plan failed to generate'];

});

testCase('nutrition plan: no food is served twice in the same day', () => {
  // Regression guard. Meals used to draw from their pools independently, so a
  // 5-6 meal day would serve milk + guava + cashews at two different snacks.

  const runs = [

  ];
  const offenders = [];

      if (result.ok && result.repeatedFoods > 0) offenders.push(`${run.mealCount} bữa seed ${seed}`);

  const over = dishesThatFit(500).filter((dish) => dish.kcalHigh > 500).map((dish) => dish.name);
  return { input: '500 kcal remaining', expected: [], actual: over };
});

// ---------- Personalised food selection ----------
// The generator must build the day from what the client actually eats, and
// must never serve a food they are avoiding. Preference is soft and degrades
// with a report; avoidance is hard and fails loudly instead of degrading.

const HABITS = {
  preferred: [
    'Ức gà bỏ da (sống)', 'Thịt bò thăn', 'Trứng gà nguyên quả',
    'Cơm trắng (chín)', 'Chuối', 'Bánh mì trắng',
    'Bơ đậu phộng', 'Đậu phộng rang', 'Dầu ăn (oliu, đậu nành)',
  ],
  avoided: ['Tôm bỏ vỏ', 'Mực tươi', 'Sữa tươi không đường'],
};
const HABIT_TARGETS = { kcal: 2600, protein: 150, carbs: 320, fat: 75 };

function habitPlans(count, overrides = {}) {
  const plans = [];
  for (let index = 0; index < count; index++) {
    plans.push(buildGramMealPlan({
      targets: HABIT_TARGETS, weightKg: 70, mealCount: 4, goalType: 'maintain',
      preferredFoods: HABITS.preferred, avoidedFoods: HABITS.avoided, ...overrides,
    }));
  }
  return plans;
}

function namesIn(plan) {
  return plan.meals.flatMap((meal) => meal.items.map((item) => item.name));
}

testCase('food preference: an avoided food never reaches the plate across 200 plans', () => {
  const offenders = new Set();
  for (const plan of habitPlans(200)) {
    if (!plan.ok) { offenders.add('KHÔNG TẠO ĐƯỢC'); continue; }
    for (const name of namesIn(plan)) if (HABITS.avoided.includes(name)) offenders.add(name);
  }
  return { input: HABITS.avoided, expected: [], actual: [...offenders] };
});

testCase('food preference: 200 plans use only the foods the client actually eats', () => {
  const strays = new Set();
  for (const plan of habitPlans(200)) {
    if (!plan.ok) { strays.add('KHÔNG TẠO ĐƯỢC'); continue; }
    for (const meal of plan.meals) {
      for (const item of meal.items) {
        // Vegetables stay unconstrained: the coach ticked no vegetable, which
        // says nothing about vegetables.
        if (item.group !== 'RAU' && !HABITS.preferred.includes(item.name)) strays.add(item.name);
      }
    }
  }
  return { input: HABITS.preferred.length, expected: [], actual: [...strays] };
});

});

testCase('meal accuracy: the four limits do not contradict each other', () => {
  // The macro tolerances imply a calorie tolerance of their own. If that implied
  // figure exceeds the calorie limit, a day can satisfy every macro limit and
  // still be rejected on calories — which is precisely what happened when the
  // set was 1% / 1% / 2 g / 2 g, and why generation failed most of the time.
  // Pure arithmetic, so this catches the mistake without depending on a draw.
  const targets = { kcal: 2600, protein: 150, carbs: 320, fat: 75 };
  const impliedKcal = MEAL_ACCURACY_LIMITS.fatG * 9
    + MEAL_ACCURACY_LIMITS.carbsG * 4
    + targets.protein * MEAL_ACCURACY_LIMITS.proteinRatio * 4;
  const allowedKcal = targets.kcal * MEAL_ACCURACY_LIMITS.kcalRatio;
  return {
    input: { impliedKcal: Math.round(impliedKcal), allowedKcal: Math.round(allowedKcal) },
    expected: true,
    actual: allowedKcal >= impliedKcal,
  };
});

testCase('meal accuracy: the generator can actually meet its own limits', () => {
  // Guards the limits against being tightened past what the solver can reach.
  // The hardest combination measured (3,800 kcal over 4 meals) succeeds 400 out
  // of 400 times at the current limits, so a clean sweep here is expected; any
  // failure means the limits moved beyond the method again.
  const cases = [
    { targets: { kcal: 1500, protein: 130, carbs: 130, fat: 45 }, weightKg: 55, mealCount: 5 },
    { targets: { kcal: 2600, protein: 150, carbs: 320, fat: 75 }, weightKg: 70, mealCount: 5 },
    { targets: { kcal: 3800, protein: 190, carbs: 510, fat: 105 }, weightKg: 90, mealCount: 4 },
  ];
  const failures = cases
    .flatMap((setup) => Array.from({ length: 6 }, () => buildGramMealPlan({ ...setup, goalType: 'maintain' })))
    .filter((plan) => !plan.ok)
    .map((plan) => plan.reason);
  return { input: '18 kế hoạch trên 3 mục tiêu', expected: [], actual: failures };
});

testCase('food preference: an empty picker constrains nothing', () => {
  // Deliberately asserts the constraint state, not that a plan came out.
  // buildGramMealPlan searches at random, so tying this case to plan.ok made it
  // pass or fail with the draw — it went green in the browser and red in the
  // node runner on the very same code. What this case is actually about is that
  // ticking nothing leaves every pool at full size.
  const resolved = resolvePools({});
  const pools = Object.entries(resolved.pools).flatMap(([mealType, pool]) =>
    Object.entries(pool).map(([letter, list]) => list.length === MEAL_POOLS[mealType][letter].length));
  return {
    input: 'no lists',
    expected: { constrained: 0, widened: 0, blocked: 0, everyPoolFullSize: true },
    actual: {
      constrained: resolved.constrainedGroups.length,
      widened: resolved.widened.length,
      blocked: resolved.blocked.length,
      everyPoolFullSize: pools.every(Boolean),
    },
  };
});

// ---------- Food table integrity ----------
// The safety net for adding foods later. Every check here corresponds to a
// mistake that is otherwise silent: the food simply never appears, or appears
// with numbers that quietly skew every plan built from it.

function everyPoolOption() {
  const rows = [];
  for (const [mealType, pool] of Object.entries(MEAL_POOLS)) {
    for (const [letter, list] of Object.entries(pool)) {
      for (const option of list) rows.push({ mealType, letter, ...option });
    }
  }
  return rows;
}

  const duplicates = [...new Set(names.filter((name, index) => names.indexOf(name) !== index))];
  // getFood() is a Map lookup, so a duplicate name silently wins and the
  // earlier food's macros become unreachable.
  return { input: names.length, expected: [], actual: duplicates };
});

testCase('food table: every food offered to the generator has macros', () => {

  // A name in MEAL_POOLS with no matching entry in FOODS crashes plan
  // generation the first time that option is drawn.
  return { input: everyPoolOption().length, expected: [], actual: missing };
});

  // Listing a carb under P makes the solver treat it as the meal's protein

testCase('food table: stated calories match the macros they are built from', () => {
  // Atwater, discounting fibre: fibre is counted inside `carb` but yields
  // roughly 2 kcal/g rather than 4. Without that correction every leafy
  // vegetable looks wrong.
  //
  // Flagged only when the gap is both proportionally large AND worth more
  // than 15 kcal per 100 g, so cucumber being 2 kcal out does not fail while
  // a mistyped rice or oil figure — the ones that actually move a day's
  // total — does.
  const suspect = FOODS.map((food) => {
    const estimate = (food.carb - food.fiber) * 4 + food.fiber * 2 + food.protein * 4 + food.fat * 9;
    const gap = estimate - food.kcal;
    return { name: food.name, stated: food.kcal, fromMacros: Math.round(estimate), gap: Math.round(gap) };
  }).filter((row) => Math.abs(row.gap) > 15 && Math.abs(row.gap) / Math.max(row.stated, 1) > 0.12);
  return { input: FOODS.length, expected: [], actual: suspect };
});

// ---------- Dish library integrity ----------
// Same principle as the food-table checks above: every case here is a mistake
// that is otherwise silent. A dish with a mistyped ingredient does not throw
// when the file loads — it throws the first time the generator happens to draw
// it, which may be weeks later and in front of a client.

function everyDishIngredient() {
  const rows = [];
  for (const item of DISHES) {
    for (const [slot, group] of [['proteinOptions', 'PROTEIN'], ['carbOptions', 'CARB'], ['fatOptions', 'FAT'], ['vegetables', 'RAU']]) {

  return rows;
}

// ---------- Dish-mode generation ----------

function dishRng(seed) {
  let state = seed;
  return () => { state = (state * 1103515245 + 12345) % 2147483648; return state / 2147483648; };
}

const DISH_TARGETS = { kcal: 1650, protein: 130, carbs: 165, fat: 48 };

function dishPlan(overrides = {}, seed = 2026) {
  return buildGramMealPlan({
    targets: DISH_TARGETS, weightKg: 62, mealCount: 4, goalType: 'cut',
    composition: 'dish', random: dishRng(seed), ...overrides,
  });
}

  ]) {

      for (const seed of [11, 4242]) {
        const result = buildGramMealPlan({
          targets: { kcal, protein, carbs, fat }, weightKg, mealCount, goalType,
          composition: 'dish', random: dishRng(seed),
        });
        if (!result.ok) failures.push(`${kcal} kcal · ${mealCount} bữa · seed ${seed}: ${result.reason}`);
      }

testCase('dish mode: every meal names a dish and serves only that dish ingredients', () => {
  const result = dishPlan();
  const problems = [];
  for (const meal of result.meals) {
    const source = getDish(meal.dish?.id);
    if (!source) { problems.push(`${meal.name}: không có món`); continue; }
    const allowed = new Set([
      ...source.proteinOptions, ...source.carbOptions, ...source.fatOptions, ...source.vegetables,
    ].map((option) => option.name));
    for (const item of meal.items) {
      if (!allowed.has(item.name)) problems.push(`${source.id}: ${item.name} không thuộc món này`);
    }
    // Every vegetable belongs to the dish, so all of them must be on the plate.
    for (const vegetable of source.vegetables) {
      if (!meal.items.some((item) => item.name === vegetable.name)) {
        problems.push(`${source.id}: thiếu ${vegetable.name}`);
      }
    }
  }
  return { input: result.meals.length, expected: [], actual: problems };
});

  // carry its slot is still listed in the coach's picker, still looks like an
  // option, and simply never gets served — the plan quietly uses something
  // else. "Cơm + ba chỉ rang" was exactly this and was removed: pork belly
  // tops out near 13 g of protein, against the ~39 g a main meal needs.
  //
  // Each dish is forced by offering it alongside ONLY dishes that cannot serve
  // its slot, so its slot has one candidate and the day really is built on it.
  // Held to 150 attempts to stay near a second; measured over twelve seeds
  // with zero failures before being fixed at one, because a flaky green test
  // teaches you to re-run rather than to look.
  const targets = { kcal: 1650, protein: 130, carbs: 165, fat: 48 };
  const unusable = [];
  for (const dish of DISHES) {
    const others = DISHES.filter((item) => item.mealTypes.every((type) => !dish.mealTypes.includes(type))).map((item) => item.id);
    const result = buildGramMealPlan({
      targets, weightKg: 62, mealCount: 4, goalType: 'cut', composition: 'dish',
      preferredDishes: [dish.id, ...others], random: dishRng(314), attemptsPerMealCount: 150,
    });
    if (!(result.ok && result.meals.some((meal) => meal.dish.id === dish.id))) unusable.push(dish.id);
  }
  return { input: DISHES.length, expected: [], actual: unusable };
});

testCase('dish mode: a ticked ingredient list that cannot cover snacks says which group is missing', () => {
  // The trap this reports: ticking cơm and bánh mì constrains the whole CARB
  // group, and every snack dish's carb is fruit — so a list that looks complete
  // silently cannot cover bữa phụ. Naming the group is the difference between
  // "something went wrong" and one obvious thing to tick.
  const result = dishPlan({
    preferredFoods: [
      'Ức gà bỏ da (sống)', 'Thịt bò thăn', 'Trứng gà nguyên quả', 'Cá basa fillet',
      'Cơm trắng (chín)', 'Bún tươi', 'Bánh mì trắng', 'Khoai lang (luộc)',
    ],
  }, 808);
  const snack = result.widenedDishSlots.find((entry) => entry.mealType === 'phu');
  const { messages } = describePoolFallbacks(result);
  return {
    input: 'thói quen chỉ gồm món mặn và tinh bột chính',
    expected: { ok: true, snackWidened: true, namesCarb: true, messageNamesGroup: true },
    actual: {
      ok: result.ok,
      snackWidened: Boolean(snack),
      namesCarb: Boolean(snack) && snack.missingGroups.includes('CARB'),
      messageNamesGroup: messages.some((line) => line.includes('bữa phụ') && line.includes('Tinh bột')),
    },
  };
});

testCase('dish mode: regenerating never hands back the same day', () => {
  const first = dishPlan({}, 314);
  const second = dishPlan({ avoidSignature: first.signature }, 314);
  return {
    input: first.signature.slice(0, 40),
    expected: { bothOk: true, different: true },
    actual: { bothOk: first.ok && second.ok, different: first.signature !== second.signature },
  };
});


// ---------- Run ----------

const rowsEl = document.getElementById('rows');
let passCount = 0;

for (const [i, c] of cases.entries()) {
  let result, error, status;
  try {
    result = await c.fn();
    error = assertEqual(result.actual, result.expected);
    status = error ? 'fail' : 'pass';
  } catch (e) {
    status = 'fail';
    error = 'threw: ' + (e && e.message ? e.message : String(e));
    result = { input: {}, expected: {}, actual: null };
  }
  if (status === 'pass') passCount++;

  const tr = document.createElement('tr');
  tr.className = status;
  tr.innerHTML = `
    <td>${i + 1}</td>
    <td>${c.name}</td>
    <td><pre>${JSON.stringify(result.input, null, 0)}</pre></td>
    <td><pre>${JSON.stringify(result.expected, null, 0)}</pre></td>
    <td><pre>${JSON.stringify(result.actual, null, 0)}${error ? '\n\n' + error : ''}</pre></td>
    <td class="status">${status.toUpperCase()}</td>
  `;
  rowsEl.appendChild(tr);
}

const summary = `${passCount} / ${cases.length} passed`;
document.getElementById('summary').textContent = summary;
if (passCount === cases.length) {
  console.log('ENGINE_TESTS_OK ' + summary);
} else {
  console.error('ENGINE_TESTS_FAIL ' + summary);
}
</script>
