<script type="module">
import {
  SCHEME,
  roundToIncrement,
  getInitialPrescription,
  calculateNextPrescription,
  classifyOutcome,
} from './progression-engine.js';
import { buildCompletedExerciseEntries, buildSkippedExerciseEntries } from './session-entry-utils.js';
import {
  clampSessionSetCount,
  createInitialExtraState,
  advanceSessionExercise,
  isDuplicateSessionExercise,
  cancelWorkoutSession,
  latestCompletedSetIndex,
  normalizeRestSeconds,
  restCycleState,
  undoLatestCompletedSet,
} from './workout-session-utils.js';
import {
  AUTH_PERSISTENCE_MODE,
  roleDestination,
  redirectForUnexpectedRole,
  signInAfterPersistence,
} from './auth-session-utils.js';
import { assignmentsForCurrentPeriod, nextPhaseOrder, resolvePeriodization } from './periodization-utils.js';
import { latestPerformanceByExercise, performedExerciseId, performanceForExercise, previousSetForIndex } from './previous-performance-utils.js';
import { buildDraftAssignmentsFromSelections, buildPhaseActivationPlan, buildPhaseSourceOptions, draftActivationIssues } from './phase-draft-utils.js';

function assertEqual(actual, expected, path = '') {
  if (typeof expected === 'object' && expected !== null) {
    for (const key of Object.keys(expected)) {
      const err = assertEqual(actual?.[key], expected[key], path ? `${path}.${key}` : key);
      if (err) return err;
    }
    return null;
  }
  if (actual !== expected) {
    return `mismatch at "${path}": expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`;
  }
  return null;
}

const scheme2Params = {
  intensityPct: 87.5,
  repsPerSet: 3,
  plannedSets: 3,
  targetRIR: 0,
  roundingIncrement: 2.5,
  isBodyweight: false,
};

const scheme8Params = {
  startingSets: 3,
  endingSets: 5,
  startingReps: 8,
  endingReps: 12,
  setIncreaseStep: 1,
  repIncreaseStep: 2,
  weightIncreasePct: 10,
  roundingIncrement: 5,
  isBodyweight: false,
};

const cases = [];

function testCase(name, fn) {
  cases.push({ name, fn });
}

// ---------- Scheme 2 (Last-set RIR) ----------

testCase('scheme2: initial prescription from TM=150', () => {
  const state = { trainingMax: 150, workingWeight: null, consecutiveMisses: 0 };
  const rx = getInitialPrescription({ scheme: SCHEME.LAST_SET_RIR, schemeParams: scheme2Params, state });
  // 150 * 87.5% = 131.25, rounded to nearest 2.5 -> 132.5
  return {
    input: { trainingMax: 150 },
    expected: { weight: 132.5, sets: 3, reps: 3, targetRIR: 0 },
    actual: rx,
  };
});

testCase('scheme2: exact hit (3 sets, last RIR = target) -> hold (0%)', () => {
  const state = { trainingMax: 150, workingWeight: 132.5, consecutiveMisses: 0 };
  const lastLog = { actualSets: [{ setIndex: 1, reps: 3, rir: 0 }, { setIndex: 2, reps: 3, rir: 0 }, { setIndex: 3, reps: 3, rir: 0 }] };
  const out = calculateNextPrescription({ scheme: SCHEME.LAST_SET_RIR, schemeParams: scheme2Params, state, lastLog });
  return {
    input: { trainingMax: 150, lastSetRIR: 0, setsCompleted: 3 },
    expected: { resultBucket: 'Set target completed; last at RIR target', nextState: { trainingMax: 150 }, nextPrescription: { weight: 132.5 } },
    actual: out,
  };
});

testCase('scheme2: beat by 2 RIR -> +3% TM', () => {
  const state = { trainingMax: 150, workingWeight: 130, consecutiveMisses: 0 };
  const lastLog = { actualSets: [{ setIndex: 1, reps: 3, rir: 2 }, { setIndex: 2, reps: 3, rir: 2 }, { setIndex: 3, reps: 3, rir: 2 }] };
  const out = calculateNextPrescription({ scheme: SCHEME.LAST_SET_RIR, schemeParams: scheme2Params, state, lastLog });
  const expectedTM = 150 * 1.03;
  return {
    input: { trainingMax: 150, lastSetRIR: 2, setsCompleted: 3 },
    expected: {
      resultBucket: '2 above RIR target',
      nextState: { trainingMax: expectedTM, workingWeight: roundToIncrement(expectedTM * 0.875, 2.5) },
    },
    actual: out,
  };
});

testCase('scheme2: beat by 5+ RIR -> capped at +5% TM', () => {
  const state = { trainingMax: 150, workingWeight: 130, consecutiveMisses: 0 };
  const lastLog = { actualSets: [{ setIndex: 1, reps: 3, rir: 6 }, { setIndex: 2, reps: 3, rir: 6 }, { setIndex: 3, reps: 3, rir: 6 }] };
  const out = calculateNextPrescription({ scheme: SCHEME.LAST_SET_RIR, schemeParams: scheme2Params, state, lastLog });
  const expectedTM = 150 * 1.05;
  return {
    input: { trainingMax: 150, lastSetRIR: 6, setsCompleted: 3 },
    expected: { resultBucket: '3+ above RIR target', nextState: { trainingMax: expectedTM } },
    actual: out,
  };
});

testCase('scheme2: missed 1 set -> -2% TM', () => {
  const state = { trainingMax: 150, workingWeight: 130, consecutiveMisses: 0 };
  const lastLog = { actualSets: [{ setIndex: 1, reps: 3, rir: 0 }, { setIndex: 2, reps: 3, rir: 0 }] }; // only 2 of 3 sets
  const out = calculateNextPrescription({ scheme: SCHEME.LAST_SET_RIR, schemeParams: scheme2Params, state, lastLog });
  const expectedTM = 150 * 0.98;
  return {
    input: { trainingMax: 150, setsCompleted: 2, plannedSets: 3 },
    expected: { resultBucket: '1 fewer set completed or last set below RIR target', nextState: { trainingMax: expectedTM, consecutiveMisses: 1 } },
    actual: out,
  };
});

testCase('scheme2: missed 2+ sets -> -5% TM', () => {
  const state = { trainingMax: 150, workingWeight: 130, consecutiveMisses: 0 };
  const lastLog = { actualSets: [{ setIndex: 1, reps: 3, rir: 0 }] }; // only 1 of 3 sets
  const out = calculateNextPrescription({ scheme: SCHEME.LAST_SET_RIR, schemeParams: scheme2Params, state, lastLog });
  const expectedTM = 150 * 0.95;
  return {
    input: { trainingMax: 150, setsCompleted: 1, plannedSets: 3 },
    expected: { resultBucket: '2+ fewer sets completed', nextState: { trainingMax: expectedTM } },
    actual: out,
  };
});

// ---------- Scheme 8 (Set increase then rep increase) ----------

testCase('scheme8: initial prescription at bottom of range', () => {
  const state = { workingWeight: 20, currentSets: 3, currentReps: 8, consecutiveMisses: 0 };
  const rx = getInitialPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state });
  return {
    input: { workingWeight: 20, currentSets: 3, currentReps: 8 },
    expected: { weight: 20, sets: 3, reps: 8 },
    actual: rx,
  };
});

testCase('scheme8: hit all 3 sets x 8 reps -> add a set (3 -> 4)', () => {
  const state = { workingWeight: 20, currentSets: 3, currentReps: 8, consecutiveMisses: 0 };
  const lastLog = { actualSets: [{ setIndex: 1, reps: 8 }, { setIndex: 2, reps: 8 }, { setIndex: 3, reps: 8 }] };
  const out = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state, lastLog });
  return {
    input: { currentSets: 3, endingSets: 5 },
    expected: { resultBucket: 'hit target — adding a set', nextState: { currentSets: 4, currentReps: 8, workingWeight: 20 } },
    actual: out,
  };
});

testCase('scheme8: missed target reps -> hold, track consecutiveMisses', () => {
  const state = { workingWeight: 20, currentSets: 3, currentReps: 8, consecutiveMisses: 0 };
  const lastLog = { actualSets: [{ setIndex: 1, reps: 8 }, { setIndex: 2, reps: 7 }, { setIndex: 3, reps: 6 }] };
  const out = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state, lastLog });
  return {
    input: { currentReps: 8, actualReps: [8, 7, 6] },
    expected: { resultBucket: 'missed target reps', nextState: { currentSets: 3, currentReps: 8, workingWeight: 20, consecutiveMisses: 1 } },
    actual: out,
  };
});

testCase('scheme8: sets already at ending (5) and hit target -> add reps (8 -> 10)', () => {
  const state = { workingWeight: 20, currentSets: 5, currentReps: 8, consecutiveMisses: 0 };
  const lastLog = { actualSets: Array.from({ length: 5 }, (_, i) => ({ setIndex: i + 1, reps: 8 })) };
  const out = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state, lastLog });
  return {
    input: { currentSets: 5, currentReps: 8, endingSets: 5, endingReps: 12 },
    expected: { resultBucket: 'hit target — adding reps', nextState: { currentSets: 5, currentReps: 10, workingWeight: 20 } },
    actual: out,
  };
});

testCase('scheme8: full cycle boundary — sets+reps both topped out -> weight +10%, reset to 3x8', () => {
  // Start at 50 (not 20) so the +10% bump is visible after rounding: 50*1.1=55, round to nearest 5 -> 55.
  const state = { workingWeight: 50, currentSets: 5, currentReps: 12, consecutiveMisses: 0 };
  const lastLog = { actualSets: Array.from({ length: 5 }, (_, i) => ({ setIndex: i + 1, reps: 12 })) };
  const out = calculateNextPrescription({ scheme: SCHEME.SET_THEN_REP_INCREASE, schemeParams: scheme8Params, state, lastLog });
  return {
    input: { currentSets: 5, currentReps: 12, endingSets: 5, endingReps: 12, weightIncreasePct: 10, workingWeight: 50 },
    expected: {
      resultBucket: 'hit target — cycle complete, weight increased',
      nextState: { currentSets: 3, currentReps: 8, workingWeight: 55 },
      nextPrescription: { weight: 55, sets: 3, reps: 8 },
    },
    actual: out,
  };
});

// ---------- classifyOutcome ----------

testCase('classifyOutcome: scheme2 positive pctAdj -> up', () => {
  return { input: { scheme: 2, pctAdj: 3 }, expected: 'up', actual: classifyOutcome(SCHEME.LAST_SET_RIR, { pctAdj: 3 }) };
});
testCase('classifyOutcome: scheme2 zero pctAdj -> hold', () => {
  return { input: { scheme: 2, pctAdj: 0 }, expected: 'hold', actual: classifyOutcome(SCHEME.LAST_SET_RIR, { pctAdj: 0 }) };
});
testCase('classifyOutcome: scheme2 negative pctAdj -> down', () => {
  return { input: { scheme: 2, pctAdj: -2 }, expected: 'down', actual: classifyOutcome(SCHEME.LAST_SET_RIR, { pctAdj: -2 }) };
});
testCase('classifyOutcome: scheme8 hold action -> down (a miss)', () => {
  return { input: { scheme: 8, action: 'hold' }, expected: 'down', actual: classifyOutcome(SCHEME.SET_THEN_REP_INCREASE, { action: 'hold' }) };
});
testCase('classifyOutcome: scheme8 add_set action -> up', () => {
  return { input: { scheme: 8, action: 'add_set' }, expected: 'up', actual: classifyOutcome(SCHEME.SET_THEN_REP_INCREASE, { action: 'add_set' }) };
});
testCase('classifyOutcome: scheme8 increase_weight action -> up', () => {
  return { input: { scheme: 8, action: 'increase_weight' }, expected: 'up', actual: classifyOutcome(SCHEME.SET_THEN_REP_INCREASE, { action: 'increase_weight' }) };
});

// ---------- Workout payload: only explicitly completed sets ----------

const payloadExercise = (assignmentId, completedFlags) => ({
  assignmentId,
  sets: completedFlags.map((completed, index) => ({
    setIndex: index + 1,
    weight: '40',
    reps: String(10 - index),
    rir: index === completedFlags.length - 1 ? '2' : '',
    completed,
  })),
});

testCase('session payload: all completed exercises and sets are included', () => {
  const actual = buildCompletedExerciseEntries([
    payloadExercise('assignment-a', [true, true]),
    payloadExercise('assignment-b', [true]),
  ]);
  return {
    input: { completed: ['assignment-a:2', 'assignment-b:1'] },
    expected: { length: 2, firstSets: 2, secondSets: 1 },
    actual: { length: actual.length, firstSets: actual[0]?.actualSets.length, secondSets: actual[1]?.actualSets.length },
  };
});

testCase('session payload: partial session includes only completed sets', () => {
  const actual = buildCompletedExerciseEntries([
    payloadExercise('assignment-a', [true, false, true]),
    payloadExercise('assignment-b', [false, false]),
  ]);
  return {
    input: { completed: ['assignment-a:set1', 'assignment-a:set3'] },
    expected: { assignmentIds: ['assignment-a'], setIndexes: [1, 3] },
    actual: { assignmentIds: actual.map((entry) => entry.assignmentId), setIndexes: actual[0]?.actualSets.map((set) => set.setIndex) },
  };
});

testCase('session payload: no completed sets produces no Firestore entries', () => {
  const actual = buildCompletedExerciseEntries([
    payloadExercise('assignment-a', [false, false]),
    payloadExercise('assignment-b', [false]),
  ]);
  return { input: { completed: [] }, expected: [], actual };
});

testCase('session payload: skipped exercise is omitted and cannot affect progression', () => {
  const actual = buildCompletedExerciseEntries([
    payloadExercise('trained-assignment', [true, true]),
    payloadExercise('skipped-assignment', [false, false, false]),
  ]);
  return {
    input: { skippedAssignmentId: 'skipped-assignment' },
    expected: false,
    actual: actual.some((entry) => entry.assignmentId === 'skipped-assignment'),
  };
});

testCase('session sets: temporary increase/decrease is clamped without changing the planned value', () => {
  const plannedSets = 3;
  const reduced = clampSessionSetCount(2, plannedSets);
  const increased = clampSessionSetCount(4, plannedSets);
  return {
    input: { plannedSets, reducedRequest: 2, increasedRequest: 4 },
    expected: { plannedSets: 3, reduced: 2, increased: 4 },
    actual: { plannedSets, reduced, increased },
  };
});

testCase('readiness adjustment: reduced scheme8 sets hold progression without a miss', () => {
  const state = { workingWeight: 40, currentSets: 4, currentReps: 10, consecutiveMisses: 0 };
  const out = advanceSessionExercise({
    scheme: SCHEME.SET_THEN_REP_INCREASE,
    schemeParams: scheme8Params,
    state,
    adjustedSetCount: 2,
    actualSets: [{ setIndex: 1, weight: 40, reps: 10 }, { setIndex: 2, weight: 40, reps: 10 }],
  });
  return {
    input: { plannedSets: 4, adjustedSetCount: 2 },
    expected: { progressionHeld: true, outcome: 'hold', nextState: state, adjustedSetCount: 2 },
    actual: out,
  };
});

testCase('readiness adjustment: reduced scheme2 sets preserve Training Max', () => {
  const state = { trainingMax: 150, workingWeight: 132.5, consecutiveMisses: 0 };
  const out = advanceSessionExercise({
    scheme: SCHEME.LAST_SET_RIR,
    schemeParams: scheme2Params,
    state,
    adjustedSetCount: 2,
    actualSets: [{ setIndex: 1, weight: 132.5, reps: 3, rir: 0 }, { setIndex: 2, weight: 132.5, reps: 3, rir: 0 }],
  });
  return {
    input: { trainingMax: 150, adjustedSetCount: 2 },
    expected: { progressionHeld: true, nextState: { trainingMax: 150, consecutiveMisses: 0 } },
    actual: out,
  };
});

testCase('readiness adjustment: missing the reduced target still uses normal miss handling', () => {
  const state = { trainingMax: 150, workingWeight: 132.5, consecutiveMisses: 0 };
  const out = advanceSessionExercise({
    scheme: SCHEME.LAST_SET_RIR,
    schemeParams: scheme2Params,
    state,
    adjustedSetCount: 2,
    actualSets: [{ setIndex: 1, weight: 132.5, reps: 3, rir: 0 }],
  });
  return {
    input: { plannedSets: 3, adjustedSetCount: 2, completedSets: 1 },
    expected: { progressionHeld: false, outcome: 'down' },
    actual: out,
  };
});

testCase('extra exercise: payload is loggable without creating an assignment id', () => {
  const actual = buildCompletedExerciseEntries([{
    source: 'extra', exerciseId: 'machine_rows', plannedSetCount: 3, adjustedSetCount: 3,
    sets: [{ setIndex: 1, weight: '35', reps: '8', rir: '0', completed: true }],
  }]);
  return {
    input: { source: 'extra', exerciseId: 'machine_rows' },
    expected: { length: 1, source: 'extra', assignmentId: null, exerciseId: 'machine_rows' },
    actual: { length: actual.length, source: actual[0]?.source, assignmentId: actual[0]?.assignmentId, exerciseId: actual[0]?.exerciseId },
  };
});

testCase('extra exercise: first performance creates a remembered next prescription', () => {
  const exercise = { defaultScheme: SCHEME.SET_THEN_REP_INCREASE, defaultParams: scheme8Params };
  const actualSets = Array.from({ length: 3 }, (_, index) => ({ setIndex: index + 1, weight: 30, reps: 8, rir: 0 }));
  const state = createInitialExtraState(exercise, actualSets);
  const out = advanceSessionExercise({
    scheme: exercise.defaultScheme, schemeParams: exercise.defaultParams, state, actualSets, adjustedSetCount: 3,
  });
  return {
    input: { firstWeight: 30, completed: '3x8' },
    expected: { state: { workingWeight: 30 }, nextPrescription: { weight: 30, sets: 4, reps: 8 } },
    actual: { state, nextPrescription: out.nextPrescription },
  };
});

testCase('extra exercise: duplicate detection blocks assigned, swapped, or already-added exercises', () => {
  const ids = ['bench_press', 'machine_rows', 'bayesian_curls'];
  return {
    input: { ids },
    expected: { existing: true, newExercise: false },
    actual: {
      existing: isDuplicateSessionExercise('machine_rows', ids),
      newExercise: isDuplicateSessionExercise('hip_abduction', ids),
    },
  };
});

testCase('periodization: legacy assignments remain visible before the first cycle is created', () => {
  const assignments = [{ id: 'a', active: true }, { id: 'b', active: false }];
  return { input: { phases: [] }, expected: ['a'], actual: assignmentsForCurrentPeriod(assignments, []).map((item) => item.id) };
});

testCase('periodization: only the active cycle assignments are visible', () => {
  const phases = [{ id: 'p1', order: 1, status: 'completed' }, { id: 'p2', order: 2, status: 'active' }];
  const assignments = [{ id: 'old', phaseId: 'p1', active: false }, { id: 'current', phaseId: 'p2', active: true }];
  return { input: { activePhase: 'p2' }, expected: ['current'], actual: assignmentsForCurrentPeriod(assignments, phases).map((item) => item.id) };
});

testCase('periodization: a configured student with no active cycle sees no mixed legacy program', () => {
  const phases = [{ id: 'p1', order: 1, status: 'completed' }];
  const assignments = [{ id: 'old', phaseId: 'p1', active: true }];
  return { input: { active: null }, expected: [], actual: assignmentsForCurrentPeriod(assignments, phases) };
});

testCase('periodization: multiple active cycles are rejected instead of mixing programs', () => {
  let code = null;
  try { resolvePeriodization([{ id: 'p1', status: 'active' }, { id: 'p2', status: 'active' }]); }
  catch (error) { code = error.code; }
  return { input: { activeCount: 2 }, expected: 'phase-conflict', actual: code };
});

testCase('periodization: next cycle order remains monotonic after archived cycles', () => ({
  input: [1, 3, 2], expected: 4, actual: nextPhaseOrder([{ order: 1 }, { order: 3 }, { order: 2 }]),
}));

testCase('periodization draft: a draft alone does not hide the legacy program from the student', () => {
  const phases = [{ id: 'draft-1', status: 'draft', order: 1 }];
  const assignments = [{ id: 'legacy', active: true }, { id: 'draft-exercise', phaseId: 'draft-1', active: false }];
  return { input: { phases: ['draft'] }, expected: ['legacy'], actual: assignmentsForCurrentPeriod(assignments, phases).map((item) => item.id) };
});

testCase('periodization draft: active phase remains visible while a draft is being edited', () => {
  const phases = [{ id: 'active-1', status: 'active', order: 1 }, { id: 'draft-2', status: 'draft', order: 2 }];
  const assignments = [{ id: 'current', phaseId: 'active-1', active: true }, { id: 'draft', phaseId: 'draft-2', active: false }];
  return { input: { active: 'active-1', draft: 'draft-2' }, expected: ['current'], actual: assignmentsForCurrentPeriod(assignments, phases).map((item) => item.id) };
});

testCase('phase source picker: same day label in different cycles stays as separate options', () => {
  const phases = [{ id: 'p1', name: 'Base', status: 'completed' }, { id: 'p2', name: 'Strength', status: 'active' }];
  const assignments = [
    { id: 'a1', phaseId: 'p1', dayLabel: 'Upper 1', exerciseId: 'bench', exerciseNameSnapshot: { vi: 'Bench' } },
    { id: 'a2', phaseId: 'p2', dayLabel: 'Upper 1', exerciseId: 'row', exerciseNameSnapshot: { vi: 'Row' } },
  ];
  const options = buildPhaseSourceOptions(assignments, phases, []).student;
  return { input: 'Upper 1 in two cycles', expected: { count: 2, sources: ['Base', 'Strength'] }, actual: { count: options.length, sources: options.map((option) => option.sourceName) } };
});

testCase('phase source picker: draft assignments never become a reusable source', () => {
  const phases = [{ id: 'draft', name: 'Draft', status: 'draft' }];
  const options = buildPhaseSourceOptions([{ phaseId: 'draft', dayLabel: 'A', exerciseId: 'bench' }], phases, []);
  return { input: 'draft assignments', expected: 0, actual: options.student.length };
});

testCase('phase draft: only selected whole-day options are copied', () => {
  const options = buildPhaseSourceOptions([
    { id: 'a1', dayLabel: 'A', exerciseId: 'bench', exerciseNameSnapshot: { vi: 'Bench' }, scheme: 2, schemeParams: {}, state: { trainingMax: 100 } },
    { id: 'a2', dayLabel: 'A', exerciseId: 'row', exerciseNameSnapshot: { vi: 'Row' }, scheme: 8, schemeParams: {}, state: { workingWeight: 50 } },
    { id: 'b1', dayLabel: 'B', exerciseId: 'squat', exerciseNameSnapshot: { vi: 'Squat' }, scheme: 2, schemeParams: {}, state: { trainingMax: 120 } },
  ], [], []).student;
  const selected = options.filter((option) => option.dayLabel === 'A');
  const copies = buildDraftAssignmentsFromSelections(selected, []);
  return { input: ['A'], expected: ['bench', 'row'], actual: copies.map((copy) => copy.exerciseId) };
});

testCase('phase draft: duplicate labels are kept separate with a readable suffix', () => {
  const exercise = { exerciseId: 'bench', exerciseNameSnapshot: { vi: 'Bench' }, scheme: 2, schemeParams: {}, state: { trainingMax: 100 } };
  const copies = buildDraftAssignmentsFromSelections([
    { sourceType: 'student', sourceId: 'p1', dayLabel: 'Upper 1', exercises: [exercise] },
    { sourceType: 'student', sourceId: 'p2', dayLabel: 'Upper 1', exercises: [{ ...exercise, exerciseId: 'row' }] },
  ], []);
  return { input: ['Upper 1', 'Upper 1'], expected: ['Upper 1', 'Upper 1 (2)'], actual: copies.map((copy) => copy.dayLabel) };
});

testCase('phase draft: adding another whole day never merges with an existing draft label', () => {
  const option = { sourceType: 'template', sourceId: 't1', dayLabel: 'Upper 1', exercises: [{ exerciseId: 'row', exerciseNameSnapshot: { vi: 'Row' }, scheme: 8, schemeParams: {}, state: { workingWeight: 50 } }] };
  const copies = buildDraftAssignmentsFromSelections([option], [], ['Upper 1']);
  return { input: { existing: 'Upper 1', added: 'Upper 1' }, expected: 'Upper 1 (2)', actual: copies[0].dayLabel };
});

testCase('phase draft: template reuses this student previous state for the same exercise', () => {
  const template = { id: 't1', name: 'Pull', sourceDayLabel: 'Pull', exercises: [{ exerciseId: 'machine_rows', exerciseNameSnapshot: { vi: 'Machine Rows' }, scheme: 8, schemeParams: { startingSets: 3, startingReps: 8 } }] };
  const option = buildPhaseSourceOptions([], [], [template]).library[0];
  const copies = buildDraftAssignmentsFromSelections([option], [{ exerciseId: 'machine_rows', active: true, state: { workingWeight: 45, currentSets: 4, currentReps: 10 } }]);
  return { input: 'machine_rows', expected: { workingWeight: 45, currentSets: 4 }, actual: copies[0].initialState };
});

testCase('phase draft: activation blocks an unconfigured weighted template exercise', () => {
  const issues = draftActivationIssues([{ exerciseId: 'bench', exerciseNameSnapshot: { vi: 'Bench' }, scheme: 2, schemeParams: { isBodyweight: false }, state: { trainingMax: 0 } }]);
  return { input: { trainingMax: 0 }, expected: 1, actual: issues.length };
});

testCase('phase draft: activation plan switches only the selected draft and current program', () => {
  const actual = buildPhaseActivationPlan(
    [{ id: 'current', status: 'active' }, { id: 'draft', status: 'draft' }],
    [{ id: 'old-a', phaseId: 'current', active: true }, { id: 'new-a', phaseId: 'draft', active: false, exerciseId: 'pull_up', exerciseNameSnapshot: { vi: 'Pull-up' }, scheme: 8, schemeParams: { isBodyweight: true }, state: { workingWeight: 0 } }],
    'draft',
  );
  return { input: 'draft', expected: { previousActivePhaseId: 'current', activateAssignmentIds: ['new-a'], deactivateAssignmentIds: ['old-a'] }, actual };
});

testCase('phase draft: a second activation click is rejected after the draft changed status', () => {
  let code = null;
  try { buildPhaseActivationPlan([{ id: 'draft', status: 'active' }], [], 'draft'); }
  catch (error) { code = error.code; }
  return { input: { targetStatus: 'active' }, expected: 'draft-unavailable', actual: code };
});

testCase('rest reminder: stays quiet until 30 seconds after the planned rest ends', () => ({
  input: { now: 129_999, restDeadline: 100_000 },
  expected: { phase: 'overrun', remainingSeconds: 1 },
  actual: restCycleState({ now: 129_999, restDeadline: 100_000 }),
}));

testCase('rest reminder: becomes due exactly after the 30-second overrun', () => ({
  input: { now: 130_000, restDeadline: 100_000 },
  expected: { phase: 'remind' },
  actual: restCycleState({ now: 130_000, restDeadline: 100_000 }),
}));

testCase('rest reminder: auto-completes 10 seconds after it was shown', () => ({
  input: { now: 140_000, sentAt: 130_000 },
  expected: { phase: 'complete' },
  actual: restCycleState({ now: 140_000, restDeadline: 100_000, reminderSentAt: 130_000 }),
}));

testCase('custom rest: clamps unsafe values while keeping normal presets', () => ({
  input: { preset: 120, tooLow: 2, tooHigh: 5000 },
  expected: { preset: 120, tooLow: 15, tooHigh: 900 },
  actual: { preset: normalizeRestSeconds(120), tooLow: normalizeRestSeconds(2), tooHigh: normalizeRestSeconds(5000) },
}));

testCase('undo set: targets the most recently completed set, not the highest row', () => ({
  input: [{ completed: true, completedOrder: 2 }, { completed: true, completedOrder: 1 }, { completed: false }],
  expected: 0,
  actual: latestCompletedSetIndex([{ completed: true, completedOrder: 2 }, { completed: true, completedOrder: 1 }, { completed: false }]),
}));

testCase('undo set: clears the last completion and stops its active rest timer', () => {
  let restStops = 0;
  const result = undoLatestCompletedSet([
    { completed: true, completedOrder: 1 },
    { completed: true, completedOrder: 2 },
  ], () => { restStops += 1; });
  return {
    input: { completedOrders: [1, 2] },
    expected: { index: 1, restStops: 1, stillCompleted: [true, false] },
    actual: { index: result.index, restStops, stillCompleted: result.sets.map((set) => set.completed) },
  };
});

testCase('skip exercise: produces a history marker but no progression entry', () => {
  const exercises = [{ assignmentId: 'a1', exerciseId: 'bench', exerciseNameSnapshot: { vi: 'Bench Press' }, skipped: true, sets: [{ completed: true }] }];
  return {
    input: { skipped: true },
    expected: { progressionEntries: 0, skippedEntries: 1, reason: 'readiness' },
    actual: {
      progressionEntries: buildCompletedExerciseEntries(exercises).length,
      skippedEntries: buildSkippedExerciseEntries(exercises).length,
      reason: buildSkippedExerciseEntries(exercises)[0]?.skipReason,
    },
  };
});

testCase('extra exercise: custom rest is included in the session payload', () => {
  const [entry] = buildCompletedExerciseEntries([{
    source: 'extra', exerciseId: 'machine_rows', restSeconds: 180,
    sets: [{ setIndex: 1, weight: 35, reps: 10, rir: 1, completed: true }],

});

// ---------- Previous performance by exercise ----------

testCase('previous performance: assigned exercise keeps weights by set index', () => {
  const history = latestPerformanceByExercise([{ id: 'newest', exerciseLogs: [{
    source: 'assigned', exerciseId: 'bench_press', actualSets: [
      { setIndex: 1, weight: 60, reps: 8 }, { setIndex: 2, weight: 57.5, reps: 8 },
    ],
  }] }]);
  return {
    input: 'bench_press',
    expected: [60, 57.5],
    actual: history.get('bench_press')?.sets.map((set) => set.weight),
  };
});

testCase('previous performance: substituted exercise belongs to the exercise actually performed', () => {
  const log = { exerciseId: 'barbell_row', substitutedExerciseId: 'machine_rows', actualSets: [{ setIndex: 1, weight: 45, reps: 10 }] };
  return { input: log, expected: 'machine_rows', actual: performedExerciseId(log) };
});

testCase('previous performance: extra exercise is available on its next appearance', () => {
  const history = latestPerformanceByExercise([{ exerciseLogs: [{
    source: 'extra', exerciseId: 'bayesian_curls', actualSets: [{ setIndex: 1, weight: 12.5, reps: 12 }],
  }] }]);
  return { input: 'bayesian_curls', expected: 12.5, actual: previousSetForIndex(history.get('bayesian_curls'), 1)?.weight };
});

testCase('previous performance: skipped latest session falls back to the latest completed session', () => {
  const history = latestPerformanceByExercise([
    { id: 'skipped', exerciseLogs: [{ exerciseId: 'hip_abduction', status: 'skipped', outcome: 'skipped', actualSets: [] }] },
    { id: 'completed', exerciseLogs: [{ exerciseId: 'hip_abduction', actualSets: [{ setIndex: 1, weight: 50, reps: 15 }] }] },
  ]);
  return { input: ['skipped', 'completed'], expected: { sessionId: 'completed', weight: 50 }, actual: { sessionId: history.get('hip_abduction')?.sessionId, weight: previousSetForIndex(history.get('hip_abduction'), 1)?.weight } };
});

testCase('previous performance: new set has no copied value when prior session had fewer sets', () => {
  const performance = { sets: [{ setIndex: 1, weight: 80 }, { setIndex: 2, weight: 77.5 }] };
  return { input: { requestedSet: 3 }, expected: null, actual: previousSetForIndex(performance, 3) };
});

testCase('previous performance: bodyweight zero remains a valid prior weight', () => {
  const history = latestPerformanceByExercise([{ exerciseLogs: [{ exerciseId: 'pull_up', actualSets: [{ setIndex: 1, weight: 0, reps: 8 }] }] }]);
  return { input: 'pull_up', expected: 0, actual: previousSetForIndex(history.get('pull_up'), 1)?.weight };
});

testCase('previous performance: swap and cancel restore the matching exercise history', () => {
  const history = latestPerformanceByExercise([{ exerciseLogs: [
    { exerciseId: 'barbell_row', actualSets: [{ setIndex: 1, weight: 70, reps: 8 }] },
    { source: 'extra', exerciseId: 'machine_rows', actualSets: [{ setIndex: 1, weight: 50, reps: 10 }] },
  ] }]);
  const original = performanceForExercise(history, 'barbell_row');
  const substituted = performanceForExercise(history, 'machine_rows');
  const canceledBackToOriginal = performanceForExercise(history, 'barbell_row');
  return {
    input: ['barbell_row', 'machine_rows', 'barbell_row'],
    expected: [70, 50, 70],
    actual: [original, substituted, canceledBackToOriginal].map((performance) => previousSetForIndex(performance, 1)?.weight),
  };
});

// ---------- Workout cancellation ----------

testCase('cancel session: stops timers, clears only the current draft, then resets the view', () => {
  const calls = [];
  cancelWorkoutSession({
    day: 'Upper 1',
    stopRestTimers: () => calls.push('stop-rest'),
    stopSessionTimer: () => calls.push('stop-session'),
    clearDraft: (day) => calls.push(`clear:${day}`),
    resetView: () => calls.push('reset-view'),
    createSessionId: () => 'session-new',
  });
  return {
    input: { day: 'Upper 1' },
    expected: ['stop-rest', 'stop-session', 'clear:Upper 1', 'reset-view'],
    actual: calls,
  };
});

testCase('cancel session: returns a clean state with a fresh session id', () => {
  const actual = cancelWorkoutSession({
    day: 'A',
    stopRestTimers: () => {}, stopSessionTimer: () => {}, clearDraft: () => {}, resetView: () => {},
    createSessionId: () => 'fresh-session-id',
  });
  return {
    input: { selectedDay: 'A', currentSessionId: 'old-session-id' },
    expected: { selectedDay: null, sessionStartTime: null, currentSessionId: 'fresh-session-id' },
    actual,
  };
});

testCase('cancel session: no day means no unrelated draft is removed', () => {
  let cleared = 0;
  cancelWorkoutSession({
    day: null,
    stopRestTimers: () => {}, stopSessionTimer: () => {}, clearDraft: () => { cleared += 1; }, resetView: () => {},
    createSessionId: () => 'fresh-session-id',
  });
  return { input: { day: null }, expected: 0, actual: cleared };
});

testCase('cancel session: never calls a session/progression writer', () => {
  let writes = 0;
  const writeSession = () => { writes += 1; };
  cancelWorkoutSession({
    day: 'A',
    stopRestTimers: () => {}, stopSessionTimer: () => {}, clearDraft: () => {}, resetView: () => {},
    createSessionId: () => 'fresh-session-id',
  });
  return { input: { writeSessionAvailable: Boolean(writeSession) }, expected: 0, actual: writes };
});

testCase('auth persistence: configured per browser tab', () => ({
  input: 'configured persistence', expected: 'session', actual: AUTH_PERSISTENCE_MODE,
}));

testCase('auth sign-in: persistence resolves before credentials are submitted', async () => {
  const calls = [];
  let resolvePersistence;
  const persistenceReady = new Promise((resolve) => { resolvePersistence = () => { calls.push('persistence'); resolve(); }; });
  const signingIn = signInAfterPersistence({
    persistenceReady,
    signIn: () => { calls.push('sign-in'); return { user: { uid: 'student-1' } }; },
  });
  resolvePersistence();
  const credential = await signingIn;
  return {
    input: { uid: credential.user.uid },
    expected: ['persistence', 'sign-in'],
    actual: calls,
  };
});

// ---------- Run ----------

const rowsEl = document.getElementById('rows');
let passCount = 0;

for (const [i, c] of cases.entries()) {
  let result, error, status;
  try {
    result = await c.fn();
    error = assertEqual(result.actual, result.expected);
    status = error ? 'fail' : 'pass';
  } catch (e) {
    status = 'fail';
    error = 'threw: ' + (e && e.message ? e.message : String(e));
    result = { input: {}, expected: {}, actual: null };
  }
  if (status === 'pass') passCount++;

  const tr = document.createElement('tr');
  tr.className = status;
  tr.innerHTML = `
    <td>${i + 1}</td>
    <td>${c.name}</td>
    <td><pre>${JSON.stringify(result.input, null, 0)}</pre></td>
    <td><pre>${JSON.stringify(result.expected, null, 0)}</pre></td>
    <td><pre>${JSON.stringify(result.actual, null, 0)}${error ? '\n\n' + error : ''}</pre></td>
    <td class="status">${status.toUpperCase()}</td>
  `;
  rowsEl.appendChild(tr);
}

const summary = `${passCount} / ${cases.length} passed`;
document.getElementById('summary').textContent = summary;
if (passCount === cases.length) {
  console.log('ENGINE_TESTS_OK ' + summary);
} else {
  console.error('ENGINE_TESTS_FAIL ' + summary);
}
