<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nrv.duyet_du_lieu_dinh_duong_david">Duyệt dữ liệu dinh dưỡng — David Coaching</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="client-ui.css">
<link rel="stylesheet" href="overview.css">
<link rel="stylesheet" href="nutrition-intake.css">
<style>
  .nr-list { margin: 10px 0 0; padding-left: 18px; font-size: var(--dc-fs-sm); line-height: 1.6; color: var(--cu-navy); }
  .nr-dish .nr-total { font-size: var(--dc-fs-xs); color: var(--text-500); }
</style>
<link rel="stylesheet" href="polish.css">
</head>
<body class="client-ui cu-overview">
<header class="app-header">
  <span class="brand brand-page"><span class="brand-mark">DC</span><span class="brand-mini" data-i18n="nrv.duyet_du_lieu_dinh_duong">Duyệt dữ liệu dinh dưỡng</span></span>
  <div class="header-group">
    <a href="coach.html" class="btn btn-outline btn-compact" data-app-shell-hidden="true" data-i18n="exrev.bang_dieu_khien">◀ Bảng điều khiển</a>
    <button class="btn btn-outline btn-compact" id="logout-btn" data-i18n-init="exrev.dang_xuat">Đăng xuất</button>
  </div>
</header>

<div id="boot-status" class="dc-skeleton" role="status" aria-label="Đang tải" data-i18n-aria-label="exrev.dang_tai"><span class="dc-skel dc-skel-hero"></span><span class="dc-skel dc-skel-line"></span><span class="dc-skel dc-skel-card"></span><span class="dc-skel dc-skel-card"></span></div>

<main id="app-content" hidden>
  <section class="cu-hero">
    <div class="cu-wrap">
      <h1 class="ov-title" data-i18n="nrv.duyet_du_lieu_dinh_duong">Duyệt dữ liệu dinh dưỡng</h1>
      <p class="ov-sub" id="nr-sub"></p>
    </div>
  </section>
  <div class="cu-wrap ov-body" id="nr-body"></div>
</main>

<script type="module">
import { auth } from './firebase-init.js';
import { t, fmtNumber } from './i18n.js';
import { mountAppShell } from './app-shell.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import { getMyRole } from './training-data.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { FOODS, STREET_DISHES } from './nutrition-foods.js';
import { FOOD_MICROS, MACRO_MISMATCHES } from './nutrition-micros.js';
import { PORTIONS } from './nutrition-portions.js';
import { STREET_RECIPES, STREET_SODIUM_NOTE } from './nutrition-street-recipes.js';
import { NUTRIENT_KEYS, NUTRIENT_LABELS, NUTRIENT_UNITS, digitsFor, foodNutrients, recipeNutrients, roundNutrients } from './nutrition-composition.js';
import { EXTRA_ENERGY_MISMATCHES, EXTRA_FOODS, EXTRA_NO_SOURCE, EXTRA_TRANSLATION_FIXES, FOOD_DATA_SOURCES } from './nutrition-foods-extra.js';

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
const num = (value, digits = 1) => fmtNumber(value, { maxFrac: digits, grouping: true });

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['coach']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'coach') { $('boot-status').textContent = t('exrev.tai_khoan_chua_duoc_thiet_lap'); return; }
    mountAppShell({ role: 'coach', active: 'nutrition' });
    $('boot-status').style.display = 'none';
    $('app-content').hidden = false;
    render();
  } catch (error) {
    console.error(error);
    $('boot-status').textContent = t('exrev.chua_the_tai_trang_luc_nay');
  }
});
$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });

const portionStatus = (p) => (p.grams === null ? t('nrv.span_class_nr_tag_todo_cho')
  : p.approved ? t('nrv.span_class_nr_tag_ok_da') : t('nrv.span_class_nr_tag_wait_cho'));

function render() {
  const waitingGrams = PORTIONS.filter((p) => p.grams === null).length;
  const waitingPortions = PORTIONS.filter((p) => p.grams !== null && !p.approved).length;
  const recipes = STREET_RECIPES.filter((d) => d.recipe);
  // A mismatch David already decided carries " · <quyết định>" after the numbers (food-map.json macroDecision).
  const decided = MACRO_MISMATCHES.filter((line) => line.includes(' · '));
  const undecided = MACRO_MISMATCHES.filter((line) => !line.includes(' · '));
  const outOfRange = recipes.filter((d) => !d.approved && kcalOutOfRange(d));
  const noSource = FOODS.filter((f) => Object.values(FOOD_MICROS[f.name]?.micros || {}).every((value) => value === null));
  $('nr-sub').innerHTML = `${t('nrv.chua_co_gi_hien_cho_hoc')}`;
  $('nr-body').innerHTML = `
    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nrv.viec_can_ban_lam')}</h3></div>
      <ul class="nr-list">
        <li><strong>${waitingGrams}</strong> ${t('nrv.khau_phan_kieu_viet_cho_ban')}</li>
        <li><strong>${waitingPortions}</strong> ${t('nrv.khau_phan_lay_tu_usda_cho')}</li>
        <li><strong>${recipes.filter((d) => !d.approved).length}</strong> ${t('nrv.cong_thuc_mon_an_ngoai_cho', { p0: outOfRange.length ? t('nrv.x.outOfRange', { n: outOfRange.length }) : '' })}</li>
        <li><strong>${undecided.length}</strong> ${t('nrv.thuc_pham_co_calo_da_chat', { p0: decided.length ? t('nrv.x.decided', { n: decided.length }) : '' })}</li>
        <li><strong>${noSource.length}</strong> ${t('nrv.thuc_pham_chua_co_so_lieu', { p0: noSource.map((f) => escapeHtml(f.name)).join(', ') })}</li>
        <li><strong>${EXTRA_FOODS.filter((f) => !f.approved).length}</strong> ${t('nrv.mon_moi_cho_duyet_co_the')}</li>
      </ul>
    </section>

    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nrv.lech_qua_15_so_voi_usda')}</h3></div>
      <p>${t('nrv.so_trong_bang_hien_tai_dang')}</p>
      <ul class="nr-list">${MACRO_MISMATCHES.map((line) => {
        const [numbers, decision] = line.split(' · ');
        return `<li>${escapeHtml(numbers)}${decision ? ` <span class="nr-tag ok">${t('nrv.da_quyet')}</span> ${escapeHtml(decision)}` : t('nrv.span_class_nr_tag_wait_cho_2')}</li>`;
      }).join('')}</ul>
    </section>

    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nu.fl.serving')}</h3><span class="ov-head-num">${PORTIONS.length}</span></div>
      <div class="nr-scroll"><table class="nr-table mid">
        <thead><tr><th>${t('nrv.mon')}</th><th>${t('nu.fl.serving')}</th><th>Gram</th><th style="text-align:left">${t('nrv.nguon')}</th><th>${t('cj.trang_thai')}</th></tr></thead>
        <tbody>${PORTIONS.map((p) => `<tr>
          <td>${escapeHtml(p.food)}</td><td style="text-align:left">${escapeHtml(p.label)}</td>
          <td>${p.grams === null ? '<span class="nr-none">—</span>' : num(p.grams)}</td>
          <td class="src">${p.source?.db === 'USDA' ? `USDA FDC ${p.source.fdcId} · "${escapeHtml(p.source.measure)}"` : p.source?.db === 'David' ? t('nrv.tra_cuu_david_duyet') : t('nrv.chua_co')}${p.note ? `<br>${escapeHtml(p.note)}` : ''}${(p.refs || []).map((ref) => `<br>· ${ref.url ? `<a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener">${escapeHtml(ref.title)}</a>` : escapeHtml(ref.title)}${ref.kind ? ` <em class="nr-kind">(${escapeHtml(ref.kind)})</em>` : ''}`).join('')}${p.proposal ? `<br><strong>${t('nrv.can_ban_chot')}</strong> ${escapeHtml(p.proposal)}` : ''}</td>
          <td>${portionStatus(p)}</td></tr>`).join('')}</tbody>
      </table></div>
    </section>

    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nrv.mon_an_ngoai')}</h3><span class="ov-head-num">${recipes.length}/${STREET_RECIPES.length}</span></div>
      <p>${t('nrv.gram_la_uoc_luong_cua_claude', { p0: escapeHtml(STREET_SODIUM_NOTE), p1: recipes.filter((d) => !d.approved).length })}</p>
      ${[...STREET_RECIPES].sort((a, b) => Number(Boolean(a.approved || !a.recipe)) - Number(Boolean(b.approved || !b.recipe))).map(dishMarkup).join('')}
    </section>

    ${extraSections()}

    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nrv.bang_thuc_pham')}</h3><span class="ov-head-num">${t('nrv.mon_2', { p0: FOODS.length })}</span></div>
      <p>${t('nrv.tren_100_g_dung_trang_thai')} "—" ${t('nrv.la_chua_co_so_lieu_khong')}</p>
      <div class="nr-scroll"><table class="nr-table wide">
        <thead><tr><th>${t('nrv.thuc_pham')}</th>${NUTRIENT_KEYS.map((k) => `<th>${NUTRIENT_LABELS[k]}<br>${NUTRIENT_UNITS[k]}</th>`).join('')}<th style="text-align:left">${t('nrv.nguon')}</th></tr></thead>
        <tbody>${FOODS.map(foodRow).join('')}</tbody>
      </table></div>
    </section>
    <p class="flv-note" style="margin:4px 4px 20px">${t('nrv.nguon_so_lieu', { p0: FOOD_DATA_SOURCES.map(escapeHtml).join(' · ') })}</p>`;
}

const GROUP_LABELS = Object.freeze({ PROTEIN: t('nrv.dam_thit_ca_trung_sua_dau'), CARB: t('nrv.tinh_bot_va_trai_cay'), RAU: t('nrv.rau_nam_rong_bien'), FAT: t('nrv.beo_hat_dau'), KHAC: t('nrv.gia_vi_va_do_uong') });
const SRC_LABEL = Object.freeze({ USDA: 'USDA FDC', AU: t('source.AU'), NO: 'Na Uy' });

function extraSections() {
  const groups = Object.keys(GROUP_LABELS).map((group) => {
    const foods = EXTRA_FOODS.filter((food) => food.group === group);
    if (!foods.length) return '';
    const rows = foods.map((food) => `<tr>
      <td>${escapeHtml(food.name)}${food.approved ? t('nrv.span_class_nr_tag_ok_da_2') : ''}</td>
      ${NUTRIENT_KEYS.map((k) => `<td>${food.values[k] === null ? '<span class="nr-none">—</span>' : num(food.values[k], digitsFor(k))}</td>`).join('')}
      <td class="src">${SRC_LABEL[food.source.db] || food.source.db} ${escapeHtml(food.source.id)}: ${escapeHtml(food.source.name)}${food.source.carbConverted ? t('nrv.br_carb_carb_kha_dung_chat') : ''}${food.note ? `<br>${escapeHtml(food.note)}` : ''}</td>
    </tr>`).join('');
    return `<h4 class="ov-sub-head">${t('nrv.mon_3', { p0: GROUP_LABELS[group], p1: foods.length })}</h4>
      <div class="nr-scroll"><table class="nr-table wide">
        <thead><tr><th>${t('nrv.mon')}</th>${NUTRIENT_KEYS.map((k) => `<th>${NUTRIENT_LABELS[k]}<br>${NUTRIENT_UNITS[k]}</th>`).join('')}<th style="text-align:left">${t('nrv.nguon')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }).join('');
  return `
    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nrv.mon_moi')}</h3><span class="ov-head-num">${t('nrv.da_duyet', { p0: EXTRA_FOODS.filter((f) => f.approved).length, p1: EXTRA_FOODS.length })}</span></div>
      <p>${t('nrv.moi_mon_lay_ca_11_chat')} "${t('nrv.duyet_ca_nhom_rau')}"${t('nrv.hoac_liet_ke_mon_muon_bo')}</p>
      ${EXTRA_ENERGY_MISMATCHES.length ? `<p><strong>${t('nrv.kiem_tra_calo_lech')}</strong> ${t('nrv.calo_cua_nguon_khac_calo_uoc')}</p><ul class="nr-list">${EXTRA_ENERGY_MISMATCHES.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}</ul>` : ''}
      ${groups}
    </section>

    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nrv.ban_dich_da_sua')}</h3><span class="ov-head-num">${EXTRA_TRANSLATION_FIXES.length}</span></div>
      <p>${t('nrv.trong_danh_sach_ten_mon_cua')}</p>
      <ul class="nr-list">${EXTRA_TRANSLATION_FIXES.map(([name, wrong, right]) => `<li><strong>${escapeHtml(name)}</strong>: ${escapeHtml(wrong)}; ${escapeHtml(right)}.</li>`).join('')}</ul>
    </section>

    <section class="cu-card ov-section nr-section">
      <div class="cu-card-head"><h3>${t('nrv.khong_co_nguon')}</h3></div>
      <p>${t('nrv.khong_tim_duoc_so_lieu_dang')}</p>
      <ul class="nr-list">${EXTRA_NO_SOURCE.map(([names, why]) => `<li><strong>${escapeHtml(names)}</strong>: ${escapeHtml(why)}</li>`).join('')}</ul>
    </section>`;
}

function foodRow(food) {
  const info = FOOD_MICROS[food.name] || {};
  const { values, missing } = foodNutrients(food.name, 100);
  const cells = NUTRIENT_KEYS.map((k) => `<td>${missing.includes(k) ? '<span class="nr-none">—</span>' : num(values[k], digitsFor(k))}</td>`).join('');
  const vn = Object.values(info.microSource || {}).includes('VN');
  const src = info.source
    ? `USDA FDC ${info.source.fdcId}: ${escapeHtml(info.source.description)}${info.source.scaled ? ` (× ${info.source.scaled})` : ''}`
    : t('nrv.usda_khong_co');
  const foreign = info.foreign ? `${info.foreign.source === 'AU' ? t('source.AU') : 'Na Uy'} ${escapeHtml(info.foreign.id)}: ${escapeHtml(info.foreign.name)}${info.foreign.note ? ` · ${escapeHtml(info.foreign.note)}` : ''}<br>` : '';
  return `<tr><td>${escapeHtml(food.name)}</td>${cells}<td class="src">${vn ? `${t('nrv.viet_nam', { p0: escapeHtml(info.vn?.name || '') })}<br>` : ''}${foreign}${src}${info.note ? `<br>${escapeHtml(info.note)}` : ''}</td></tr>`;
}

/** Tổng calo của công thức nằm ngoài khoảng calo cũ của món (STREET_DISHES). */
function kcalOutOfRange(dish) {
  const street = STREET_DISHES.find((d) => d.name === dish.name);
  if (!dish.recipe || !street) return false;
  const kcal = Math.round(recipeNutrients(dish.recipe).values.kcal);
  return kcal < street.kcalLow || kcal > street.kcalHigh;
}

function dishMarkup(dish) {
  const street = STREET_DISHES.find((d) => d.name === dish.name);
  if (!dish.recipe) {
    return `<div class="nr-dish"><h4>${escapeHtml(dish.name)} <span class="nr-tag wait">${t('nrv.khong_tach_duoc')}</span></h4>
      <p>${t('nrv.giu_kcal_g_dam', { p0: escapeHtml(dish.assumptions), p1: street.kcalLow, p2: street.kcalHigh, p3: street.protein })}</p></div>`;
  }
  const total = roundNutrients(recipeNutrients(dish.recipe));
  const shown = NUTRIENT_KEYS.filter((k) => k !== 'sodium')
    .map((k) => `${NUTRIENT_LABELS[k]} ${total.missing.includes(k) ? '—' : num(total.values[k], digitsFor(k))} ${NUTRIENT_UNITS[k]}`).join(' · ');
  return `<div class="nr-dish">
    <h4>${escapeHtml(dish.name)} ${dish.approved ? t('nrv.span_class_nr_tag_ok_da') : t('nrv.span_class_nr_tag_wait_cho')}${!dish.approved && kcalOutOfRange(dish) ? t('nrv.span_class_nr_tag_wait_calo') : ''}${dish.proposedOn ? ` <small>${t('nrv.claude_de_xuat', { p0: escapeHtml(dish.proposedOn) })}</small>` : ''}</h4>
    <ul>${dish.recipe.map((part) => `<li>${escapeHtml(part.food)} ${num(part.grams)} g</li>`).join('')}</ul>
    <p>${escapeHtml(dish.assumptions)}</p>
    <p class="nr-total">${t('nrv.tong_bang_cu_kcal_g_dam', { p0: shown, p1: street.kcalLow, p2: street.kcalHigh, p3: street.protein, p4: total.missing.length ? t('nrv.x.missing', { list: total.missing.filter((k) => k !== 'sodium').map((k) => NUTRIENT_LABELS[k]).join(', ') }) : '' })}</p>
  </div>`;
}
</script>
</body>
</html>
