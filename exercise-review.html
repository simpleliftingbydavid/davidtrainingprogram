<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="exrev.duyet_bai_tap_moi_david_coaching">Duyệt bài tập mới — David Coaching</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="client-ui.css">
<link rel="stylesheet" href="overview.css">
<style>
  .nr-list { margin: 10px 0 0; padding-left: 18px; font-size: var(--dc-fs-sm); line-height: 1.6; color: var(--cu-navy); }
  .nr-dish .nr-total { font-size: var(--dc-fs-xs); color: var(--text-500); }

  .er-gaps td:first-child { white-space: normal; word-break: break-word; font-size: var(--dc-fs-xs); }
  .er-gaps th:not(:first-child), .er-gaps td:not(:first-child) { width: 52px; }
  .er-done { margin: 8px 0 0; padding-left: 18px; font-size: var(--dc-fs-sm); line-height: 1.6; color: var(--cu-navy); }
  .er-done li + li { margin-top: 2px; }
  .er-card { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
  .er-card h4 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--dc-fs-md); color: var(--cu-navy); }
  .er-card h4 small { flex-basis: 100%; font-weight: 500; font-size: var(--dc-fs-xs); color: var(--text-500); }
  .er-card p { margin: 6px 0 0; font-size: var(--dc-fs-sm); line-height: 1.5; color: var(--text-700); }
  .er-card ol { margin: 6px 0 0; padding-left: 20px; font-size: var(--dc-fs-sm); line-height: 1.5; color: var(--cu-navy); }
  .er-pick { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .er-pick button { min-height: 38px; padding: 6px 14px; border: 1.5px solid var(--cu-rule); border-radius: 999px; background: var(--surface); color: var(--cu-navy); font: 700 var(--dc-fs-sm) var(--font-body, inherit); cursor: pointer; }
  .er-pick button[aria-pressed="true"].ok { background: var(--note-bg); border-color: var(--note-text); color: var(--note-text); }
  .er-pick button[aria-pressed="true"].no { background: var(--caution-bg); border-color: var(--caution-text); color: var(--caution-text); }
  .er-pick button[aria-pressed="true"].wait { background: var(--cu-navy); border-color: var(--cu-navy); color: #fff; }
  .er-copy { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .er-copy button { min-height: 44px; padding: 8px 18px; border: 0; border-radius: 10px; background: var(--cu-orange); color: var(--cu-navy); font: 800 var(--dc-fs-md) var(--font-body, inherit); cursor: pointer; }
  .er-out { margin-top: 8px; width: 100%; min-height: 90px; padding: 10px; border: 1px solid var(--cu-rule); border-radius: 10px; font: var(--dc-fs-xs)/1.5 monospace; color: var(--cu-navy); background: var(--surface); }
</style>
<link rel="stylesheet" href="polish.css">
</head>
<body class="client-ui cu-overview">
<header class="app-header">
  <span class="brand brand-page"><span class="brand-mark">DC</span><span class="brand-mini" data-i18n="exrev.duyet_bai_tap_moi">Duyệt bài tập mới</span></span>
  <div class="header-group">
    <a href="coach.html" class="btn btn-outline btn-compact" data-app-shell-hidden="true" data-i18n="exrev.bang_dieu_khien">◀ Bảng điều khiển</a>
    <button class="btn btn-outline btn-compact" id="logout-btn" data-i18n-init="exrev.dang_xuat">Đăng xuất</button>
  </div>
</header>

<div id="boot-status" class="dc-skeleton" role="status" aria-label="Đang tải" data-i18n-aria-label="exrev.dang_tai"><span class="dc-skel dc-skel-hero"></span><span class="dc-skel dc-skel-line"></span><span class="dc-skel dc-skel-card"></span><span class="dc-skel dc-skel-card"></span></div>

<main id="app-content" hidden>
  <section class="cu-hero">
    <div class="cu-wrap">
      <p class="cu-eyebrow" data-i18n="exrev.danh_cho_coach">Dành cho coach</p>
      <h1 class="ov-title" data-i18n="exrev.duyet_bai_tap_moi">Duyệt bài tập mới</h1>
      <p class="ov-sub" id="er-sub"></p>
    </div>
  </section>
  <div class="cu-wrap ov-body" id="er-body"></div>
</main>

<script type="module">
import { auth } from './firebase-init.js';
import { t } from './i18n.js';
import { muscleLabel } from './muscle-labels.js';
import { mountAppShell } from './app-shell.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import { getMyRole } from './training-data.js';
import { redirectForUnexpectedRole } from './auth-session-utils.js';
import { EXERCISES } from './exercise-seed-data.js';
import { DECISION_DATE, PROPOSAL_GROUP_ORDER, approvedProposals, pendingProposals, rejectedProposals } from './exercise-proposals.js';
import { loadPerLabel } from './client-ui.js';

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
const STORE_KEY = 'david.exerciseReview.v1';
const EQUIPMENT_VI = { barbell: t('exrev.ta_don'), dumbbell: t('exrev.ta_don_2'), cable: t('exrev.cap'), machine: t('exrev.may'), bodyweight: t('lift.load.bodyweight'), weighted: t('exrev.them_ta'), rings: t('exrev.vong_treo') };

// Lựa chọn tạm của David trên máy này (chưa phải quyết định): 'ok' | 'no' | 'wait'.
let choices = {};
try { choices = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch { choices = {}; }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(choices)); } catch { /* không lưu được thì bỏ qua */ } };
const choiceOf = (id) => choices[id] || 'wait';

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  try {
    const role = await getMyRole(user.uid);
    const redirect = redirectForUnexpectedRole(role, ['coach']);
    if (redirect) { location.replace(redirect); return; }
    if (role !== 'coach') { $('boot-status').textContent = t('exrev.tai_khoan_chua_duoc_thiet_lap'); return; }
    mountAppShell({ role: 'coach', active: 'review' });
    $('boot-status').style.display = 'none';
    $('app-content').hidden = false;
    render();
  } catch (error) {
    console.error(error);
    $('boot-status').textContent = t('exrev.chua_the_tai_trang_luc_nay');
  }
});
$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });

const pending = () => pendingProposals();

function gapRows() {
  const counts = new Map();
  EXERCISES.forEach((e) => { const k = `${e.muscleGroup}|${e.movementPattern}`; counts.set(k, (counts.get(k) || 0) + 1); });
  const rows = new Map();
  pending().forEach((p) => {
    const k = `${p.muscleGroup}|${p.movementPattern}`;
    const row = rows.get(k) || { group: p.muscleGroup, pattern: p.movementPattern, have: counts.get(k) || 0, add: 0 };
    row.add += 1; rows.set(k, row);
  });
  return [...rows.values()].sort((a, b) => PROPOSAL_GROUP_ORDER.indexOf(a.group) - PROPOSAL_GROUP_ORDER.indexOf(b.group) || a.pattern.localeCompare(b.pattern));
}

function cardMarkup(item) {
  const choice = choiceOf(item.exerciseId);
  const per = loadPerLabel(item);
  const btn = (value, label) => `<button type="button" class="${value}" data-pick="${escapeHtml(item.exerciseId)}" data-value="${value}" aria-pressed="${choice === value}">${label}</button>`;
  return `<div class="er-card" data-id="${escapeHtml(item.exerciseId)}">
    <h4>${escapeHtml(item.nameVi)} <span class="nr-tag wait">${t('exrev.cho_duyet')}</span>
      <small>${escapeHtml(muscleLabel(item.muscleGroup))} · ${escapeHtml(item.movementPattern)} · ${item.equipmentTags.map((t) => EQUIPMENT_VI[t] || t).join(' + ')}${per ? ` ${t('exrev.so_kg', { p0: per })}` : ''}</small></h4>
    <ol>${item.technique.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}</ol>
    <p><strong>${t('exrev.vi_sao_them')}</strong> ${t('exrev.video_chua_co_david_them_sau', { p0: escapeHtml(item.gap) })}</p>
    <div class="er-pick" role="group" aria-label="${t('exrev.quyet_dinh_cho', { p0: escapeHtml(item.nameVi) })}">${btn('ok', t('exrev.duyet'))}${btn('no', t('exrev.bo'))}${btn('wait', t('exrev.de_sau'))}</div>
  </div>`;
}

function render() {
  const list = pending();
  $('er-sub').textContent = list.length
    ? `${t('exrev.bai_claude_de_xuat_cho_david', { p0: list.length })}`
    : `${t('exrev.0_bai_cho_duyet_bai_da', { p0: approvedProposals().length, p1: rejectedProposals().length })}`;
  const gaps = gapRows().map((row) => `<tr><td>${escapeHtml(muscleLabel(row.group))} · ${escapeHtml(row.pattern.replace(/^(compound|accessory|isolation)_/, '$1 '))}</td><td>${row.have}</td><td>+${row.add}</td></tr>`).join('');
  const groups = PROPOSAL_GROUP_ORDER.map((group) => {
    const items = list.filter((item) => item.muscleGroup === group);
    return items.length ? `<section class="cu-card nr-section"><div class="cu-card-head"><h3>${escapeHtml(muscleLabel(group))}</h3><span class="ov-head-num">${t('exrev.bai_de_xuat', { p0: items.length })}</span></div>${items.map(cardMarkup).join('')}</section>` : '';
  }).join('');
  const done = (items, label) => `<section class="cu-card nr-section">
      <div class="cu-card-head"><h3>${label}</h3><span class="ov-head-num">${t('exrev.bai', { p0: items.length })}</span></div>
      <p>${DECISION_DATE.split('-').reverse().join('/')}</p>
      <ul class="er-done">${items.map((item) => `<li><strong>${escapeHtml(item.nameVi)}</strong> <span class="nr-kind">${escapeHtml(muscleLabel(item.muscleGroup))}</span></li>`).join('')}</ul>
    </section>`;
  if (!list.length) {
    $('er-body').innerHTML = `
    <section class="cu-card nr-section">
      <div class="cu-card-head"><h3>${t('exrev.da_duyet_xong')}</h3></div>
      <p>${t('exrev.khong_con_bai_nao_cho_duyet')}</p>
    </section>
    ${done(approvedProposals(), t('exrev.da_vao_thu_vien'))}
    ${done(rejectedProposals(), t('exrev.da_bo'))}`;
    return;
  }
  $('er-body').innerHTML = `
    <section class="cu-card nr-section">
      <div class="cu-card-head"><h3>${t('exrev.cach_duyet')}</h3></div>
      <p>${t('exrev.chon_duyet_bo_hoac_de_sau')} <strong>${t('exrev.sao_chep_ket_qua')}</strong> ${t('exrev.roi_dan_vao_cuoc_tro_chuyen')}</p>
      <p>${t('exrev.so_kg_cua_bai_ghi_san')} "${t('lift.per.side')}" ${t('exrev.hoac')} "${t('lift.per.hand')}" ${t('exrev.theo_quy_tac_da_chot_video')}</p>
    </section>
    <section class="cu-card nr-section">
      <div class="cu-card-head"><h3>${t('exrev.khoang_trong_hien_tai')}</h3></div>
      <div class="nr-scroll"><table class="nr-table er-gaps"><thead><tr><th>${t('exrev.nhom_co_dang')}</th><th>${t('exrev.co')}</th><th>${t('nu.fl.addBtn')}</th></tr></thead><tbody>${gaps}</tbody></table></div>
    </section>
    ${groups}
    <section class="cu-card nr-section">
      <div class="cu-card-head"><h3>${t('exrev.ket_qua')}</h3><span class="ov-head-num" id="er-count"></span></div>
      <div class="er-copy"><button type="button" id="er-copy">${t('exrev.sao_chep_ket_qua')}</button><span id="er-copied" class="nr-kind"></span></div>
      <textarea class="er-out" id="er-out" readonly aria-label="${t('exrev.ket_qua_duyet')}"></textarea>
    </section>`;
  $('er-body').addEventListener('click', onPick);
  $('er-copy').addEventListener('click', copyResult);
  refreshResult();
}

function onPick(event) {
  const button = event.target.closest('[data-pick]');
  if (!button) return;
  const id = button.dataset.pick;
  choices[id] = button.dataset.value;
  save();
  button.closest('.er-pick').querySelectorAll('button').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
  refreshResult();
}

function resultText() {
  const by = (value) => pending().filter((item) => choiceOf(item.exerciseId) === value).map((item) => item.exerciseId);
  const ok = by('ok'); const no = by('no'); const wait = by('wait');
  return `Duyệt bài tập mới (${ok.length} duyệt, ${no.length} bỏ, ${wait.length} để sau)\nDUYỆT: ${ok.join(', ') || t('exrev.khong_co')}\nBỎ: ${no.join(', ') || t('exrev.khong_co')}\nĐỂ SAU: ${wait.join(', ') || t('exrev.khong_co')}`; // i18n-data
}
function refreshResult() {
  $('er-out').value = resultText();
  const decided = pending().filter((item) => choiceOf(item.exerciseId) !== 'wait').length;
  $('er-count').textContent = `${t('exrev.da_chon', { p0: decided, p1: pending().length })}`;
}
async function copyResult() {
  const text = resultText();
  try { await navigator.clipboard.writeText(text); $('er-copied').textContent = t('exrev.da_sao_chep'); }
  catch { $('er-out').select(); $('er-copied').textContent = t('exrev.chua_sao_chep_duoc_tu_dong'); }
}
</script>
</body>
</html>
