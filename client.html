<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buổi tập của tôi — David Training Program</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  .app-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
  .app-header .brand-mini { font-family:var(--font-display); font-weight:700; color:var(--navy-900); }
  .app-body { max-width: 760px; margin: 0 auto; padding: 28px 20px 90px; }
  .day-sub { font-size: .95rem; color: var(--text-500); margin: -6px 0 22px; max-width: 52ch; }
  .day-list { display:flex; flex-wrap:wrap; gap:10px; margin: 16px 0 28px; }
  .day-chip { padding:10px 18px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; font-weight:700; transition: border-color .18s ease, background .18s ease; }
  .day-chip:hover { border-color:var(--accent); }
  .day-chip.active { border-color:var(--accent); background:var(--accent); color:#fff; }
  .exercise-block { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:18px; }
  .exercise-block h3 { margin-bottom:4px; }
  .planned-line { font-size:.92rem; color:var(--text-700); margin-bottom:14px; line-height:1.55; }
  .coach-note { font-size:.85rem; color:var(--accent-dark); background:var(--accent-light); border-radius:8px; padding:10px 12px; margin:-6px 0 14px; line-height:1.5; }
  .technique-details { margin: -6px 0 16px; }
  .technique-details summary { cursor:pointer; font-size:.85rem; font-weight:700; color:var(--accent-dark); }
  .technique-details ul { margin:8px 0 0; padding-left:18px; font-size:.85rem; color:var(--text-700); line-height:1.55; }
  .set-row { display:grid; grid-template-columns: 52px 1fr 1fr 1fr 56px; gap:8px; align-items:center; margin-bottom:8px; }
  .set-row .set-idx { font-weight:700; color:var(--text-500); font-size:.85rem; }
  .set-row input { width:100%; padding:9px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:.92rem; }
  .set-row input:disabled { background:var(--surface-alt); color:var(--text-500); }
  .set-count-field { margin-bottom:14px; }
  .set-count-control { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .set-count-stepper { display:inline-flex; align-items:center; border:1.5px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); }
  .set-count-stepper button { width:42px; height:40px; border:0; background:var(--surface-alt); color:var(--navy-900); font-size:1.25rem; font-weight:800; cursor:pointer; }
  .set-count-stepper button:hover { background:var(--accent-light); color:var(--accent-dark); }
  .set-count-input { width:48px; border:0; text-align:center; font-weight:800; color:var(--navy-900); background:var(--surface); -moz-appearance:textfield; }
  .set-count-input::-webkit-outer-spin-button, .set-count-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .set-adjust-note { font-size:.78rem; color:var(--text-500); }
  .set-done-btn { width:100%; padding:9px 4px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; font-weight:700; font-size:.82rem; }
  .set-done-btn:hover { border-color:var(--accent); color:var(--accent-dark); }
  .set-row.set-done { opacity:.7; }
  .set-row.set-done .set-done-btn { background:var(--accent); border-color:var(--accent); color:#fff; cursor:default; }
  .exercise-swap-wrap { margin: -6px 0 14px; }
  .exercise-swap-btn { font-size:.78rem; font-weight:700; color:var(--accent-dark); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }
  .exercise-swap-picker { margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .exercise-swap-picker select { padding:9px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:.88rem; }
  .exercise-swap-note { font-size:.78rem; color:var(--accent-dark); font-style:italic; margin:0 0 14px; }
  .extra-exercise-area { margin:4px 0 20px; }
  .extra-exercise-picker { display:none; margin-top:10px; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--surface-alt); }
  .extra-exercise-picker.show { display:block; }
  .extra-exercise-picker-row { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:8px; }
  .extra-exercise-picker input, .extra-exercise-picker select { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface); font:inherit; }
  .extra-badge { display:inline-flex; margin-left:8px; padding:2px 8px; border-radius:999px; background:var(--accent-light); color:var(--accent-dark); font-size:.68rem; font-weight:800; vertical-align:middle; }
  .extra-remove-btn { font-size:.76rem; color:var(--text-500); background:none; border:0; padding:0; margin:-4px 0 12px; text-decoration:underline; cursor:pointer; }
  .previous-performance { margin:-6px 0 14px; padding:9px 12px; border-radius:8px; background:var(--surface-alt); color:var(--text-700); font-size:.82rem; }

  /* ---- Rest timer: inline badge on each exercise, no popup ---- */
  .rest-badge {
    display:none; align-items:center; gap:10px; background:var(--accent-light); color:var(--accent-dark);
    font-weight:800; padding:9px 14px; border-radius:10px; margin:-6px 0 14px;
    font-variant-numeric:tabular-nums; font-size:.92rem;
  }
  .rest-badge.show { display:flex; }
  .rest-badge-dot { width:8px; height:8px; border-radius:50%; background:var(--accent-dark); flex-shrink:0; animation: rest-pulse 1.2s ease-in-out infinite; }
  @keyframes rest-pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .rest-badge-time { font-size:1.05rem; }
  .rest-badge-skip { margin-left:auto; background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer; font-weight:700; font-size:.82rem; padding:2px; }
  #pre-start-panel { display:none; }
  .pre-start-summary { font-size:.92rem; color:var(--text-700); margin:6px 0 16px; line-height:1.55; }
  .session-timer-bar {
    position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--navy-900); color:#fff; padding:10px; border-radius:10px; margin-bottom:20px;
    font-weight:700; font-variant-numeric:tabular-nums; font-size:.95rem;
  }
  #day-content { display:none; }
  #next-up { display:none; }
  #boot-status { text-align:center; padding:60px 20px; color:var(--text-500); }
  #app-content { display:none; }

  /* ---- Result panel: up / hold / down states ---- */
  .result-item { border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: rgba(255,255,255,.04); border-left: 4px solid rgba(255,255,255,.15); }
  .result-item.outcome-up { border-left-color: #4fb888; background: rgba(79,184,136,.08); }
  .result-item.outcome-hold { border-left-color: rgba(255,255,255,.35); }
  .result-item.outcome-down { border-left-color: rgba(255,255,255,.15); }
  .result-item.outcome-sub { border-left-color: var(--accent); background: rgba(221,122,59,.08); }
  .outcome-head { display:flex; align-items:center; font-weight:700; }
  .outcome-icon { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; margin-right:9px; flex-shrink:0; }
  .outcome-up .outcome-icon { background: rgba(79,184,136,.22); color:#7be0a0; }
  .outcome-hold .outcome-icon { background: rgba(255,255,255,.12); color:#dfe4ee; }
  .outcome-down .outcome-icon { background: rgba(255,255,255,.08); color:#b9c2d6; }
  .outcome-sub .outcome-icon { background: rgba(221,122,59,.2); color: var(--accent-light); }
  .outcome-msg { font-size:.85rem; color:#cdd3e0; margin:5px 0 0 31px; }
  .outcome-next { font-size:.85rem; margin:8px 0 0 31px; }
  .result-footnote { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); font-size: .87rem; color: #b9c2d6; font-style: italic; }
  .pr-badge { display:inline-flex; align-items:center; gap:4px; margin-left:8px; padding:2px 10px; border-radius:999px; background:var(--core-bg); color:var(--core-text); font-size:.72rem; font-weight:800; }

  /* ---- Streak banner ---- */
  .streak-banner { display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin:-6px 0 22px; font-size:.88rem; color:var(--text-700); }
  .streak-banner strong { color:var(--accent-dark); }
  @media (max-width: 560px) {
    .app-body { padding-left:14px; padding-right:14px; }
    .exercise-block { padding:17px 14px; }
    .set-row { grid-template-columns:44px minmax(64px,1fr) minmax(56px,.8fr) minmax(42px,.65fr) 48px; gap:5px; }
    .set-row input { padding:9px 6px; }
    .extra-exercise-picker-row { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header class="app-header">
  <span class="brand" style="font-size:1rem;">
    <span class="brand-mark">DC</span>
    <span class="brand-mini">David Training Program</span>
  </span>
  <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <a href="nutrition.html" class="btn btn-primary" style="padding:8px 16px;">Dinh dưỡng</a>
    <a href="history.html" class="btn btn-outline" style="padding:8px 16px;">Lịch sử</a>
    <a href="progress-photos.html" class="btn btn-outline" style="padding:8px 16px;">Ảnh tiến trình</a>
    <button class="btn btn-outline" id="logout-btn" style="padding:8px 16px;">Đăng xuất</button>
  </div>
</header>

<div id="boot-status" class="app-loading" aria-label="Đang tải"><div class="app-loading-line short"></div><div class="app-loading-line"></div><div class="app-loading-line"></div></div>

<div class="app-body" id="app-content">
  <span class="eyebrow">Chào <span id="student-name"></span></span>
  <h1 style="font-size:1.6rem;">Hôm nay mình tập gì?</h1>
  <p class="day-sub">Chọn buổi tập. Các mức tạ và ghi chú David đã chuẩn bị sẵn cho bạn.</p>
  <div class="streak-banner" id="streak-banner"></div>
  <div class="day-list" id="day-list"></div>

  <div class="card" id="pre-start-panel">
    <h3 id="pre-start-title"></h3>
    <p class="pre-start-summary" id="pre-start-summary"></p>
    <div class="field" style="max-width:220px; margin-bottom:16px;">
      <label>Ngày tập</label>
      <input type="date" id="performed-date">
    </div>
    <button class="btn btn-primary" id="start-routine-btn" style="width:100%;justify-content:center;">Bắt đầu buổi tập</button>
  </div>

  <div id="day-content">
    <div class="session-timer-bar" id="session-timer-bar">Thời gian tập <span id="session-timer">0:00</span></div>
    <div id="exercise-blocks"></div>
    <div class="extra-exercise-area">
      <button type="button" class="btn btn-outline" id="open-extra-exercise">+ Thêm bài tập ngoài giáo án</button>
      <div class="extra-exercise-picker" id="extra-exercise-picker">
        <label for="extra-exercise-search" style="font-weight:700;font-size:.86rem;">Chọn bài muốn tập thêm</label>
        <input type="search" id="extra-exercise-search" placeholder="Tìm tên bài tập…" autocomplete="off">
        <div class="extra-exercise-picker-row">
          <select id="extra-exercise-select"></select>
          <button type="button" class="btn btn-primary" id="add-extra-exercise">Thêm vào buổi</button>
        </div>
        <p class="small-note" style="margin:8px 0 0;">Bài này chỉ có trong buổi hôm nay. Mức tạ và tiến trình vẫn được ghi nhớ cho lần sau.</p>
      </div>
    </div>
    <div class="field" style="margin-bottom:18px;">
      <label>Ghi chú (tuỳ chọn)</label>
      <textarea id="client-note" rows="2" placeholder="Cảm nhận hôm nay, chỗ nào khó, điều muốn nhắn cho David…" style="width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid var(--border);font-family:var(--font);"></textarea>
    </div>
    <button class="btn btn-primary" id="submit-session-btn" style="width:100%;justify-content:center;">Ghi nhận buổi tập</button>
  </div>

  <div class="result-panel show" id="next-up" style="margin-top:28px;">
    <strong style="font-size:.9rem;color:#b9c2d6;" id="next-up-title">ĐÃ GHI NHẬN — LẦN SAU BẠN TẬP</strong>
    <div id="next-up-list" style="margin-top:14px;"></div>
    <p class="result-footnote" id="next-up-footnote"></p>
  </div>
</div>

<script type="module">
import { auth } from './firebase-init.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
import { getMyRole, getStudent, getActivePhaseAssignments, logSessionAndAdvance, listSessionHistory, listExtraExerciseStates } from './training-data.js';
import { SCHEME, getInitialPrescription } from './progression-engine.js';
import { getExerciseById, groupExercisesByMuscleGroup } from './exercise-seed-data.js';
import { buildCompletedExerciseEntries } from './session-entry-utils.js';
import { MAX_SESSION_SETS, clampSessionSetCount, createInitialExtraState, isDuplicateSessionExercise } from './workout-session-utils.js';

// Classic barbell lifts stay locked to their exact assigned exercise — no substitution.
const PROTECTED_EXERCISE_IDS = ['squat', 'bench_press', 'barbell_row'];

let studentUid = null;
let assignments = [];
let selectedDay = null;
let extraExerciseStates = new Map();
let currentSessionId = null;

const $ = (id) => document.getElementById(id);

const OUTCOME_ICON = {
  up: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/><path d="M14 6h7v7"/></svg>',
  hold: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  down: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  sub: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
};
const OUTCOME_LABEL = { up: 'Tiến bộ rồi đó', hold: 'Đúng kế hoạch', down: 'Giữ nguyên lần sau', sub: 'Đã đổi bài tập' };
const OUTCOME_MSG = {
  up: 'Bạn làm tốt hơn kế hoạch — lần sau sẽ nặng/nhiều hơn một chút.',
  hold: 'Đúng như dự kiến — cứ tiếp tục nhịp độ này.',
  down: 'Chưa đạt hết lần này, không sao cả — giữ nguyên mức này và thử lại vào buổi sau.',
  sub: 'Buổi này bạn tập bài thay thế — Training Max/tạ của bài gốc không đổi, lần sau vẫn tập lại như kế hoạch cũ.',
};

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  const role = await getMyRole(user.uid);
  if (role !== 'student') { location.href = 'login.html'; return; }
  studentUid = user.uid;
  const profile = await getStudent(studentUid);
  $('student-name').textContent = profile ? profile.displayName : '';
  $('performed-date').value = new Date().toISOString().slice(0, 10);
  $('boot-status').style.display = 'none';
  $('app-content').style.display = 'block';
  await loadAssignments();
  await renderStreak();
});

$('logout-btn').addEventListener('click', async () => { await signOut(auth); location.href = 'login.html'; });

// ---- Consistency streak: how many of the last 4 (7-day) weeks had at least one session ----
async function renderStreak() {
  let sessions = [];
  try {
    sessions = await listSessionHistory(studentUid, { max: 60 });
  } catch (err) {
    console.error('renderStreak: listSessionHistory failed', err);
    return; // best-effort — no banner rather than breaking the page
  }
  if (!sessions.length) return; // brand new student — nothing to show yet

  const dayMs = 24 * 60 * 60 * 1000;
  const weekMs = 7 * dayMs;
  const now = Date.now();
  let weeksActive = 0;
  for (let w = 0; w < 4; w++) {
    const bucketEnd = now - w * weekMs;
    const bucketStart = bucketEnd - weekMs;
    const hasSession = sessions.some((s) => {
      const t = s.performedAt && s.performedAt.toDate ? s.performedAt.toDate().getTime() : null;
      return t != null && t > bucketStart && t <= bucketEnd;
    });
    if (hasSession) weeksActive++;
  }

  const banner = $('streak-banner');
  const msg = weeksActive === 4
    ? `Bạn đã tập đều cả <strong>4/4 tuần</strong> gần đây. Giữ nhịp này nhé.`
    : weeksActive === 0
      ? `Chưa có buổi tập nào trong 4 tuần gần đây — quay lại lịch tập đều nhé, mỗi buổi đều có giá trị.`
      : `Bạn đã tập đều trong <strong>${weeksActive}/4 tuần</strong> gần đây — cố giữ nhịp độ này nhé.`;
  banner.innerHTML = msg;
  banner.style.display = 'block';
}

async function loadAssignments() {
  assignments = await getActivePhaseAssignments(studentUid);
  try {
    const storedExtraStates = await listExtraExerciseStates(studentUid);
    extraExerciseStates = new Map(storedExtraStates.map((item) => [item.exerciseId || item.id, item]));
  } catch (err) {
    console.warn('Chưa thể tải tiến trình bài tập thêm:', err);
    extraExerciseStates = new Map();
  }
  const days = [...new Set(assignments.map((a) => a.dayLabel))];
  const list = $('day-list');
  list.innerHTML = '';
  if (!days.length) {
    list.innerHTML = '<p class="small-note">Chưa có giáo án nào được thiết lập. Liên hệ David.</p>';
    return;
  }
  days.forEach((day) => {
    const chip = document.createElement('div');
    chip.className = 'day-chip';
    chip.textContent = 'Buổi ' + day;
    chip.addEventListener('click', () => selectDay(day));
    list.appendChild(chip);
  });
}

let pendingDayAssignments = [];

function selectDay(day) {
  saveDraft(); // capture final state of whatever day was in progress before switching away
  selectedDay = day;
  $('next-up').style.display = 'none';
  $('day-content').style.display = 'none';
  document.querySelectorAll('.day-chip').forEach((c) => c.classList.toggle('active', c.textContent === 'Buổi ' + day));
  pendingDayAssignments = assignments.filter((a) => a.dayLabel === day).sort((a, b) => (a.orderInDay || 0) - (b.orderInDay || 0));
  $('pre-start-title').textContent = 'Buổi ' + day;
  $('pre-start-summary').textContent = `${pendingDayAssignments.length} bài tập: ` +
    pendingDayAssignments.map((a) => a.exerciseNameSnapshot.vi).join(', ');
  $('pre-start-panel').style.display = 'block';
  $('pre-start-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---- Session draft autosave ----
// Saved to localStorage (not Firestore) — the actual failure mode this protects against
// is the browser tab getting killed/reloaded mid-session (backgrounded app, weak wifi
// causing a reload, accidental back button), which is a same-device event localStorage
// survives. Cleared once the session is actually submitted.
const DRAFT_VERSION = 2;
function draftKey(day) { return `dtp_draft_v${DRAFT_VERSION}_${studentUid}_${day}`; }

function collectDraft() {
  const exercises = [];
  document.querySelectorAll('.exercise-block').forEach((block) => {
    const rows = [...block.querySelectorAll('.set-row')].slice(1); // skip header row
    const sets = rows.map((row) => ({
      weight: row.querySelector('.set-weight').value,
      reps: row.querySelector('.set-reps').value,
      rir: row.querySelector('.set-rir').value,
      done: row.classList.contains('set-done'),
    }));
    exercises.push({
      source: block.dataset.source || 'assigned',
      assignmentId: block.dataset.assignmentId,
      exerciseId: block.dataset.exerciseId || '',
      substitutedExerciseId: block.dataset.substitutedExerciseId || '',
      setCount: block.querySelector('.set-count-input').value,
      plannedSetCount: block.dataset.plannedSetCount || '',
      restDeadline: block.dataset.restDeadline || '',
      restLabel: block.dataset.restLabel || '',
      sets,
    });
  });
  return {
    day: selectedDay,
    performedDate: $('performed-date').value,
    clientNote: $('client-note').value,
    sessionStartTime,
    sessionId: currentSessionId,
    exercises,
    savedAt: Date.now(),
  };
}

function saveDraft() {
  if (!selectedDay || !studentUid) return;
  if ($('day-content').style.display === 'none') return;
  try { localStorage.setItem(draftKey(selectedDay), JSON.stringify(collectDraft())); }
  catch (e) { /* storage full/unavailable — best-effort only, skip silently */ }
}

function loadDraft(day) {
  try {
    const raw = localStorage.getItem(draftKey(day));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function clearDraft(day) {
  try { localStorage.removeItem(draftKey(day)); } catch (e) { /* ignore */ }
}

function applyDraft(draft) {
  $('performed-date').value = draft.performedDate || $('performed-date').value;
  $('client-note').value = draft.clientNote || '';
  sessionStartTime = draft.sessionStartTime || Date.now();
  currentSessionId = draft.sessionId || currentSessionId || createSessionId();

  draft.exercises.forEach((savedEx) => {
    let block;
    if (savedEx.source === 'extra' && savedEx.exerciseId) {
      block = document.querySelector(`.exercise-block[data-source="extra"][data-exercise-id="${savedEx.exerciseId}"]`);
      if (!block) {
        block = renderExtraExerciseBlock(savedEx.exerciseId);
        if (block) $('exercise-blocks').appendChild(block);
      }
    } else {
      block = document.querySelector(`.exercise-block[data-assignment-id="${savedEx.assignmentId}"]`);
    }
    if (!block) return; // assignment removed/changed since the draft was saved

    if (savedEx.substitutedExerciseId) {
      const swapSelect = block.querySelector('.exercise-swap-select');
      if (swapSelect) {
        swapSelect.value = savedEx.substitutedExerciseId;
        swapSelect.dispatchEvent(new Event('change'));
      }
    }

    const setCountInput = block.querySelector('.set-count-input');
    setCountInput.value = savedEx.setCount;
    setCountInput.dispatchEvent(new Event('change'));

    const rows = [...block.querySelectorAll('.set-row')].slice(1);
    rows.forEach((row, idx) => {
      const s = savedEx.sets[idx];
      if (!s) return;
      row.querySelector('.set-weight').value = s.weight;
      row.querySelector('.set-reps').value = s.reps;
      row.querySelector('.set-rir').value = s.rir;
      if (s.done) {
        row.classList.add('set-done');
        row.querySelector('.set-done-btn').textContent = '✓';
        [...row.querySelectorAll('input')].forEach((inp) => { inp.disabled = true; });
      }
    });

    if (savedEx.restDeadline && block._resumeRest) {
      block._resumeRest(Number(savedEx.restDeadline), savedEx.restLabel);
    }
  });
}

// Autosave on any manual edit too (debounced), not just on "Xong" — covers corrections
// typed mid-set before it's marked done.
let draftSaveDebounce = null;
$('day-content').addEventListener('input', () => {
  clearTimeout(draftSaveDebounce);
  draftSaveDebounce = setTimeout(saveDraft, 800);
});

// The moment the student switches away is exactly when we most need a fresh save —
// this is the concrete case behind "bị thoát ra khỏi web trong lúc tập".
document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft(); });
window.addEventListener('pagehide', saveDraft);

// ---- Session timer ----
let sessionStartTime = null;
let sessionTimerHandle = null;

function createSessionId() {
  if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') return globalThis.crypto.randomUUID();
  return `session-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

function startRoutine() {
  const blocksEl = $('exercise-blocks');
  blocksEl.innerHTML = '';
  pendingDayAssignments.forEach((a) => blocksEl.appendChild(renderExerciseBlock(a)));
  $('pre-start-panel').style.display = 'none';
  $('day-content').style.display = 'block';
  $('day-content').scrollIntoView({ behavior: 'smooth', block: 'start' });

  const draft = loadDraft(selectedDay);
  let resumed = false;
  if (draft && draft.exercises && draft.exercises.length) {
    const minutesAgo = Math.round((Date.now() - draft.savedAt) / 60000);
    const wantsResume = confirm(
      `Bạn có buổi "Buổi ${selectedDay}" đang dang dở (lưu ${minutesAgo < 1 ? 'vài giây trước' : `${minutesAgo} phút trước`}) — tiếp tục buổi tập này?`
    );
    if (wantsResume) {
      applyDraft(draft);
      resumed = true;
    } else {
      clearDraft(selectedDay);
    }
  }

  if (!resumed) {
    sessionStartTime = Date.now();
    currentSessionId = createSessionId();
  }
  clearInterval(sessionTimerHandle);
  updateSessionTimer();
  sessionTimerHandle = setInterval(updateSessionTimer, 1000);
}

function updateSessionTimer() {
  const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  $('session-timer').textContent = `${m}:${String(s).padStart(2, '0')}`;
}

function stopSessionTimer() {
  clearInterval(sessionTimerHandle);
  sessionTimerHandle = null;
  if (sessionStartTime == null) return 0;
  const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
  sessionStartTime = null;
  return elapsed;
}

$('start-routine-btn').addEventListener('click', startRoutine);

// ---- Rest timer ----
// Inline per-exercise badge instead of a full-screen overlay. Deadlines are wall-clock
// timestamps (Date.now() + seconds*1000), not a decrementing counter, so the countdown is
// self-correcting even if the tab is backgrounded/throttled — and deadlines are persisted
// via saveDraft() so a rest in progress survives a reload or the student switching apps.

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function playRestEndSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) { /* Web Audio unavailable — silently skip the beep */ }
}

// Best-effort: a system notification when rest ends, so it's noticeable even if the
// student switched to another app. Only works while the browser/tab process is still
// alive in the background — if they fully close the app, no web page can fire this;
// that's a hard platform limit, not something a static site can work around.
function maybeRequestNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
}
function notifyRestDone(exerciseName) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification('Hết giờ nghỉ ⏱', {
      body: exerciseName ? `Tiếp tục: ${exerciseName}` : 'Quay lại tập tiếp nhé!',
      tag: 'rest-timer',
    });
  } catch (e) { /* ignore */ }
}

function plannedLineFor(assignment, planned, isRirScheme) {
  if (isRirScheme) {
    const stopHint = planned.targetRIR === 0
      ? 'dừng set cuối khi vừa hết sức'
      : `dừng set cuối khi còn khoảng ${planned.targetRIR} rep mới hết sức`;
    return `Hôm nay: <strong>${planned.weight} kg</strong> — ${planned.sets} set × ${planned.reps} rep. Cứ tập trung vào kỹ thuật, ${stopHint}.`;
  }
  return `Hôm nay: <strong>${planned.weight} kg</strong> — ${planned.sets} set × ${planned.reps} rep. Cố hết khả năng trong khung này, không cần vắt kiệt sức.`;
}

function substituteOptionsFor(assignment) {
  const original = getExerciseById(assignment.exerciseId);
  if (!original) return [];
  const group = groupExercisesByMuscleGroup().get(original.muscleGroup) || [];
  return group.filter((e) => e.exerciseId !== assignment.exerciseId && !PROTECTED_EXERCISE_IDS.includes(e.exerciseId));
}

function renderExerciseBlock(assignment, { source = 'assigned', extraWasStored = false } = {}) {
  const planned = getInitialPrescription({ scheme: assignment.scheme, schemeParams: assignment.schemeParams, state: assignment.state });
  const isRirScheme = assignment.scheme === SCHEME.LAST_SET_RIR;
  const plannedSets = planned.sets;
  const canSubstitute = source === 'assigned' && !PROTECTED_EXERCISE_IDS.includes(assignment.exerciseId);
  const maxSessionSets = Math.max(MAX_SESSION_SETS, plannedSets);

  const block = document.createElement('div');
  block.className = 'exercise-block';
  block.dataset.source = source;
  block.dataset.assignmentId = source === 'extra' ? '' : assignment.id;
  block.dataset.exerciseId = assignment.exerciseId;
  block.dataset.scheme = assignment.scheme;
  block.dataset.substitutedExerciseId = '';
  block.dataset.plannedSetCount = String(plannedSets);

  block.innerHTML = `
    <h3 class="exercise-title"></h3>
    ${source === 'extra' ? '<button type="button" class="extra-remove-btn">Bỏ bài thêm khỏi buổi này</button>' : ''}
    <p class="planned-line"></p>
    <div class="rest-badge">
      <span class="rest-badge-dot"></span>
      Nghỉ: <span class="rest-badge-time"></span>
      <button type="button" class="rest-badge-skip">Bỏ qua</button>
    </div>
    <div class="coach-note-wrap"></div>
    <div class="technique-wrap"></div>
    ${canSubstitute ? `
    <div class="exercise-swap-wrap">
      <button type="button" class="exercise-swap-btn">Đổi bài tập (máy đang bận, không có sẵn…)</button>
      <div class="exercise-swap-picker" style="display:none;">
        <select class="exercise-swap-select"></select>
        <button type="button" class="btn btn-outline exercise-swap-cancel" style="padding:8px 14px;">Huỷ</button>
      </div>
    </div>` : ''}
    <div class="field set-count-field">
      <label>Set hôm nay</label>
      <div class="set-count-control">
        <div class="set-count-stepper">
          <button type="button" class="set-count-minus" aria-label="Giảm một set">−</button>
          <input type="number" class="set-count-input" min="1" max="${maxSessionSets}" value="${plannedSets}" readonly aria-label="Số set hôm nay">
          <button type="button" class="set-count-plus" aria-label="Tăng một set">+</button>
        </div>
        <span class="set-adjust-note">Kế hoạch gốc: ${plannedSets} set · điều chỉnh chỉ áp dụng hôm nay</span>
      </div>
    </div>
    <div class="set-rows"></div>
  `;

  const titleEl = block.querySelector('.exercise-title');
  const plannedLineEl = block.querySelector('.planned-line');
  const coachNoteWrap = block.querySelector('.coach-note-wrap');
  const techniqueWrap = block.querySelector('.technique-wrap');
  const setCountInput = block.querySelector('.set-count-input');
  const setCountMinus = block.querySelector('.set-count-minus');
  const setCountPlus = block.querySelector('.set-count-plus');
  const setRowsEl = block.querySelector('.set-rows');
  const restBadge = block.querySelector('.rest-badge');
  const restBadgeTime = block.querySelector('.rest-badge-time');
  const restBadgeSkip = block.querySelector('.rest-badge-skip');
  let currentWeightDefault = planned.weight;
  let restHandle = null;
  let originalSetSnapshot = null;
  let originalSetCount = plannedSets;

  function tickRest() {
    const deadline = Number(block.dataset.restDeadline || 0);
    if (!deadline) { clearInterval(restHandle); return; }
    const remaining = Math.ceil((deadline - Date.now()) / 1000);
    if (remaining <= 0) { finishRest(); return; }
    restBadgeTime.textContent = formatClock(remaining);
  }

  function startRest(seconds, exerciseName) {
    clearInterval(restHandle);
    block.dataset.restDeadline = String(Date.now() + Math.max(1, seconds) * 1000);
    block.dataset.restLabel = exerciseName || '';
    restBadgeTime.textContent = formatClock(seconds);
    restBadge.classList.add('show');
    restHandle = setInterval(tickRest, 250);
    maybeRequestNotificationPermission();
    saveDraft();
  }

  // resumed=true means we're restoring an already-running rest after a reload/app-switch —
  // skip the sound/vibration/notification since the student didn't just finish a set.
  function finishRest({ resumed = false } = {}) {
    clearInterval(restHandle);
    restHandle = null;
    block.dataset.restDeadline = '';
    restBadge.classList.remove('show');
    if (!resumed) {
      playRestEndSound();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      notifyRestDone(block.dataset.restLabel);
    }
    saveDraft();
  }

  // Called from applyDraft() when resuming a session — reattaches the countdown to an
  // already-stored deadline instead of starting a fresh one.
  block._resumeRest = function resumeRest(deadline, label) {
    if (!deadline) return;
    const remaining = Math.ceil((deadline - Date.now()) / 1000);
    if (remaining <= 0) { block.dataset.restDeadline = ''; return; }
    block.dataset.restDeadline = String(deadline);
    block.dataset.restLabel = label || '';
    restBadgeTime.textContent = formatClock(remaining);
    restBadge.classList.add('show');
    clearInterval(restHandle);
    restHandle = setInterval(tickRest, 250);
  };

  restBadgeSkip.addEventListener('click', () => finishRest());

  function renderHeader(activeExerciseId, isSubstitute) {
    const ex = getExerciseById(activeExerciseId);
    const displayName = isSubstitute && ex ? ex.nameVi : assignment.exerciseNameSnapshot.vi;
    const videoLink = ex && ex.videoUrl
      ? ` <a href="${escapeHtml(ex.videoUrl)}" target="_blank" rel="noopener" style="font-size:.78rem;font-weight:600;">▶ Xem video</a>`
      : '';
    titleEl.innerHTML = `${escapeHtml(displayName)}${source === 'extra' ? '<span class="extra-badge">Tập thêm</span>' : ''}${videoLink}`;
    techniqueWrap.innerHTML = '';
    coachNoteWrap.innerHTML = '';

    if (isSubstitute) {
      plannedLineEl.innerHTML = `Bài thay thế hôm nay — giữ nguyên ${plannedSets} set × ${planned.reps} rep, tự chọn tạ phù hợp với sức hiện tại.`;
      techniqueWrap.innerHTML = '<p class="exercise-swap-note">Đổi tạm cho buổi này — Training Max/tạ của bài gốc không thay đổi.</p>';
    } else if (source === 'extra') {
      plannedLineEl.innerHTML = plannedLineFor(assignment, planned, isRirScheme);
      if (extraWasStored) {
        coachNoteWrap.innerHTML = `<p class="previous-performance">Mức đã ghi nhớ: <strong>${planned.weight || 0} kg × ${planned.sets} set × ${planned.reps} rep</strong>. Bạn vẫn có thể điều chỉnh set cho riêng hôm nay.</p>`;
      } else {
        coachNoteWrap.innerHTML = '<p class="previous-performance">Lần đầu tập thêm bài này — nhập mức tạ phù hợp. Hệ thống sẽ ghi nhớ cho lần sau.</p>';
      }
    } else {
      plannedLineEl.innerHTML = plannedLineFor(assignment, planned, isRirScheme);
      coachNoteWrap.innerHTML = assignment.note
        ? `<p class="coach-note">📌 Lưu ý từ David: ${escapeHtml(assignment.note)}</p>`
        : '';
    }
    if (ex && ex.technique && ex.technique.length) {
      techniqueWrap.innerHTML += `<details class="technique-details">
        <summary>Kỹ thuật chi tiết</summary>
        <ul>${ex.technique.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}</ul>
      </details>`;
    }
  }

  function snapshotSetRows() {
    return [...setRowsEl.querySelectorAll('.set-row')].slice(1).map((row) => ({
      weight: row.querySelector('.set-weight')?.value || '',
      reps: row.querySelector('.set-reps')?.value || '',
      rir: row.querySelector('.set-rir')?.value || '',
      done: row.classList.contains('set-done'),
    }));
  }

  function renderSetRows(savedSets = null) {
    const previousSets = savedSets ?? snapshotSetRows();
    const n = clampSessionSetCount(setCountInput.value, plannedSets, maxSessionSets);
    setCountInput.value = String(n);
    setRowsEl.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'set-row';
    header.innerHTML = `<span></span><span class="small-note">Tạ (kg)</span><span class="small-note">Rep</span><span class="small-note">${isRirScheme ? 'RIR (chỉ set cuối)' : ''}</span><span></span>`;
    setRowsEl.appendChild(header);
    for (let i = 1; i <= n; i++) {
      const row = document.createElement('div');
      row.className = 'set-row';
      const showRir = isRirScheme && i === n;
      const saved = previousSets[i - 1];
      row.innerHTML = `
        <span class="set-idx">Set ${i}</span>
        <input type="number" step="0.5" class="set-weight" value="${escapeHtml(saved?.weight ?? (currentWeightDefault || ''))}" placeholder="${currentWeightDefault ? '' : 'kg'}">
        <input type="number" class="set-reps" value="${escapeHtml(saved?.reps ?? planned.reps)}">
        <input type="number" class="set-rir" value="${escapeHtml(saved?.rir ?? (planned.targetRIR ?? 0))}" ${showRir ? '' : 'style="visibility:hidden;"'}>
        <button type="button" class="set-done-btn">Xong</button>
      `;
      const doneBtn = row.querySelector('.set-done-btn');
      doneBtn.addEventListener('click', () => {
        if (row.classList.contains('set-done')) return;
        row.classList.add('set-done');
        doneBtn.textContent = '✓';
        [...row.querySelectorAll('input')].forEach((inp) => { inp.disabled = true; });
        const restEx = getExerciseById(block.dataset.substitutedExerciseId) || getExerciseById(assignment.exerciseId);
        // startRest() also autosaves — this is the moment progress that must not be lost
        // actually happened, so it must never be skipped.
        startRest(assignment.schemeParams.restSeconds || 90, restEx ? restEx.nameVi : assignment.exerciseNameSnapshot.vi);
      });
      if (saved?.done) {
        row.classList.add('set-done');
        doneBtn.textContent = '✓';
        [...row.querySelectorAll('input')].forEach((input) => { input.disabled = true; });
      }
      setRowsEl.appendChild(row);
    }
  }
  function changeSetCount(delta) {
    const requested = clampSessionSetCount(Number(setCountInput.value) + delta, plannedSets, maxSessionSets);
    const completedCount = setRowsEl.querySelectorAll('.set-row.set-done').length;
    if (requested < completedCount) {
      alert(`Bạn đã hoàn thành ${completedCount} set nên không thể giảm thấp hơn.`);
      return;
    }
    setCountInput.value = String(requested);
    renderSetRows();
    saveDraft();
  }
  setCountMinus.addEventListener('click', () => changeSetCount(-1));
  setCountPlus.addEventListener('click', () => changeSetCount(1));
  setCountInput.addEventListener('change', () => { renderSetRows(); saveDraft(); });

  if (canSubstitute) {
    const swapBtn = block.querySelector('.exercise-swap-btn');
    const swapPicker = block.querySelector('.exercise-swap-picker');
    const swapSelect = block.querySelector('.exercise-swap-select');
    const swapCancel = block.querySelector('.exercise-swap-cancel');
    const options = substituteOptionsFor(assignment);
    swapSelect.innerHTML = options.map((e) => `<option value="${e.exerciseId}">${escapeHtml(e.nameVi)}</option>`).join('');

    swapBtn.addEventListener('click', () => {
      swapPicker.style.display = swapPicker.style.display === 'none' ? 'flex' : 'none';
    });
    swapSelect.addEventListener('change', () => {
      const newId = swapSelect.value;
      if (!block.dataset.substitutedExerciseId) {
        originalSetSnapshot = snapshotSetRows();
        originalSetCount = Number(setCountInput.value) || plannedSets;
      }
      block.dataset.substitutedExerciseId = newId;
      currentWeightDefault = null;
      renderHeader(newId, true);
      renderSetRows([]);
      saveDraft();
    });
    swapCancel.addEventListener('click', () => {
      swapPicker.style.display = 'none';
      block.dataset.substitutedExerciseId = '';
      currentWeightDefault = planned.weight;
      renderHeader(assignment.exerciseId, false);
      setCountInput.value = String(originalSetCount);
      renderSetRows(originalSetSnapshot || []);
      originalSetSnapshot = null;
      originalSetCount = plannedSets;
      saveDraft();
    });
  }

  if (source === 'extra') {
    block.querySelector('.extra-remove-btn').addEventListener('click', () => {
      const hasCompletedSet = block.querySelector('.set-row.set-done');
      if (hasCompletedSet && !confirm('Bài này đã có set hoàn thành. Bạn vẫn muốn bỏ khỏi buổi hôm nay?')) return;
      block.remove();
      saveDraft();
    });
  }

  renderHeader(assignment.exerciseId, false);
  renderSetRows();

  return block;
}

function renderExtraExerciseBlock(exerciseId) {
  const exercise = getExerciseById(exerciseId);
  if (!exercise) return null;
  const stored = extraExerciseStates.get(exerciseId);
  const assignmentLike = {
    id: '',
    exerciseId,
    exerciseNameSnapshot: { vi: exercise.nameVi },
    scheme: stored?.scheme || exercise.defaultScheme,
    schemeParams: stored?.schemeParams || exercise.defaultParams,
    state: stored?.state || createInitialExtraState(exercise),
    note: '',
  };
  return renderExerciseBlock(assignmentLike, { source: 'extra', extraWasStored: Boolean(stored) });
}

function populateExtraExerciseSelect(queryText = '') {
  const select = $('extra-exercise-select');
  const query = queryText.trim().toLocaleLowerCase('vi');
  select.innerHTML = '';
  groupExercisesByMuscleGroup().forEach((items, groupName) => {
    const matches = items.filter((exercise) => !query || exercise.nameVi.toLocaleLowerCase('vi').includes(query));
    if (!matches.length) return;
    const optgroup = document.createElement('optgroup');
    optgroup.label = groupName;
    matches.forEach((exercise) => {
      const option = document.createElement('option');
      option.value = exercise.exerciseId;
      option.textContent = exercise.nameVi;
      optgroup.appendChild(option);
    });
    select.appendChild(optgroup);
  });
}

$('open-extra-exercise').addEventListener('click', () => {
  $('extra-exercise-picker').classList.toggle('show');
  if ($('extra-exercise-picker').classList.contains('show')) $('extra-exercise-search').focus();
});
$('extra-exercise-search').addEventListener('input', (event) => populateExtraExerciseSelect(event.target.value));
$('add-extra-exercise').addEventListener('click', () => {
  const exerciseId = $('extra-exercise-select').value;
  if (!exerciseId) {
    alert('Không tìm thấy bài tập phù hợp.');
    return;
  }
  const activeIds = [...document.querySelectorAll('.exercise-block')].flatMap((block) => [
    block.dataset.exerciseId,
    block.dataset.substitutedExerciseId,
  ]).filter(Boolean);
  if (isDuplicateSessionExercise(exerciseId, activeIds)) {
    alert('Bài này đã có trong buổi tập hôm nay rồi.');
    return;
  }
  const block = renderExtraExerciseBlock(exerciseId);

  $('exercise-blocks').appendChild(block);

});
populateExtraExerciseSelect();

$('submit-session-btn').addEventListener('click', async () => {
  const btn = $('submit-session-btn');
  const performedDate = $('performed-date').value;
  const clientNote = $('client-note').value.trim();
  const sessionExercises = [];

  document.querySelectorAll('.exercise-block').forEach((block) => {
    const source = block.dataset.source || 'assigned';
    const assignmentId = block.dataset.assignmentId;
    const exerciseId = block.dataset.exerciseId || null;
    const substitutedExerciseId = block.dataset.substitutedExerciseId || null;
    const rows = [...block.querySelectorAll('.set-row')].slice(1); // skip header row
    const sets = rows.map((row, idx) => ({
      setIndex: idx + 1,
      weight: row.querySelector('.set-weight').value,
      reps: row.querySelector('.set-reps').value,
      rir: row.querySelector('.set-rir').value,
      completed: row.classList.contains('set-done'),
    }));
    sessionExercises.push({
      source,
      assignmentId,
      exerciseId,
      sets,
      substitutedExerciseId,
      plannedSetCount: block.dataset.plannedSetCount,
      adjustedSetCount: block.querySelector('.set-count-input').value,
    });
  });

  const exerciseEntries = buildCompletedExerciseEntries(sessionExercises);
  if (exerciseEntries.length === 0) {
    alert('Hãy hoàn thành ít nhất 1 set trước khi ghi nhận buổi tập.');
    return;
  }

  const durationSeconds = sessionStartTime == null ? 0 : Math.floor((Date.now() - sessionStartTime) / 1000);

  btn.disabled = true;
  btn.textContent = 'Đang lưu…';
  try {
    const results = await logSessionAndAdvance(studentUid, {
      dayLabel: selectedDay,
      performedAt: new Date(performedDate + 'T12:00:00'),
      clientNote,
      durationSeconds,
      exerciseEntries,
      sessionId: currentSessionId,
    });
    stopSessionTimer();
    clearDraft(selectedDay);
    currentSessionId = null;
    showNextUp(results);
    $('day-content').style.display = 'none';
    document.querySelectorAll('.day-chip').forEach((c) => c.classList.remove('active'));
    await loadAssignments(); // refresh in case state affects display later
  } catch (err) {
    console.error(err);
    alert('Lỗi khi ghi nhận buổi tập: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ghi nhận buổi tập';
  }
});

function showNextUp(results) {
  const listEl = $('next-up-list');
  listEl.innerHTML = '';
  let anyDown = false;
  let allUp = results.length > 0;
  const prCount = results.filter((r) => r.isPR).length;

  results.forEach((r) => {
    const assignment = assignments.find((a) => a.id === r.assignmentId);
    let name = r.exerciseName || (assignment ? assignment.exerciseNameSnapshot.vi : (getExerciseById(r.exerciseId)?.nameVi || r.assignmentId));
    if (r.substitutedExerciseId) {
      const subEx = getExerciseById(r.substitutedExerciseId);
      if (subEx) name += ` (đã tập: ${subEx.nameVi})`;
    }
    const rx = r.nextPrescription;
    const outcome = r.outcome || 'hold';
    if (outcome === 'down') anyDown = true;
    if (outcome !== 'up') allUp = false;

    const prBadge = r.isPR ? '<span class="pr-badge">🏆 Kỷ lục mới</span>' : '';

    const div = document.createElement('div');
    div.className = 'result-item outcome-' + outcome;
    div.innerHTML = `
      <div class="outcome-head"><span class="outcome-icon">${OUTCOME_ICON[outcome]}</span>${escapeHtml(name)} — ${OUTCOME_LABEL[outcome]}${prBadge}</div>
      <div class="outcome-msg">${OUTCOME_MSG[outcome]}</div>
      <div class="outcome-next">Buổi sau: <strong>${rx.weight} kg × ${rx.sets} set × ${rx.reps} rep</strong></div>
    `;
    listEl.appendChild(div);
  });

  const baseFootnote = allUp
    ? 'Cả buổi đều tiến bộ — làm rất tốt. Cứ giữ nhịp độ đều đặn như vậy.'
    : anyDown
      ? 'Có bài chưa đạt cũng bình thường — điều quan trọng nhất là bạn vẫn có mặt hôm nay.'
      : 'Buổi tập ổn định, đúng kế hoạch — sự đều đặn này chính là thứ tạo ra kết quả lâu dài.';
  $('next-up-footnote').textContent = prCount > 0
    ? `🏆 ${prCount} kỷ lục cá nhân mới trong buổi này! ${baseFootnote}`
    : baseFootnote;

  $('next-up').style.display = 'block';
  $('next-up').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) { return String(str ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
